name: heavy-lanes
# Opt-in dependency lanes ("heavy lanes": sim, libero, robocasa, gr00t,
# maniskill3, …) for the tests tools/select_tests.py selects for a diff.
#
# Runs ONLY via workflow_dispatch, and nobody has to click it: the
# heavy-lanes-trigger workflow (tools/heavy_lanes_trigger.py) dispatches it on
# a PR's branch once that PR's head commit is ready — up to date with master,
# every other check green, every review thread resolved, not a draft. Until
# then the required `heavy-lanes` check shows "Expected — waiting", exactly
# like the old environment-approval gate, minus the approval. It is never
# posted by a pull_request run, so it can't read as skipped ⇒ success before
# the lanes have actually run. A maintainer can still dispatch it by hand
# (Actions → heavy-lanes → "Run workflow"), e.g. to re-run a PR early.
#
# The result reaches the PR as a COMMIT STATUS named `heavy-lanes` on the
# tested commit (`sha` input, else the dispatched commit), posted by the gate
# job. A workflow_dispatch run's own check runs are not linked to any PR, so
# without the status the PR would show "Expected — waiting" forever, pass or
# fail.
#
# Fork PRs: workflow_dispatch cannot target a fork branch, so the trigger
# dispatches on `heavy-lanes/fork-<pr>`, a branch it points at a copy of the
# base branch's tree, with `sha` = the fork head. This file therefore comes
# from the base branch (reviewed), never from the fork; the branch is its own
# cache scope, so fork code cannot plant a cache entry that base-branch runs
# restore. The lane jobs check out `sha` with the workflow's read-only token
# and no secrets — what a fork pull_request run gets. The gate job, the only
# job that can write statuses, checks out the workflow's own ref, never `sha`.
#
# Job graph:
#   lanes-select ── lane (matrix, one job per opt-in dependency group) ── heavy-lanes
#                                                                         (required
#                                                                          check +
#                                                                          ledger attest)
#
# Each lane is its own matrix job/runner/venv, so wall-clock is close to the
# SLOWEST lane instead of the SUM of all of them, and lanes cannot
# contaminate each other's venv. Selection is shared with test-selective.yml
# via .github/actions/select-tests. The `select` job is named `lanes-select`
# here so its check run is distinguishable from test-selective's `select`
# (heavy_lanes_trigger.py excludes this workflow's own checks by name).

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      base:
        description: "diff base ref"
        required: false
        default: "origin/master"
      head:
        description: "diff head ref"
        required: false
        default: "HEAD"
      sha:
        description: "commit to test and report `heavy-lanes` on (default: the dispatched ref)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lanes-select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      any: ${{ steps.select.outputs.any }}
      full_run: ${{ steps.select.outputs.full_run }}
      isolated_targets: ${{ steps.select.outputs.isolated_targets }}
      requirement_targets_json: ${{ steps.select.outputs.requirement_targets_json }}
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          # Full history so `git diff <base>...<head>` (merge-base) resolves.
          fetch-depth: 0

      - uses: ./.github/actions/select-tests
        id: select

  # One job per opt-in dependency lane (sim, libero, robocasa, …). Because
  # each lane is its own runner/venv, the cross-lane venv contamination the
  # old single-job design had to work around (see the robosuite reinstall
  # comment below) cannot happen between lanes — only within a single lane's
  # own setup.
  lane:
    needs: lanes-select
    if: needs.lanes-select.outputs.any == 'true' && needs.lanes-select.outputs.lanes != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.lanes-select.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/setup-test-env

      - name: Run opt-in dependency lane ${{ matrix.lane }}
        env:
          LANE: ${{ matrix.lane }}
          TARGETS: ${{ matrix.targets }}
          ISOLATED_TARGETS: ${{ needs.lanes-select.outputs.isolated_targets }}
          LEDGER: ${{ runner.temp }}/lane-ledger.jsonl
        run: |
          # Accounting is done by tools/lane_report.py against pytest's
          # junit XML, not by grepping the terse summary. Two reasons
          # (issue #163):
          #  * "any skip fails the lane" is right for anything this runner
          #    CAN provide and wrong for anything it cannot. The report
          #    attributes a skip to a DECLARED capability gap
          #    ([capability_gaps] in tools/test_selection.toml) and fails on
          #    every other skip, so a CUDA gate no longer reddens the lane
          #    while a real provisioning gap ("panda.srdf not installed")
          #    still does.
          #  * every lane writes a LEDGER record, uploaded as this job's own
          #    artifact; the heavy-lanes gate job merges every lane's ledger
          #    and cross-checks it against the selection. A lane that was
          #    selected and never executed is a hard failure instead of an
          #    absence.
          report_lane() {
            local lane_rc=0
            uv run --isolated --with pydantic --python 3.12 \
              python tools/lane_report.py --ledger "$LEDGER" lane \
              --lane "$1" --exit-code "$2" "${@:3}" || lane_rc=1
            return "$lane_rc"
          }
          run_lane() {
            # `local` is load-bearing even with one lane per job: this
            # function still owns its own `rc`, `xml_args`, `log`, etc., and
            # returning it explicitly is what makes the exit code below
            # correct. It used to matter more because the old single-job
            # workflow called this function 19 times in a row sharing one
            # caller-scope accumulator — a missing `local` here once let a
            # failing lane followed by a passing one report green, carrying
            # 12–13 hidden `::error::` messages. One job = one call removes
            # that failure mode; the function shape is kept unchanged from
            # test-selective's original single-job form so this diff is a
            # reshuffle, not a rewrite.
            local group="$1"
            local targets="$2"
            [ -z "$targets" ] && return 0
            local dependency_group="$group"
            local rc=0
            local xml_args=()
            local log
            local batched_xml
            extra_groups=()
            env_args=()
            if [ "$group" = "sim" ]; then
              extra_groups=(--group dataset)
              env_args=(MUJOCO_GL="${MUJOCO_GL:-egl}" PYOPENGL_PLATFORM="${PYOPENGL_PLATFORM:-egl}")
            elif [ "$group" = "robocasa-gr1" ]; then
              dependency_group="robocasa"
            fi
            echo "::group::pytest opt-in group=${group} targets=${targets}"
            log=$(mktemp)
            batched_xml="$RUNNER_TEMP/lane-${group}-batched.xml"
            python3 scripts/repair_hf_libero_install.py || true
            # robocasa + robocasa-gr1 both need robosuite 1.5.2 from the git
            # pin (232ce7d4). Each lane is now its own job/runner, so the
            # cross-lane contamination this reinstall originally guarded
            # against (the libero lane leaving robosuite 1.4.0 behind in a
            # SHARED venv, in the old single-job workflow) can no longer
            # happen — kept anyway, because a fresh `--group robocasa` sync
            # on its OWN still does not reliably land the git-pinned wheel
            # over whatever `uv` prefers (python/sim/src/openral_sim/_deps.py),
            # independent of any other lane. Removing it is a separate
            # change with its own evidence.
            if [ "$dependency_group" = "robocasa" ]; then
              uv sync --frozen --all-packages --group robocasa --reinstall-package robosuite
            fi
            if [ "$group" = "onnx-export" ]; then
              uv run --all-packages --group onnx-export python tools/export_rtdetr_onnx.py \
                --out rskills/rtdetr-coco-r18/model.onnx || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              if [ "$group" = "simpler-env" ] || [ "$group" = "robocasa-gr1" ]; then
                # verify_test_envs.py provisions these manual-install lanes and
                # drives their pytest; its junit report goes through the same
                # lane_report accounting as every other lane, so a declared
                # capability gap (no Vulkan on a hosted runner) is a skip, not a
                # failure. PIPESTATUS, not `| tee || rc=$?`: the step shell has
                # no pipefail, so that captured tee's 0 and these two lanes
                # reported green whatever verify_test_envs.py exited with.
                lane_xml="$RUNNER_TEMP/lane-${group}.xml"
                OPENRAL_ALLOW_ROBOCASA_ASSETS=1 uv run python tools/verify_test_envs.py \
                  --include-provisioned --groups "$group" --junit-xml "$lane_xml" 2>&1 | tee "$log"
                rc=${PIPESTATUS[0]}
                python3 scripts/repair_hf_libero_install.py || true
                # Exit 5 (everything skipped at collection) is judged by the
                # report, as in the isolated branch: a declared gap passes, and
                # an empty report fails as "collected no tests".
                if [ "$rc" -eq 5 ]; then rc=0; fi
                report_lane "$group" "$rc" --junit-xml "$lane_xml" || rc=1
              else
                # Partition selected targets: files flagged for per-process
                # isolation (ISOLATED_TARGETS, from tools/test_selection.toml
                # `isolate_globs`) run one-at-a-time in their own
                # interpreter. Real robosuite/MuJoCo EGL contexts do not
                # survive a sibling env's teardown in the same process — a
                # second LIBERO env then dies with "RethinkMount is not a
                # MujocoXML instance" even on the correct robosuite 1.4
                # (issue #24 class). The rest run together.
                batched=""
                isolated_here=""
                for t in $targets; do
                  case " $ISOLATED_TARGETS " in
                    *" $t "*) isolated_here="$isolated_here $t" ;;
                    *) batched="$batched $t" ;;
                  esac
                done
                if [ -n "$batched" ] && [ "$group" = "lowering" ]; then
                  # `lowering` is pure CPU (hull fitting, FK sampling; no GPU,
                  # EGL or forking pools) and ran as one 9 min process on a
                  # 4-vCPU runner. Split its files round-robin over 4
                  # concurrent pytest processes, each with its own junit XML
                  # for lane_report. Sync once first so the four `uv run`s
                  # find the env already satisfied.
                  uv sync --frozen --all-packages --group lowering --inexact
                  pids=()
                  plogs=()
                  for k in 0 1 2 3; do
                    # shellcheck disable=SC2086
                    part=$(printf '%s\n' $batched | awk -v k="$k" 'NF && (NR - 1) % 4 == k')
                    [ -z "$part" ] && continue
                    part_xml="$RUNNER_TEMP/lane-${group}-batched-${k}.xml"
                    plog=$(mktemp)
                    # shellcheck disable=SC2086
                    uv run --no-sync pytest $part \
                      -q -rs -p no:launch_testing -p no:launch_ros \
                      --junit-xml="$part_xml" >"$plog" 2>&1 &
                    pids+=("$!")
                    plogs+=("$plog")
                    xml_args+=(--junit-xml "$part_xml")
                  done
                  for i in "${!pids[@]}"; do
                    part_rc=0
                    wait "${pids[$i]}" || part_rc=$?
                    tee -a "$log" < "${plogs[$i]}"
                    # exit 5 == nothing collected; judged from the report.
                    if [ "$part_rc" -ne 0 ] && [ "$part_rc" -ne 5 ]; then rc=1; fi
                  done
                elif [ -n "$batched" ]; then
                  # selector-emitted space-separated list
                  # shellcheck disable=SC2086
                  env "${env_args[@]}" uv run --all-packages --group "$dependency_group" "${extra_groups[@]}" pytest $batched \
                    -q -rs -p no:launch_testing -p no:launch_ros \
                    --junit-xml="$batched_xml" 2>&1 | tee "$log" || rc=$?
                  python3 scripts/repair_hf_libero_install.py || true
                  xml_args+=(--junit-xml "$batched_xml")
                fi
                iso_n=0
                for t in $isolated_here; do
                  echo "::group::pytest (isolated) ${t}"
                  iso_n=$((iso_n + 1))
                  iso_xml="$RUNNER_TEMP/lane-${group}-iso-${iso_n}.xml"
                  iso_rc=0
                  env "${env_args[@]}" uv run --all-packages --group "$dependency_group" "${extra_groups[@]}" pytest "$t" \
                    -q -rs -p no:launch_testing -p no:launch_ros \
                    --junit-xml="$iso_xml" || iso_rc=$?
                  python3 scripts/repair_hf_libero_install.py || true
                  echo "::endgroup::"
                  # exit 5 == nothing collected (whole module
                  # importorskip'd): a legitimate all-skipped outcome,
                  # judged from the report.
                  if [ "$iso_rc" -ne 0 ] && [ "$iso_rc" -ne 5 ]; then rc=1; fi
                  xml_args+=(--junit-xml "$iso_xml")
                done
                report_lane "$group" "$rc" "${xml_args[@]}" || rc=1
              fi
            fi
            echo "::endgroup::"
            return "$rc"
          }

          run_lane "$LANE" "$TARGETS"

      - name: Upload lane ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lane-ledger-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-ledger.jsonl
          if-no-files-found: warn

  # The gate — named `heavy-lanes`, the required check in the master ruleset. Also the anti-vacuity gate (issue #163): merges
  # every lane's uploaded ledger and cross-checks it against the selector's
  # own output, so "tested nothing" and "tested everything and passed" can
  # no longer report the same result.
  heavy-lanes:
    needs: [lanes-select, lane]
    # `always()` so a failed `lanes-select` or lane still reaches the failure
    # check below instead of auto-skipping this job — a skipped job reports
    # success to required-check evaluation.
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job allowed to write statuses; it checks out the workflow's own
    # ref (never a fork `sha`), so no PR-supplied code runs with this token.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: false

      - name: Download lane ledgers
        if: needs.lanes-select.outputs.lanes != '[]'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: lane-ledger-*
          path: ledgers
          if-no-artifact-found: ignore

      - name: Merge ledgers and attest lane coverage
        if: needs.lanes-select.outputs.any == 'true'
        env:
          FULL_RUN: ${{ needs.lanes-select.outputs.full_run }}
          REQUIREMENT_TARGETS_JSON: ${{ needs.lanes-select.outputs.requirement_targets_json }}
          LEDGER: ${{ runner.temp }}/lane-ledger.jsonl
        run: |
          # Each lane job uploaded its own ledger artifact (one JSONL line,
          # name lane-ledger-<lane>); merge them back into the single file
          # tools/lane_report.py expects. Every lane's file lands in its own
          # `ledgers/lane-ledger-<lane>/` subdirectory (no merge-multiple),
          # so a download hiccup on one lane can't silently overwrite
          # another's line. `find` over an absent `ledgers/` (no lanes
          # selected) legitimately finds nothing — that is not an error.
          find ledgers -name '*.jsonl' -exec cat {} + > "$LEDGER" 2>/dev/null || true
          touch "$LEDGER"
          python3 - > "$RUNNER_TEMP/selection.json" <<'PY'
          import json, os, sys
          json.dump(
              {
                  "full_run": os.environ.get("FULL_RUN", "false"),
                  "requirement_targets_json": os.environ.get("REQUIREMENT_TARGETS_JSON") or "{}",
              },
              sys.stdout,
          )
          PY
          uv run --isolated --with pydantic --python 3.12 \
            python tools/lane_report.py --ledger "$LEDGER" attest \
            --selection-json "$RUNNER_TEMP/selection.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Require lanes-select and every lane to have succeeded or been skipped
        if: >-
          needs.lanes-select.result == 'failure' || needs.lanes-select.result == 'cancelled' ||
          needs.lane.result == 'failure' || needs.lane.result == 'cancelled'
        run: |
          echo "::error::lanes-select or a lane failed or was cancelled — see above."
          exit 1

      - name: Report heavy-lanes on the tested commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
          SELECT_RESULT: ${{ needs.lanes-select.result }}
          LANE_RESULT: ${{ needs.lane.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `error` on cancel: heavy_lanes_trigger.py re-dispatches a
          # cancelled run, but never a failed one (re-run failed lanes from
          # the run page; the re-run reaches this step again).
          if [ "$SELECT_RESULT" = cancelled ] || [ "$LANE_RESULT" = cancelled ]; then
            state=error; desc="Cancelled — heavy-lanes-trigger starts it again"
          elif [ "$JOB_STATUS" = success ]; then
            state=success; desc="Passed"
          else
            state=failure; desc="Failed — open Details for the failing lane"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context=heavy-lanes \
            -f description="$desc" -f target_url="$RUN_URL" > /dev/null

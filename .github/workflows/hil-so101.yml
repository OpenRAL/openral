# SO-101 bench arm — hardware-in-the-loop gate.
#
# The first HIL lane in this repo to have a physical rig behind it. It is
# INERT until someone registers a runner carrying BOTH labels below; with no
# such runner a dispatched run simply queues and expires, and nothing else in
# CI depends on it. Registering that runner is an org-settings action, not a
# repo change — see docs/contributing/development.md ("Registering a lab-so101
# HIL runner").
#
# MANUAL ONLY: no schedule trigger. The bench arm is not permanently attached
# to a runner, so this lane is fired by hand (Actions tab → "Run workflow")
# by whoever has the rig physically connected — a scheduled run against a
# disconnected/unpowered bench would just accumulate meaningless skips.
#
# NON-MOTION: tests/hil/test_so101_serial_live.py opens the serial bus, pings
# the servos and reads state. It never calls send_action or reset_to_pose —
# but connect() itself cycles servo torque off and back on, and a stale
# Goal_Position left from a previous session can make the arm twitch toward
# it right there, with no send_action involved. Whoever dispatches this job
# should be within reach of the arm's power switch, not just watching CI.
# Do not add a motion test to this lane without an attended-bench gate of the
# kind tests/hil/test_openarm_slot_group_motion.py uses.
name: HIL · SO-101

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One arm, one job. A queued run replaces nothing — it waits, because two
  # pytest processes fighting over /dev/ttyACM0 is the "port busy" skip.
  group: hil-so101
  cancel-in-progress: false

jobs:
  serial-live:
    # `lab-so101` is the rig label; the runner must also have the arm's serial
    # device present and be in the `dialout` group.
    runs-on: [self-hosted, lab-so101]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv python install 3.12
      - run: uv sync --locked --all-packages

      - name: SO-101 bench readiness (non-motion)
        run: uv run --locked --no-sync openral deploy validate --config scenes/deploy/so101_bench.yaml

      - name: SO-101 serial HIL (non-motion)
        # Not `just hil-so101`: that recipe swallows pytest's "nothing
        # collected" exits so a dev box without an arm sees a clean skip. On
        # the lab runner an empty collection means the rig regressed, and this
        # lane must go red for it.
        run: uv run --locked --no-sync pytest -q -rs tests/hil/test_so101_serial_live.py

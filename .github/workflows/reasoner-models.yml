name: reasoner-models
# openral.com's Account → Settings offers the curated reasoner models (REASONER_MODELS in
# openral_core) as a drop-down, from the website's server/reasoner-models.json. When the
# list changes on master, this regenerates that file (tools/export_reasoner_models.py)
# and merges it into the website's dev branch, the same way robot-ui.yml rolls out the
# UI pin; promote-to-main carries it to production. Needs ROBOT_UI_BOT_TOKEN (see
# robot-ui.yml); without it the job says what changed.
#
# Two jobs so the token never shares a runner with third-party code: `export` runs
# uv and the openral-core import with no secret and a read-only GITHUB_TOKEN, and
# hands the JSON over as an artifact; `sync` holds ROBOT_UI_BOT_TOKEN, has no
# GITHUB_TOKEN scopes and runs nothing but git/gh on that file. Not reachable from
# a fork: push to master and a dispatch on master only (no pull_request*).

on:
  push:
    branches: [master]
    paths:
      - "python/core/src/openral_core/schemas.py"
      - "tools/export_reasoner_models.py"
  workflow_dispatch:

permissions: {}

concurrency:
  group: reasoner-models
  cancel-in-progress: false

jobs:
  export:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      # openral-core and its deps from uv.lock (hash-checked).
      - name: export
        run: |
          set -euo pipefail
          mkdir -p out
          uv sync --frozen --package openral-core --no-default-groups --python 3.12
          .venv/bin/python tools/export_reasoner_models.py > out/reasoner-models.json
          cat out/reasoner-models.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: reasoner-models
          path: out/reasoner-models.json
          if-no-files-found: error
          retention-days: 1

  sync:
    needs: export
    # The bot token merges into the website: master only, in the same environment
    # as robot-ui.yml's pin job (see the setup notes there).
    if: github.ref == 'refs/heads/master'
    environment: robot-ui-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: reasoner-models
          path: ${{ runner.temp }}/export
      - name: website dev
        env:
          GH_TOKEN: ${{ secrets.ROBOT_UI_BOT_TOKEN }}  # this step only
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::ROBOT_UI_BOT_TOKEN not set: copy the export job's list to the website's server/reasoner-models.json by hand."
            exit 0
          fi
          git config --global user.name "openral-bot"
          git config --global user.email "openral-bot@users.noreply.github.com"
          gh auth setup-git
          gh repo clone OpenRAL/website website -- --branch dev --depth 1
          cd website
          cp "$RUNNER_TEMP/export/reasoner-models.json" server/reasoner-models.json
          if git diff --quiet; then
            echo "::notice::the website already offers these models"
            exit 0
          fi
          branch="bot/reasoner-models-${GITHUB_SHA::7}"
          git switch -c "$branch"
          git commit -qam "chore(accounts): offer openral's curated reasoner models (${GITHUB_SHA::7})"
          git push -q --force origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json url -q '.[0].url')
          [ -n "$pr" ] || pr=$(gh pr create --base dev --head "$branch" \
            --title "chore(accounts): offer openral's curated reasoner models" \
            --body "REASONER_MODELS as of OpenRAL/openral@${GITHUB_SHA}, opened by reasoner-models.yml.")
          gh pr merge "$pr" --merge --delete-branch || gh pr merge "$pr" --merge --auto \
            || { echo "::error::could not merge ${pr}: merge it by hand"; exit 1; }

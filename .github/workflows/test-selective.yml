name: test-selective
# Selective test execution — runs only the pytest targets a diff can actually
# observe, via tools/select_tests.py (see docs/contributing/selective-testing.md).
#
# This is the CHEAPEST suite and runs on every PR, selecting ~5–20% of the
# ~2.9k-test suite. Full `tests/sim/` and `tests/integration/` remain manual,
# but selected opt-in sim targets rerun here under their dependency group so
# "selected but skipped because an optional package is absent" is not a green PR.
# See tools/select_tests.py and tools/test_selection.toml for selection logic.
#
# Job graph:
#   select ──┬── core_full (matrix: 4 file-shards + isolated) ──┐
#            ├── core_selected ────────────────────────────────┴── select-and-test
#            └── lane (matrix, one job per opt-in dependency     (required check,
#                group, gated on the `heavy-lanes` environment)   every push)
#                                                          └── heavy-lanes
#                                                              (required check,
#                                                               waits for a
#                                                               maintainer to
#                                                               approve the
#                                                               `heavy-lanes`
#                                                               deployment)
#
# Speed-up design (in execution order):
#   1. Test selection runs FIRST, in its own cheap job. The selector only
#      needs pydantic + stdlib, so `uv run --isolated --with pydantic`
#      provides it in a few seconds without a workspace sync — `select` does
#      not even enable the uv cache.
#   2. `core_full` / `core_selected` / `lane` are skipped entirely when
#      nothing is selected (docs-only diffs, pure markdown changes, etc.).
#   3. The full `tests/unit/` suite (on a blast-radius diff) is split across
#      a 4-way file-based matrix plus one isolated-targets shard, instead of
#      running serially in one job.
#   4. Every opt-in dependency lane (sim, libero, robocasa, …) is its own
#      matrix job instead of 19 lanes run one after another — each pays its
#      own ~2 min setup, but they run in parallel, so wall-clock is close to
#      the SLOWEST lane instead of the SUM of all of them.
#   5. Lanes wait behind the `heavy-lanes` GitHub Environment, which requires
#      a maintainer to approve the deployment before any of them start. A
#      push that only touches something small still gets a green
#      `select-and-test` in a few minutes without waiting on the lanes at
#      all; `heavy-lanes` (also a required check) stays pending until
#      approved, which is what actually blocks the merge.
#   6. robot_descriptions / openarm asset clones are cached
#      (.github/actions/setup-test-env) instead of re-cloned every run.
#   7. A concurrency group cancels stale in-progress runs on the same branch
#      the moment a new push arrives.
#
# NB on `pull_request`: deliberately NO paths-ignore. `select-and-test` and
# `heavy-lanes` are REQUIRED status checks in the master ruleset. A job
# skipped by an `if:` condition still reports "success" to required-check
# evaluation (GitHub Actions docs, "Troubleshooting required status
# checks") — that part is fine. What is NOT fine is a *workflow* skipped by
# path/branch filtering: its checks stay "Pending" forever and block the
# merge. So the workflow always triggers; for a docs-only diff the selector
# finds no affected tests in a few seconds and every downstream job reports
# skipped (⇒ success) without the heavy uv sync / ffmpeg install.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      base:
        description: "diff base ref"
        required: false
        default: "origin/master"
      head:
        description: "diff head ref"
        required: false
        default: "HEAD"
  pull_request:
    branches: [master]
    # See the NB above — no paths-ignore, on purpose.

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      any: ${{ steps.select.outputs.any }}
      full_run: ${{ steps.select.outputs.full_run }}
      targets: ${{ steps.select.outputs.targets }}
      isolated_targets: ${{ steps.select.outputs.isolated_targets }}
      requirement_targets_json: ${{ steps.select.outputs.requirement_targets_json }}
      lanes: ${{ steps.select.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history so `git diff <base>...<head>` (merge-base) resolves.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          # No uv cache: this job only runs `uv run --isolated --with
          # pydantic`, never touches uv.lock or the workspace env. Enabling
          # the cache here would pay ~80s to restore 3.7 GB this job never
          # reads.
          enable-cache: false

      - run: uv python install 3.12

      - name: Resolve diff range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "base=${{ github.event.inputs.base }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.inputs.head }}" >> "$GITHUB_OUTPUT"
          fi

      # Run the selector BEFORE any heavy install so we can skip everything
      # downstream when nothing is selected (e.g. docs-only diffs).
      # select_tests.py only needs pydantic + stdlib; `--isolated --with
      # pydantic` gives us a tiny ephemeral env in a few seconds.
      - name: Select tests for the diff
        id: select
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # release-please's release PR is pure mechanical version churn: it
          # rewrites `version =` and the `openral-*==` pins across all 15
          # pyprojects and regenerates CHANGELOG.md, nothing else. Root
          # `pyproject.toml` is a full-run glob, so the selector would force
          # the ENTIRE suite plus every opt-in dependency lane — including
          # isaacsim / robotwin / gr00t, whose sidecars a hosted runner
          # cannot provision — for a diff that cannot change behaviour.
          # Every commit the release covers already passed this job on its
          # own PR.
          #
          # Emit an empty selection here rather than a job-level `if:` on
          # `select-and-test` / `heavy-lanes`: both are required checks, and
          # while a *job* skipped by `if:` still reports success (see the
          # workflow header), keeping this job itself green end-to-end is
          # simpler than reasoning about which downstream `if:` combination
          # produces the same result. `full_run` and `lanes` must be set
          # too: `core_full` is gated on `full_run` alone, `lane` on
          # `lanes`, everything else on `any`.
          #
          # Prefix per release-please's RELEASE_PLEASE_BRANCH_PREFIX
          # ("release-please--branches"); the glob also covers the
          # --components-- variant if separate-pull-requests is ever
          # enabled.
          case "${HEAD_REF:-}" in
            release-please--*)
              echo "::notice::release-please PR — lockstep version churn only, no tests selected."
              {
                echo "any=false"
                echo "full_run=false"
                echo "lanes=[]"
              } >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          uv run --isolated --with pydantic --python 3.12 \
            python tools/select_tests.py \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --github-output

      - name: No affected tests
        if: steps.select.outputs.any != 'true'
        run: echo "::notice::No code paths affected by this diff — no tests selected."

  # The full `tests/unit/` suite, split across a 4-way file-based matrix plus
  # one dedicated shard for `isolated_targets`. Only runs on a blast-radius
  # diff (`full_run`) — most PRs take `core_selected` below instead.
  core_full:
    needs: select
    if: needs.select.outputs.full_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Pin every native threadpool to a single thread as DEFENSE-IN-DEPTH.
    # Several tests fork lerobot's `compute_stats` multiprocessing pool; if
    # the fork lands in an interpreter that already spun up numpy/torch/
    # pyarrow threadpools, a forked child / C-extension `atexit` handler
    # crashes at Python finalization — the process exits non-zero *after* an
    # all-green run (issue #24/#25).
    #
    # NOTE: thread-pinning alone is NOT sufficient — a broad partition that
    # includes a forker still exits non-zero despite these vars (verified on
    # a real run). The reliable fix is RUNNING EACH FORKER ONE-PER-PROCESS
    # via the `isolate_globs` list in tools/test_selection.toml (the
    # selector peels them into `isolated_targets`, run alone below in the
    # `isolated` shard). These env vars stay as a cheap belt to reduce
    # pollution; isolation is what actually prevents the crash.
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
    strategy:
      fail-fast: false
      matrix:
        # File-based sharding (NR % 4 by sorted path) is unbalanced by
        # design — no per-test timing data is collected anywhere in this
        # repo to split on. ponytail: a timing-based split is the upgrade
        # if one shard measurably dominates.
        shard: ["0", "1", "2", "3", "isolated"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-test-env

      - name: Run shard ${{ matrix.shard }}
        env:
          ISOLATED_TARGETS: ${{ needs.select.outputs.isolated_targets }}
        run: |
          if [ "${{ matrix.shard }}" = "isolated" ]; then
            # isolated_targets fork a multiprocessing pool (lerobot
            # compute_stats); running each ALONE, in a fresh not-yet-threaded
            # interpreter, is what actually prevents the finalization crash
            # (issue #24/#25). Thread-pinning (job-level `env:` above) is
            # only defense-in-depth, so no inline env prefix is needed here.
            rc=0
            for t in $ISOLATED_TARGETS; do
              echo "::group::pytest (isolated) ${t}"
              iso_rc=0
              uv run pytest "$t" -q -p no:launch_testing -p no:launch_ros || iso_rc=$?
              echo "::endgroup::"
              # pytest exit 5 == "no tests collected": an isolated file whose
              # every test needs an optional extra (e.g. lerobot[dataset])
              # skips its whole module via importorskip. On a runner without
              # the extra that is a legitimate all-skipped outcome, not a
              # failure — only a real non-zero (1 failed / 2 interrupted /
              # 139 crash) fails.
              if [ "$iso_rc" -ne 0 ] && [ "$iso_rc" -ne 5 ]; then rc=1; fi
            done
            exit $rc
          fi

          ignore=""
          for t in $ISOLATED_TARGETS; do
            ignore="$ignore --ignore=$t"
          done
          files=$(find tests/unit -name 'test_*.py' | sort | awk -v k="${{ matrix.shard }}" 'NR % 4 == k')
          if [ -z "$files" ]; then
            echo "::notice::shard ${{ matrix.shard }} has no files."
            exit 0
          fi
          rc=0
          # intentional word-splitting of $files/$ignore
          # shellcheck disable=SC2086
          uv run pytest $files $ignore -q -p no:launch_testing -p no:launch_ros || rc=$?
          # pytest exit 5 == "no tests collected": every file in this shard
          # is module-level importorskip'd (or --ignore'd as an isolated
          # target) — a legitimate all-skipped outcome, not a failure. Same
          # rule as every other pytest invocation in this workflow (the
          # isolated shard above, core_selected, and each lane).
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then exit 1; fi
          exit 0

  # Everything below only runs on a non-blast-radius diff — the common case.
  core_selected:
    needs: select
    if: needs.select.outputs.full_run != 'true' && needs.select.outputs.any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-test-env

      - name: Run selected targets
        env:
          TARGETS: ${{ needs.select.outputs.targets }}
          ISOLATED_TARGETS: ${{ needs.select.outputs.isolated_targets }}
        run: |
          # Partition targets by their nearest `test`/`tests` directory and
          # run each partition in its OWN pytest process. Two directories
          # named `tests` (e.g. root `tests/` and
          # `python/observability/tests/`) both register their conftest.py
          # under the plugin name `tests.conftest`, so collecting them in a
          # single session aborts with "Plugin already registered under a
          # different name". One invocation per test-root keeps every
          # session collision-free. (--import-mode is already importlib via
          # pyproject addopts; consider_namespace_packages is NOT usable
          # here — it breaks the `from tests.integration...` imports several
          # unit tests rely on.)
          declare -A groups
          for t in $TARGETS; do
            root=$(printf '%s\n' "$t" | grep -oE '^.*/tests?(/|$)|^tests?(/|$)' | head -1 | sed 's#/$##')
            [ -z "$root" ] && root="$t"  # no test-root segment → its own group
            groups["$root"]="${groups["$root"]} $t"
          done
          # `isolated_targets` (issue #24) are already excluded from
          # `targets`, but a directory target may still *collect* them —
          # --ignore each from every partition; they run one-per-process
          # below.
          ignore=""
          for t in $ISOLATED_TARGETS; do
            ignore="$ignore --ignore=$t"
          done

          # Launch every test-root partition as a background job so they run
          # concurrently. Each group writes to its own temp log; we stream
          # the output only after all have finished (preserving GitHub log
          # ordering).
          declare -A pids
          declare -A logs
          for root in "${!groups[@]}"; do
            tmplog=$(mktemp)
            logs["$root"]="$tmplog"
            # intentional word-splitting of the space-separated per-group
            # target list and $ignore flags
            # shellcheck disable=SC2086
            uv run pytest ${groups["$root"]} $ignore \
              -q -p no:launch_testing -p no:launch_ros >"$tmplog" 2>&1 &
            pids["$root"]=$!
          done

          rc=0
          for root in "${!pids[@]}"; do
            group_rc=0
            wait "${pids[$root]}" || group_rc=$?
            echo "::group::pytest ${root}"
            cat "${logs[$root]}"
            echo "::endgroup::"
            # pytest exit 5 == "no tests collected": a selected partition
            # whose every test is module-level importorskip'd is
            # all-skipped, not failed.
            if [ "$group_rc" -ne 0 ] && [ "$group_rc" -ne 5 ]; then rc=1; fi
          done

          # isolated_targets run one-per-process (issue #24/#25): running
          # each forker ALONE, in a fresh not-yet-threaded interpreter, is
          # what actually prevents the finalization crash. Thread-pinning
          # (job-level `env:`) is only defense-in-depth, so no inline env
          # prefix is needed here.
          for t in $ISOLATED_TARGETS; do
            echo "::group::pytest (isolated) ${t}"
            iso_rc=0
            uv run pytest "$t" -q -p no:launch_testing -p no:launch_ros || iso_rc=$?
            echo "::endgroup::"
            if [ "$iso_rc" -ne 0 ] && [ "$iso_rc" -ne 5 ]; then rc=1; fi
          done
          exit $rc

  # One job per opt-in dependency lane (sim, libero, robocasa, …), gated on
  # the `heavy-lanes` GitHub Environment. GitHub holds every job in this
  # matrix at "Waiting" until a maintainer approves that environment's
  # pending deployment (Actions run page → "Review pending deployments"),
  # then all selected lanes start together. Because each lane is now its own
  # runner/venv, the cross-lane venv contamination the old single-job design
  # had to work around (see the robosuite reinstall comment below) cannot
  # happen between lanes any more — only within a single lane's own setup.
  lane:
    needs: select
    if: needs.select.outputs.any == 'true' && needs.select.outputs.lanes != '[]'
    environment: heavy-lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      RAYON_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      MUJOCO_GL: "osmesa"
      PYOPENGL_PLATFORM: "osmesa"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-test-env

      - name: Run opt-in dependency lane ${{ matrix.lane }}
        env:
          LANE: ${{ matrix.lane }}
          TARGETS: ${{ matrix.targets }}
          ISOLATED_TARGETS: ${{ needs.select.outputs.isolated_targets }}
          LEDGER: ${{ runner.temp }}/lane-ledger.jsonl
        run: |
          # Accounting is done by tools/lane_report.py against pytest's
          # junit XML, not by grepping the terse summary. Two reasons
          # (issue #163):
          #  * "any skip fails the lane" is right for anything this runner
          #    CAN provide and wrong for anything it cannot. The report
          #    attributes a skip to a DECLARED capability gap
          #    ([capability_gaps] in tools/test_selection.toml) and fails on
          #    every other skip, so a CUDA gate no longer reddens the lane
          #    while a real provisioning gap ("panda.srdf not installed")
          #    still does.
          #  * every lane writes a LEDGER record, uploaded as this job's own
          #    artifact; the heavy-lanes gate job merges every lane's ledger
          #    and cross-checks it against the selection. A lane that was
          #    selected and never executed is a hard failure instead of an
          #    absence.
          report_lane() {
            local lane_rc=0
            uv run --isolated --with pydantic --python 3.12 \
              python tools/lane_report.py --ledger "$LEDGER" lane \
              --lane "$1" --exit-code "$2" "${@:3}" || lane_rc=1
            return "$lane_rc"
          }
          run_lane() {
            # `local` is load-bearing even with one lane per job: this
            # function still owns its own `rc`, `xml_args`, `log`, etc., and
            # returning it explicitly is what makes the exit code below
            # correct. It used to matter more because the old single-job
            # workflow called this function 19 times in a row sharing one
            # caller-scope accumulator — a missing `local` here once let a
            # failing lane followed by a passing one report green, carrying
            # 12–13 hidden `::error::` messages. One job = one call removes
            # that failure mode; the function shape is kept unchanged from
            # test-selective's original single-job form so this diff is a
            # reshuffle, not a rewrite.
            local group="$1"
            local targets="$2"
            [ -z "$targets" ] && return 0
            local dependency_group="$group"
            local rc=0
            local xml_args=()
            local log
            local batched_xml
            extra_groups=()
            env_args=()
            if [ "$group" = "sim" ]; then
              extra_groups=(--group dataset)
              env_args=(MUJOCO_GL="${MUJOCO_GL:-egl}" PYOPENGL_PLATFORM="${PYOPENGL_PLATFORM:-egl}")
            elif [ "$group" = "robocasa-gr1" ]; then
              dependency_group="robocasa"
            fi
            echo "::group::pytest opt-in group=${group} targets=${targets}"
            log=$(mktemp)
            batched_xml="$RUNNER_TEMP/lane-${group}-batched.xml"
            python3 scripts/repair_hf_libero_install.py || true
            # robocasa + robocasa-gr1 both need robosuite 1.5.2 from the git
            # pin (232ce7d4). Each lane is now its own job/runner, so the
            # cross-lane contamination this reinstall originally guarded
            # against (the libero lane leaving robosuite 1.4.0 behind in a
            # SHARED venv, in the old single-job workflow) can no longer
            # happen — kept anyway, because a fresh `--group robocasa` sync
            # on its OWN still does not reliably land the git-pinned wheel
            # over whatever `uv` prefers (python/sim/src/openral_sim/_deps.py),
            # independent of any other lane. Removing it is a separate
            # change with its own evidence.
            if [ "$dependency_group" = "robocasa" ]; then
              uv sync --frozen --all-packages --group robocasa --reinstall-package robosuite
            fi
            if [ "$group" = "onnx-export" ]; then
              uv run --all-packages --group onnx-export python tools/export_rtdetr_onnx.py \
                --out rskills/rtdetr-coco-r18/model.onnx || rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              if [ "$group" = "simpler-env" ] || [ "$group" = "robocasa-gr1" ]; then
                # verify_test_envs.py drives its own pytest, so there is no
                # junit report to account from — judge it by exit code alone.
                OPENRAL_ALLOW_ROBOCASA_ASSETS=1 uv run python tools/verify_test_envs.py \
                  --include-provisioned --groups "$group" 2>&1 | tee "$log" || rc=$?
                python3 scripts/repair_hf_libero_install.py || true
                report_lane "$group" "$rc" --from-exit-code || rc=1
              else
                # Partition selected targets: files flagged for per-process
                # isolation (ISOLATED_TARGETS, from tools/test_selection.toml
                # `isolate_globs`) run one-at-a-time in their own
                # interpreter. Real robosuite/MuJoCo EGL contexts do not
                # survive a sibling env's teardown in the same process — a
                # second LIBERO env then dies with "RethinkMount is not a
                # MujocoXML instance" even on the correct robosuite 1.4
                # (issue #24 class). The rest run together.
                batched=""
                isolated_here=""
                for t in $targets; do
                  case " $ISOLATED_TARGETS " in
                    *" $t "*) isolated_here="$isolated_here $t" ;;
                    *) batched="$batched $t" ;;
                  esac
                done
                if [ -n "$batched" ]; then
                  # selector-emitted space-separated list
                  # shellcheck disable=SC2086
                  env "${env_args[@]}" uv run --all-packages --group "$dependency_group" "${extra_groups[@]}" pytest $batched \
                    -q -rs -p no:launch_testing -p no:launch_ros \
                    --junit-xml="$batched_xml" 2>&1 | tee "$log" || rc=$?
                  python3 scripts/repair_hf_libero_install.py || true
                  xml_args+=(--junit-xml "$batched_xml")
                fi
                iso_n=0
                for t in $isolated_here; do
                  echo "::group::pytest (isolated) ${t}"
                  iso_n=$((iso_n + 1))
                  iso_xml="$RUNNER_TEMP/lane-${group}-iso-${iso_n}.xml"
                  iso_rc=0
                  env "${env_args[@]}" uv run --all-packages --group "$dependency_group" "${extra_groups[@]}" pytest "$t" \
                    -q -rs -p no:launch_testing -p no:launch_ros \
                    --junit-xml="$iso_xml" || iso_rc=$?
                  python3 scripts/repair_hf_libero_install.py || true
                  echo "::endgroup::"
                  # exit 5 == nothing collected (whole module
                  # importorskip'd): a legitimate all-skipped outcome,
                  # judged from the report.
                  if [ "$iso_rc" -ne 0 ] && [ "$iso_rc" -ne 5 ]; then rc=1; fi
                  xml_args+=(--junit-xml "$iso_xml")
                done
                report_lane "$group" "$rc" "${xml_args[@]}" || rc=1
              fi
            fi
            echo "::endgroup::"
            return "$rc"
          }

          run_lane "$LANE" "$TARGETS"

      - name: Upload lane ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lane-ledger-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-ledger.jsonl
          if-no-files-found: warn

  # Required status check #1 — the fast one. Reports as soon as `core_full`
  # / `core_selected` finish; does NOT wait on `lane` (that is `heavy-lanes`,
  # below). Name must stay exactly `select-and-test` — it is a required
  # check in the master ruleset (docs/contributing/selective-testing.md).
  select-and-test:
    needs: [select, core_full, core_selected]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require select, core_full and core_selected to have succeeded or been skipped
        if: >-
          needs.select.result == 'failure' || needs.select.result == 'cancelled' ||
          needs.core_full.result == 'failure' || needs.core_full.result == 'cancelled' ||
          needs.core_selected.result == 'failure' || needs.core_selected.result == 'cancelled'
        run: |
          echo "::error::a required job failed or was cancelled — see select / core_full / core_selected above."
          exit 1

  # Required status check #2 — waits on `lane`, which itself waits behind the
  # `heavy-lanes` environment's required reviewer. Stays pending until a
  # maintainer approves the deployment, which is what actually blocks the
  # merge until the opt-in dependency lanes have run. Also the anti-vacuity
  # gate (issue #163): merges every lane's uploaded ledger and cross-checks
  # it against the selector's own output, so "tested nothing" and "tested
  # everything and passed" can no longer report the same result.
  heavy-lanes:
    needs: [select, lane]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: false

      - name: Download lane ledgers
        if: needs.select.outputs.lanes != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: lane-ledger-*
          path: ledgers
          if-no-artifact-found: ignore

      - name: Merge ledgers and attest lane coverage
        if: needs.select.outputs.any == 'true'
        env:
          FULL_RUN: ${{ needs.select.outputs.full_run }}
          REQUIREMENT_TARGETS_JSON: ${{ needs.select.outputs.requirement_targets_json }}
          LEDGER: ${{ runner.temp }}/lane-ledger.jsonl
        run: |
          # Each lane job uploaded its own ledger artifact (one JSONL line,
          # name lane-ledger-<lane>); merge them back into the single file
          # tools/lane_report.py expects. Every lane's file lands in its own
          # `ledgers/lane-ledger-<lane>/` subdirectory (no merge-multiple),
          # so a download hiccup on one lane can't silently overwrite
          # another's line. `find` over an absent `ledgers/` (no lanes
          # selected) legitimately finds nothing — that is not an error.
          find ledgers -name '*.jsonl' -exec cat {} + > "$LEDGER" 2>/dev/null || true
          touch "$LEDGER"
          python3 - > "$RUNNER_TEMP/selection.json" <<'PY'
          import json, os, sys
          json.dump(
              {
                  "full_run": os.environ.get("FULL_RUN", "false"),
                  "requirement_targets_json": os.environ.get("REQUIREMENT_TARGETS_JSON") or "{}",
              },
              sys.stdout,
          )
          PY
          uv run --isolated --with pydantic --python 3.12 \
            python tools/lane_report.py --ledger "$LEDGER" attest \
            --selection-json "$RUNNER_TEMP/selection.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Require select and every lane to have succeeded or been skipped
        if: >-
          needs.select.result == 'failure' || needs.select.result == 'cancelled' ||
          needs.lane.result == 'failure' || needs.lane.result == 'cancelled'
        run: |
          echo "::error::select or a lane failed or was cancelled — see above."
          exit 1

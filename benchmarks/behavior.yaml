# BEHAVIOR-1K 2026 challenge suite — all 100 public challenge tasks.
#
# BEHAVIOR-1K (Li et al., 2403.09227) defines 1,000 household activities; the
# 2026 challenge (and its OmniGibson evaluator) exposes this 100-task subset
# on the Galaxea R1 Pro. Per-task max_steps is the official cap the evaluator
# computes itself: int(1.5 x mean human-demo length), read from the installed
# challenge human-demo stats. Instance 0 of the public_test split per task.
#
# Run (auto-filters to the rSkill's evaluated_tasks, like maniskill3_panda):
#   openral benchmark run --suite behavior --rskill rskills/gr00t-n17-b1k-turning-on-radio
#
# Setup: OmniGibson owns the scene physics in its official Python 3.10
# environment (never vendored); the scene runs out-of-process through
# tools/behavior_scene_sidecar.py (OPENRAL_BEHAVIOR_SIDECAR_PYTHON). Policy
# checkpoints from the pinned wensi-ai/Isaac-GR00T runtime run in their own
# sidecar (tools/behavior_groot_sidecar.py, whole-model NF4 on 8 GB).
#
# env_wrapper: the official DefaultWrapper (rgb-only, 224x224) — the wrapper
# every verified rollout used. RGBDFullResWrapper crashes at boot on the
# pinned OmniGibson build (reads joint state before og.sim.update_handles()).
#
# Protocol: the official evaluator scores partial credit (q_score) over final
# goal predicates averaged across public instances; OpenRAL's runner records
# the binary `is_success` from the same evaluator wrapper.
#
# GENERATED from the evaluator's own load_available_tasks() +
# load_human_stats() (cap = int(1.5 x mean human-demo length)); regenerate
# from those helpers rather than hand-editing task rows.

- scene: &scene
    id: behavior
    backend: isaacsim
    observation_height: 224
    observation_width: 224
    cameras: ["head", "left_wrist", "right_wrist"]
    backend_options: &opts
      task: turning_on_radio
      instance_index: 0
      mode: public_test
      env_wrapper: "omnigibson.eval.wrappers.DefaultWrapper"
      boot_timeout_s: 1200
      timeout_ms: 120000
  task:
    id: behavior/turning_on_radio
    scene_id: behavior
    # Matches every other in-tree entry point for this task (the rSkill
    # manifest, scenes/sim + scenes/benchmark YAMLs) so `benchmark run`,
    # `benchmark scene`, and `sim run` condition the checkpoint identically.
    instruction: "turn on the radio"
    max_steps: 3224
    success_key: is_success
  robot_id: r1pro
  n_episodes: 1
  seed: 0
  metadata: &meta
    paper: "https://arxiv.org/abs/2403.09227"
    display_name: "BEHAVIOR-1K 2026 challenge (100 tasks)"
    simulator: "OmniGibson / Isaac Sim (sidecar)"
    honest_scope: >
      All 100 public tasks of the BEHAVIOR-1K 2026 challenge, one episode on
      public_test instance 0 each, with the official per-task step cap
      (1.5x mean human-demo length). The official leaderboard metric is
      q_score partial credit averaged over all public instances; this suite
      records the evaluator's binary is_success on one instance per task
      because a single episode takes ~1-2 h wall-clock on the 8 GB reference
      host (closed-loop protocol). The runner auto-filters to the rSkill's
      evaluated_tasks; the only released organizer baseline checkpoint
      covers turning_on_radio, and that checkpoint is itself flaky
      (Isaac-GR00T issue #515: q_score 0.0 in 9/10 episodes vs the claimed
      0.70) — numbers reflect the checkpoint, not an OpenRAL integration
      ceiling (NF4-vs-bf16 action MAE 0.003).

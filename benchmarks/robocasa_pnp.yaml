# RoboCasa atomic pick-and-place benchmark suite.
#
# Mirrors the pick-and-place axis of the RoboCasa kitchen suite (Nasiriany et
# al., 2024, arXiv:2406.02523): the canonical counter->cabinet task
# (`PickPlaceCounterToCabinet`, scene id `robocasa/PickPlaceCounterToCabinet`
# in python/sim/src/openral_sim/backends/robocasa.py), swept across seeds.
#
# Shape: bare list of BenchmarkScenes; suite id = filename stem
# ("robocasa_pnp"). Consumed by `openral benchmark run`; writes
# RSkillEvalResult to rskills/<vla>/eval/robocasa_pnp.json
# (reproduced_locally=true) and updates `benchmarks.robocasa_pnp` in the
# rskill.yaml with avg_success_rate. Invariants enforced by
# `openral_core.raise_on_invalid_suite`.
#
# Protocol: 1 task x 10 episodes (lighter than the 50-ep paper protocol,
# ~30 min on one GPU; raise n_episodes for paper-equivalent reproduction).
# Robot: panda_mobile (canonical RoboCasa embodiment; scene factory pins
# `fixed_robot="panda_mobile"`). Success key: `is_success`, written by the
# RoboCasa adapter as `info["is_success"] = env._check_success()`
# (backends/robocasa.py L201).
#
# Run: openral benchmark run --suite robocasa_pnp --rskill rldx1-ft-rc365-nf4

- scene:
    id: robocasa/PickPlaceCounterToCabinet
    backend: mujoco
    observation_height: 128
    observation_width: 128
    cameras: ["shoulder_left", "shoulder_right", "wrist"]
    backend_options:
      mode: prebuilt
      prebuilt_task: PickPlaceCounterToCabinet
      robots: ["PandaMobile"]
      controller: OSC_POSE
      horizon: 500
  task:
    id: robocasa_pnp/counter_to_cabinet
    scene_id: robocasa/PickPlaceCounterToCabinet
    instruction: "pick the object from the counter and place it into the cabinet"
    max_steps: 500
    success_key: is_success
  robot_id: panda_mobile
  n_episodes: 10
  seed: 0
  metadata:
    paper: "https://arxiv.org/abs/2406.02523"
    display_name: "RoboCasa Atomic PickPlace (counter→cabinet)"
    simulator: "RoboCasa 1.0.1 (robosuite + MuJoCo)"
    honest_scope: >
      10 seeds on PickPlaceCounterToCabinet. Lighter than the RoboCasa
      paper protocol (10 seeds vs 50) so the suite completes in
      ~30 min on a single GPU; bump n_episodes for a paper-equivalent
      reproduction. Counter→cabinet pick-and-place on the panda_mobile
      (Franka on a wheeled base) embodiment. Success comes from
      env._check_success() surfaced as info["is_success"].

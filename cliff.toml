# git-cliff configuration — drives .github/workflows/changelog.yml.
# Groups Conventional Commits by importance: breaking first, then features,
# fixes, performance, and the housekeeping tail. Regenerate locally with:
#   uvx git-cliff==2.13.1 -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable changes to OpenRAL, grouped by importance per release.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
# Non-conventional commits (plain merge commits, etc.) still land in the
# catch-all group rather than silently vanishing.
filter_unconventional = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  # Dependency-bot churn stays out of the changelog entirely.
  { message = "^chore\\(deps", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|style|build)", group = "<!-- 6 -->Miscellaneous" },
  # Catch-all for non-conventional commits (merges, etc.).
  { message = ".*", group = "<!-- 7 -->Other" },
]

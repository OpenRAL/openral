# git-cliff configuration — drives .github/workflows/changelog.yml.
# Keep-a-Changelog groups ordered by importance: Added, Changed, Fixed.
# Breaking commits are flagged inline. Docs/test/CI/chore/dep churn is
# omitted — the changelog is for users, not for internal housekeeping.
# Regenerate locally with:
#   uvx git-cliff==2.13.1 -o CHANGELOG.md

[changelog]
header = """
# Changelog

All notable user-facing changes to OpenRAL. Newest release first; entries
grouped as [Keep a Changelog](https://keepachangelog.com) categories.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**[breaking]** {% endif %}\
{% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
# A breaking commit is never dropped by a skip rule below.
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
commit_preprocessors = [
  # "(#123)" → markdown link, so PR references work outside github.com too.
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/OpenRAL/openral/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(refactor|perf)", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  # Internal housekeeping never reaches the changelog.
  { message = "^(docs|test|style|ci|build|chore)", skip = true },
  # Non-conventional commits (merge commits, bot bumps) are noise too.
  { message = ".*", skip = true },
]

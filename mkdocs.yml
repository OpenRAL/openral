site_name: OpenRAL
site_url: https://docs.openral.com
repo_url: https://github.com/OpenRAL/openral
edit_uri: edit/master/docs/

# Files reachable by link rather than the nav tree. `docs/methods/*` is the
# per-layer public-symbol inventory browsed via `METHODS.md`. Listing it here
# keeps `mkdocs build --strict` green without cluttering the top-level nav.
not_in_nav: |
  /methods/

theme:
  name: material
  # Self-hosted fonts only (no Google Fonts request) — families are declared in
  # docs/stylesheets/openral.css via @font-face, matching the marketing site.
  font: false
  logo: assets/openral-logo-white.svg
  favicon: assets/openral-logo-white.svg
  # Refined-dark, monochrome — locked to the slate scheme the override styles.
  palette:
    scheme: slate
    primary: black
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest

extra_css:
  - stylesheets/openral.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - python/core/src
            - python/cli/src
            - python/hal/src
            - python/sensors/src
            - python/world_state/src
            - python/rskill/src
            - python/runner/src
            - python/observability/src
            - python/sim/src
            - python/reasoner/src
            - python/dataset/src
            - python/detect/src
          options:
            merge_init_into_class: true
            show_docstring_attributes: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Quickstart:
    - quickstart/index.md
    - Dashboard: quickstart/dashboard.md
  - Tutorials:
    - Your first sim rollout: tutorials/sim/first-rollout.md
    - Create a sim environment: tutorials/sim/create-a-sim-environment.md
    - Run a benchmark: tutorials/benchmark/run-a-benchmark.md
    - Write & publish an rSkill: tutorials/rskill/write-and-publish-an-rskill.md
    - Quantize an rSkill: tutorials/rskill/quantize-an-rskill.md
    - Deploy on a robot & open the dashboard: tutorials/deploy/deploy-run-and-dashboard.md
    - Deploy perception & the world map: tutorials/deploy/deploy-perception-and-world-map.md
    - OpenArm real-cell world-voxel check: tutorials/deploy/openarm-real-world-voxel-check.md
  - Architecture:
    - Overview: architecture/overview.md
    - Repo map: architecture/repo-map.md
    - Methods inventory: METHODS.md
    - ROS 2 topic graph: topics/README.md
    # The repo state map ships as a static .html under docs/architecture/ —
    # mkdocs nav only renders Markdown, so it is linked from
    # architecture/overview.md instead of listed here. mkdocs copies it to
    # the output verbatim.
  - Roadmap:
    - roadmap/index.md
  - Reference:
    - Glossary: reference/glossary.md
    - API: reference/api.md
    - Robots and HALs:
      - Robot descriptions: reference/robots.md
      - VLA × Robot × Sim compatibility: reference/vla_compatibility.md
      - Sensor catalog: reference/sensors_landscape.md
    - rSkills and reasoning:
      - rSkills: reference/rskills.md
      - Reasoner (S2): reference/reasoner.md
      - Reasoner design: reference/reasoner-design.md
      - Cosmos 3 Edge reasoner: reference/cosmos3-edge-reasoner.md
    - Simulation:
      - Sim environments: reference/sim-environments.md
      - USD object catalog: reference/usd-object-catalog.md
      - Sim backend installs: reference/sim-backend-installs.md
    - Deployment and operations:
      - aarch64 CUDA hosts (DGX Spark / Jetson): reference/aarch64-support.md
      - Telemetry (spans, metrics, logs): reference/telemetry.md
      - On-robot compliance log: reference/compliance-log.md
      - DDS transport for large messages: reference/dds-large-messages.md
      - ROS graph security on a real robot: reference/ros-graph-security.md
    - Design decisions: decisions.md
  - Investigations:
    - reference/investigations.md
    - Safety kernel:
      - Staged hull narrow phase: reference/collision-hull-narrow-phase.md
      - Collision geometry review: reference/collision-geometry-review.md
      - External torque observer: reference/external-torque-observer.md
      - Finger mimic geometry: reference/finger-mimic-geometry.md
    - Collision studies:
      - Validation evidence ledger: reference/collision-validation-evidence.md
      - Collision-primitive study: reference/collision-primitive-study.md
      - Collision primitives, in pictures: reference/collision-primitive-images.md
      - Tight link geometry: reference/collision-tight-geometry.md
      - Alternatives survey: reference/collision-safety-alternatives-survey.md
      - RoboCasa start-state census: reference/robocasa-start-state-census.md
      - RoboCasa carry survey: reference/robocasa-carry-survey.md
      - The live world map, measured: reference/world-map-fidelity.md
      - G1 and R1 Pro base footprints: reference/g1-r1pro-base-footprints.md
    - Manipulation and tracking:
      - Real pick and place, design: reference/real-pick-place-design.md
      - Real pick and place, ADR drafts: reference/real-pick-place-adr-drafts.md
      - Manipulation-workspace contact: reference/manipulation-workspace-contact.md
      - Object primitives design: reference/object-primitives-design.md
      - Object tracking plan: reference/object-tracking-implementation-plan.md
      - Object tracking evaluation, 2026-10-19: reference/object-tracking-spark-evaluation-2026-10-19.md
      - Object-centric mapping survey: reference/object-centric-mapping-survey.md
      - Isaac-reproducible datasets survey: reference/isaac-reproducible-datasets-survey.md
  - Contributing:
    - Development: contributing/development.md
    - Toolchain cheatsheet: contributing/toolchain.md
    - CI: contributing/ci.md
    - Releasing: contributing/releasing.md
    - Selective testing: contributing/selective-testing.md
    - Test-suite audit: contributing/test-audit.md
    - Validation matrix: contributing/validation-matrix.md

[project]
name = "openral-cli"
version = "0.3.0"  # x-release-please-version
description = "OpenRAL command-line tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # x-release-please-start-version
    "openral-core==0.3.0",   # reason: robot schemas for doctor / detect output
    "openral-detect==0.3.0", # reason: detect_hardware + assemble_robot_description for `openral detect`
    "openral-sim==0.3.0",   # reason: `openral sim run` mounts openral_sim.cli.sim_app onto the openral tree
    "openral-observability[dashboard]==0.3.0", # reason: configure OTel tracing + log bridge at CLI entry; [dashboard] adds FastAPI+uvicorn for `openral dashboard`
    "openral-sensors==0.3.0", # reason: RealSense launch generator + calibrate_camera_cmd
    "openral-rskill==0.3.0",  # reason: rSkill loader for 'openral rskill install' / 'openral rskill list'
    # x-release-please-end
    "typer>=0.12",        # reason: CLI framework
    "rich>=13.7",         # reason: terminal formatting
    "pyudev>=0.24.4",
    "opencv-python-headless>=4.9,<5",  # reason: camera thumbnails in `openral detect` sensor wizard; <5 keeps numpy<2.5 (opencv 5 pulls numpy 2.5, breaking the workspace pin)
    "fastapi>=0.110",      # reason: BEHAVIOR evaluator WebSocket + /healthz policy endpoint
    "uvicorn[standard]>=0.27", # reason: serve the BEHAVIOR policy ASGI app
    "msgpack>=1",          # reason: official BEHAVIOR ndarray wire format
]

[project.scripts]
# Canonical (and only) entry point — `openral`. With no arguments it drops
# into an interactive REPL (`openral>` prompt) where subcommands run bare
# (`sim run --config …`). With arguments it behaves as a one-shot CLI for
# scripts and CI.
openral = "openral_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_cli"]

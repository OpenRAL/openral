[project]
name = "openral-detect"
version = "0.2.0"  # x-release-please-version
description = "Hardware probing + RobotDescription assembly + skill compatibility report"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # x-release-please-start-version
    "openral-core==0.2.0",          # reason: RobotDescription / RobotCapabilities / RSkillManifest
    "openral-sensors==0.2.0",       # reason: CATALOG.build for materializing detected sensors
    "openral-rskill==0.2.0",         # reason: rSkill.check_compatibility + list_installed
    "openral-cli==0.2.0",           # reason: reuse autodetect.enumerate_usb_devices + scan_dds_topics
    "openral-observability==0.2.0", # reason: tracing spans around each probe
    # x-release-please-end
    "pydantic>=2.7",             # reason: DetectionReport / CompatibilityReport models
    "psutil>=5.9",               # reason: network interface enumeration in probe_network
]

[project.optional-dependencies]
nvidia = [
    "nvidia-ml-py>=12.560",      # reason: pynvml backend for probe_gpus (no subprocess)
]
jetson = [
    "jetson-stats>=4.2",         # reason: jtop backend for Jetson Orin TOPS + power mode
]
realsense = [
    "pyrealsense2>=2.55",        # reason: live RealSense device enumeration (Linux x86 only)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_detect"]

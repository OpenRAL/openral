[project]
name = "openral-hal"
version = "0.2.0"
description = "OpenRAL Hardware Abstraction Layer — HAL Protocol and ros2_control adapter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "openral-core==0.2.0", # reason: HAL Protocol uses RobotDescription, Action, JointState
    "openral-sensors==0.2.0", # reason: catalog-backed *_with_sensors() factories materialise SensorSpec/Bundle on canonical RobotDescriptions
    # reason: lerobot types.py module + the SO-100/SO-101 real servo bus. The
    # `feetech` extra pulls feetech-servo-sdk (scservo_sdk) + deepdiff, which
    # lerobot's FeetechMotorsBus lazy-requires at connect(); without it,
    # `openral deploy run` on real SO-100/101 hardware raises ImportError inside
    # the HAL's on_configure. The extra is small pure-Python, and the `so100`
    # optional-extra is never activated by `just sync` (nothing pulls
    # openral-hal[so100]), so the feetech deps belong in the base. Min 3.12+.
    "lerobot[feetech]>=0.6.0",
    "structlog>=24.0", # reason: structured logging per CLAUDE.md §5.1
    # torchcodec (pulled transitively via lerobot) ships per-torch-minor ABI
    # builds: 0.9.x↔torch2.9, 0.10.x↔torch2.10. The dev workspace locks torch
    # 2.9.1 on linux and caps torchcodec<0.10 in [tool.uv]; a *clean* install
    # has no lock, so torch floats to 2.10 while lerobot still caps torchcodec
    # at 0.9.x — the 0.9.x .so then links against torch 2.9's c10 ABI and every
    # lerobot dataset-codec call dies with `undefined symbol`. Pin both to the
    # validated linux pair so published-metadata installs stay ABI-consistent.
    # Linux-scoped only: other platforms validly resolve the torch2.10/0.10
    # pair (mirrors the root [tool.uv] constraint marker).
    "torch<2.10; sys_platform == 'linux'",
    "torchcodec<0.10; (platform_machine == 'x86_64' or platform_machine == 'AMD64') and sys_platform == 'linux'",
]

[project.optional-dependencies]
so100 = [
    # SO-100/SO-101 servo bus. feetech-servo-sdk + deepdiff are already in the
    # base deps above (real hardware needs them at connect()); kept here so the
    # extra stays a self-documenting opt-in surface.
    "lerobot[feetech]>=0.6.0",
]
arm-sim = [
    "mujoco>=3.0",  # reason: MuJoCo physics engine for UR5e / UR10e / Franka Panda HAL sim adapters
    "onnxruntime>=1.17",  # reason: pinned G1 walking controller inference
    "robot-descriptions>=1.12.0",  # reason: source of mujoco_menagerie MJCFs (UR5e, UR10e, Panda)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_hal"]

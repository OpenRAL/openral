[project]
name = "openral-runner"
version = "0.2.0"
description = "OpenRAL inference runner — closes WorldState → Skill → HAL at a cadence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "openral-core==0.2.0",            # reason: TickResult / RunResult / SensorFrame schemas
    "openral-hal==0.2.0",             # reason: HardwareRunner depends on the HAL Protocol
    "openral-observability==0.2.0",   # reason: rskill_span / safety_span wired into HardwareRunner ticks
    "openral-rskill==0.2.0",           # reason: HardwareRunner accepts a Skill and calls Skill.step
    "openral-world-state==0.2.0",     # reason: WorldStateAggregator is the runner's WorldState producer
    "msgpack>=1.1",            # reason: native A1 Runtime local service framing
    "structlog>=24.1",             # reason: structured logging per CLAUDE.md §5.1
]

[project.optional-dependencies]
# Default SensorReader backend uses OpenCV's VideoCapture in a per-camera
# background thread (mirrors lerobot's pattern). Optional so headless
# deployments without a camera can install openral_runner without pulling
# the ~70 MB opencv-python wheel.
opencv = [
    "opencv-python>=4.8",
]
# GStreamer backend for SensorReader (Jetson NVDEC, RTSP, multi-cam sync).
# System deps: gstreamer1.0-plugins-{base,bad,good,ugly}; on Jetson also
# nvidia-l4t-gstreamer. Installed via `just bootstrap-jetson`.
gstreamer = [
    "PyGObject>=3.42",
]
# The NVMM zero-copy path (PyCUDA-backed shared CUDA context, the
# NvBufSurface ctypes wrapper, the TensorRT NVMM executors) is an
# OpenRAL Pro plugin — it is no longer declared here. The
# open-core ``reader.py`` NVMM buffer latch degrades to a logged bus
# error when that plugin is absent.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_runner"]

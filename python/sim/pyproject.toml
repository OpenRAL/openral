[project]
name = "openral-sim"
version = "0.2.0"
description = "OpenRAL sim eval — robot × scene × task × VLA factory and runner for rSkill validation before hardware deployment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "openral-core==0.2.0",   # reason: SimEnvironment / SceneSpec / TaskSpec / VLASpec schemas
    "openral-runner==0.2.0", # reason: InferenceRunnerBase for SimRunner
    "openral-rskill==0.2.0",  # reason: rSkill loader
    "openral-observability==0.2.0",  # reason: configure_observability / shutdown_observability bracketing
    "openral-dataset==0.2.0",        # reason: RolloutRecorder + LeRobotDatasetSink for --dataset-out
    "openral-world-state==0.2.0",    # reason: shared look-at gaze geometry for scene-camera placement
    "structlog>=24.1",    # reason: structured logging per CLAUDE.md §5.1
    "PyYAML>=6.0",        # reason: SimEnvironment YAML config loader
    "typer>=0.12",        # reason: CLI framework — exposes eval_app for mounting into ral
    "imageio[ffmpeg]>=2.34",  # reason: --save-video and website MP4 writers use imageio's ffmpeg plugin.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openral_sim"]

    role: "gripper"
    # The channel is the normalised opening (sim.grippers qpos_scale 0.04765 m);
    # the kernel, self-filter and /tf pose the URDF finger in metres through this.
    urdf_curve: [[0.0, 0.0], [1.0, 0.04765]]

end_effectors:
  - name: "left_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 30.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6
  - name: "right_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 30.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6

# Three RGB cameras: a head (overhead) view + per-wrist views. RoboTwin's
# native keys are cam_high / cam_left_wrist / cam_right_wrist (480×640 in the
# `lerobot/robotwin_unified` dataset). The public `lerobot/smolvla_robotwin`
# checkpoint's `config.json` consumes them at 256×256 under the generic feature
# keys observation.images.camera1/2/3 (the same naming the franka_panda /
# ManiSkill rSkills use). The HAL-facing sensor names are
# canonical (top / wrist_left / wrist_right); the checkpoint-facing
# `vla_feature_key` stays camera1/2/3 since it is frozen per checkpoint. The
# RoboTwin sidecar re-keys the env's three cameras to scene cameras in
# head→left→right order.
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "sim"
    model: "robotwin_cam_high"
    # MuJoCo twin only (RoboTwin renders its own): RoboTwin's `head_camera`
    # (config.yml static_camera_list) moved from its world into the robot
    # frame (robot_pose: y -0.65, yaw +90 deg).
    sim_placement:
      pos: [0.2, 0.032, 1.35]
      target: [0.8, 0.032, 0.55]
  - name: "wrist_left"
    modality: "rgb"
    frame_id: "fl_link6"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    vendor: "sim"
    model: "robotwin_cam_left_wrist"
    # MuJoCo twin only: on the URDF's `left_camera` link (x forward, z up).
    sim_placement:
      parent_body: "left_camera"
      pos: [0.0, 0.0, 0.0]
      target: [1.0, 0.0, 0.0]
  - name: "wrist_right"
    modality: "rgb"
    frame_id: "fr_link6"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera3"
    vendor: "sim"
    model: "robotwin_cam_right_wrist"
    # MuJoCo twin only: on the URDF's `right_camera` link (x forward, z up).
    sim_placement:
      parent_body: "right_camera"
      pos: [0.0, 0.0, 0.0]
      target: [1.0, 0.0, 0.0]

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  supported_control_modes:
    - "joint_position"
    # The two parallel grippers (see end_effectors) accept position
    # commands; advertise the mode so a gripper-driving skill matches the gate.
    - "gripper_position"
  supported_vla_embodiments: ["aloha_agilex", "aloha", "lerobot"]
  embodiment_tags:
    - "aloha_agilex"
    - "aloha"
    - "lerobot"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  deadman_required: false

# AgileX PiPER ROS 2 driver is Apache-2.0 / MIT (vendor-distributed); no real
# HAL is wired here (sim-only embodiment: the SAPIEN env or the MuJoCo twin).
sdk_kind: "open"

hal:
  # null -> build_hal derives MujocoArmHAL.from_description from `sim:` below.
  sim: null
  real: null

# MuJoCo wiring for the twin (robotwin:aloha_agilex MJCF): actuators 0-13 are
# the joints above in order. qpos 0-7 are fl_joint1..8 and 8-15 fr_joint1..8;
# each gripper actuator drives joint7 (0 closed .. 0.04765 m open) and an MJCF
# equality mirrors it onto joint8 (qpos 7 / 15), as RoboTwin's config.yml
# couples them. qpos 0 is RoboTwin's config.yml home pose and inside every range.
sim:
  joint_qpos_addr:
    left_joint1: 0
    left_joint2: 1
    left_joint3: 2
    left_joint4: 3
    left_joint5: 4
    left_joint6: 5
    left_gripper: 6
    right_joint1: 8
    right_joint2: 9
    right_joint3: 10
    right_joint4: 11
    right_joint5: 12
    right_joint6: 13
    right_gripper: 14
  grippers:
    - joint: "left_gripper"
      ctrl_range: [0.0, 0.04765]
      qpos_addrs: [6]
      qpos_scale: 0.04765
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 6
    - joint: "right_gripper"
      ctrl_range: [0.0, 0.04765]
      qpos_addrs: [14]
      qpos_scale: 0.04765
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 13

observation_spec:
  state_key: "observation.state"
  state_shape: [14]
  state_representation: "joint_positions"

action_spec:
  dim: 14
  representation: "joint_positions"
  control_freq_hz: 25.0
schema_version: "0.2"

# The URDF's fixed joints between the root / manifest links and the links the
# arm joints hang from (generated from the URDF; the twin MJCF has the same frames).
fixed_attachments:
  - name: "fl_base_link_mount"
    parent_link: "world"
    child_link: "fl_base_link"
    origin_xyz: [0.2305, 0.297, 0.782]
    origin_rpy: [0, 0, 0.02]
  - name: "fr_base_link_mount"
    parent_link: "world"
    child_link: "fr_base_link"
    origin_xyz: [0.2315, -0.3063, 0.781]
    origin_rpy: [0, 0, 0.01]

# The second finger of each gripper: an MJCF equality (polycoef 0 1) and the URDF's
# mirrored slide drive it with the leader's URDF value, so the kernel poses it too.
mimic_joints:
  - name: "left_finger_mirror"
    sim_joint_name: "fl_joint8"
    joint_type: "prismatic"
    parent_link: "fl_link6"
    child_link: "fl_link8"
    origin_xyz: [0.08457, -0.024496, -0.00010354]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    mimics: "left_gripper"
    multiplier: 1.0
    offset: 0.0
  - name: "right_finger_mirror"
    sim_joint_name: "fr_joint8"
    joint_type: "prismatic"
    parent_link: "fr_link6"
    child_link: "fr_link8"
    origin_xyz: [0.08457, -0.024496, -0.00010354]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    mimics: "right_gripper"
    multiplier: 1.0
    offset: 0.0


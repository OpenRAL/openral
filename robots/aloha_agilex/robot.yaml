    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    sim_joint_name: "fl_joint5"
    parent_link: "fl_link4"
    child_link: "fl_link5"
    position_limits: [-1.22, 1.22]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint6"
    origin_xyz: [0.03095, 0, 0.0855]
    origin_rpy: [3.1415853, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    sim_joint_name: "fl_joint6"
    parent_link: "fl_link5"
    child_link: "fl_link6"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_gripper"
    origin_xyz: [0.08457, 0.024493, -0.00010349]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "prismatic"
    sim_joint_name: "fl_joint7"
    parent_link: "fl_link6"
    child_link: "fl_link7"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.5
    effort_limit: 30.0
    actuator_kind: "servo"
    role: "gripper"
    # The channel is the normalised opening (sim.grippers qpos_scale 0.04765 m);
    # the kernel, self-filter and /tf pose the URDF finger in metres through this.
    urdf_curve: [[0.0, 0.0], [1.0, 0.04765]]
  - name: "right_joint1"
    origin_xyz: [0, 0, 0.058]
    origin_rpy: [0, 0, 0]

  - name: "right_joint3"
    origin_xyz: [-0.26396, 0.0044548, 0]
    origin_rpy: [3.1415853, 0, -0.015928]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    sim_joint_name: "fr_joint3"
    parent_link: "fr_link2"
    child_link: "fr_link3"
    # Elbow unfolds toward +q on RoboTwin's ARX5 URDF (`lerobot/robotwin_unified`
    # state mean +0.81 rad); PiPER's [-2.967, 0] magnitude with that sign.
    position_limits: [0.0, 2.967]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint4"
    origin_xyz: [0.246, -0.00025, -0.06]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    sim_joint_name: "fr_joint4"
    parent_link: "fr_link3"
    child_link: "fr_link4"
    position_limits: [-1.745, 1.745]
    velocity_limit: 3.0

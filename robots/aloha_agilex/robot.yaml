# RobotDescription — AgileX "aloha-agilex" dual-arm (RoboTwin 2.0 embodiment).
#
# This describes the bimanual AgileX platform RoboTwin 2.0 evaluates by
# default: two 6-DoF PiPER arms with parallel grippers (14-DoF action
# space, 7 per arm) and three RGB cameras (head + per-wrist). It is the
# embodiment behind `lerobot/robotwin_unified` and the public RoboTwin
# checkpoints (e.g. `lerobot/smolvla_robotwin`).
#
# Two sims run it:
# * the SAPIEN env owned by the RoboTwin sidecar (scenes/sim/robotwin_*), where
#   the SAPIEN model is authoritative and the openral side never instantiates
#   the robot;
# * a bare MuJoCo twin (`MujocoArmHAL.from_description`, the `sim:` block
#   below) on an MJCF derived from the same URDF, for `openral deploy sim` and
#   the dashboard (scenes/deploy/aloha_agilex_twin.yaml).
# Joint kinematics below are approximate (sufficient for capability matching +
# SafetyEnvelope authoring).

name: "aloha_agilex"
embodiment_kind: "bimanual"

base_frame: "world"

# The URDF RoboTwin's SAPIEN scene loads (`embodiments.zip`, MIT, pinned
# Hugging Face revision; openral_hal._robotwin_aloha_agilex_assets) for geometry
# outside the sim: renders, viewers, collision lowering. Its arms are `fl_*`
# (left) / `fr_*` (right), bridged by `sim_joint_name`; its joint limits are
# ±10 rad placeholders, so the limits below stay the authority. The MJCF is the
# MuJoCo twin derived from it: the front arms actuated at these limits, the
# base, wheels and rear arms welded.
assets:
  urdf:
    ref: "robotwin:aloha_agilex"
  mjcf: "robotwin:aloha_agilex"

joints:
  # 14-DoF: 2 arms × (6 revolute joints + 1 gripper). AgileX PiPER limits
  # are approximate; the SAPIEN model is authoritative (see header note).
  - name: "left_joint1"
    joint_type: "revolute"
    sim_joint_name: "fl_joint1"
    parent_link: "world"
    child_link: "left_link1"
    axis_xyz: [0.0, 0.0, 1.0]
    position_limits: [-2.618, 2.618]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint2"
    joint_type: "revolute"
    sim_joint_name: "fl_joint2"
    parent_link: "left_link1"
    child_link: "left_link2"
    axis_xyz: [0.0, 1.0, 0.0]
    position_limits: [0.0, 3.14]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint3"
    joint_type: "revolute"
    sim_joint_name: "fl_joint3"
    parent_link: "left_link2"
    child_link: "left_link3"
    axis_xyz: [0.0, 1.0, 0.0]
    # Elbow unfolds toward +q on RoboTwin's ARX5 URDF (`lerobot/robotwin_unified`
    # state mean +0.81 rad); PiPER's [-2.967, 0] magnitude with that sign.
    position_limits: [0.0, 2.967]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint4"
    joint_type: "revolute"
    sim_joint_name: "fl_joint4"
    parent_link: "left_link3"
    child_link: "left_link4"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [-1.745, 1.745]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint5"
    joint_type: "revolute"
    sim_joint_name: "fl_joint5"
    parent_link: "left_link4"
    child_link: "left_link5"
    axis_xyz: [0.0, 1.0, 0.0]
    position_limits: [-1.22, 1.22]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint6"
    joint_type: "revolute"
    sim_joint_name: "fl_joint6"
    parent_link: "left_link5"
    child_link: "left_link6"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_gripper"
    joint_type: "prismatic"
    sim_joint_name: "fl_joint7"
    parent_link: "left_link6"
    child_link: "left_finger"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [0.0, 1.0]
    velocity_limit: 0.5
    effort_limit: 30.0
    actuator_kind: "servo"
    role: "gripper"
  - name: "right_joint1"
    joint_type: "revolute"
    sim_joint_name: "fr_joint1"
    parent_link: "world"
    child_link: "right_link1"
    axis_xyz: [0.0, 0.0, 1.0]
    position_limits: [-2.618, 2.618]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint2"
    joint_type: "revolute"
    sim_joint_name: "fr_joint2"
    parent_link: "right_link1"
    child_link: "right_link2"
    axis_xyz: [0.0, 1.0, 0.0]
    position_limits: [0.0, 3.14]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint3"
    joint_type: "revolute"
    sim_joint_name: "fr_joint3"
    parent_link: "right_link2"
    child_link: "right_link3"
    axis_xyz: [0.0, 1.0, 0.0]
    # Elbow unfolds toward +q on RoboTwin's ARX5 URDF (`lerobot/robotwin_unified`
    # state mean +0.81 rad); PiPER's [-2.967, 0] magnitude with that sign.
    position_limits: [0.0, 2.967]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint4"
    joint_type: "revolute"
    sim_joint_name: "fr_joint4"
    parent_link: "right_link3"
    child_link: "right_link4"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [-1.745, 1.745]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint5"
    joint_type: "revolute"
    sim_joint_name: "fr_joint5"
    parent_link: "right_link4"
    child_link: "right_link5"
    axis_xyz: [0.0, 1.0, 0.0]
    position_limits: [-1.22, 1.22]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_joint6"
    joint_type: "revolute"
    sim_joint_name: "fr_joint6"
    parent_link: "right_link5"
    child_link: "right_link6"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "right_gripper"
    joint_type: "prismatic"
    sim_joint_name: "fr_joint7"
    parent_link: "right_link6"
    child_link: "right_finger"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [0.0, 1.0]
    velocity_limit: 0.5
    effort_limit: 30.0
    actuator_kind: "servo"
    role: "gripper"

end_effectors:
  - name: "left_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 30.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6
  - name: "right_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 30.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6

# Three RGB cameras: a head (overhead) view + per-wrist views. RoboTwin's
# native keys are cam_high / cam_left_wrist / cam_right_wrist (480×640 in the
# `lerobot/robotwin_unified` dataset). The public `lerobot/smolvla_robotwin`
# checkpoint's `config.json` consumes them at 256×256 under the generic feature
# keys observation.images.camera1/2/3 (the same naming the franka_panda /
# ManiSkill rSkills use). The HAL-facing sensor names are
# canonical (top / wrist_left / wrist_right); the checkpoint-facing
# `vla_feature_key` stays camera1/2/3 since it is frozen per checkpoint. The
# RoboTwin sidecar re-keys the env's three cameras to scene cameras in
# head→left→right order.
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "sim"
    model: "robotwin_cam_high"
    # MuJoCo twin only (RoboTwin renders its own): RoboTwin's `head_camera`
    # (config.yml static_camera_list) moved from its world into the robot
    # frame (robot_pose: y -0.65, yaw +90 deg).
    sim_placement:
      pos: [0.2, 0.032, 1.35]
      target: [0.8, 0.032, 0.55]
  - name: "wrist_left"
    modality: "rgb"
    frame_id: "left_link6"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    vendor: "sim"
    model: "robotwin_cam_left_wrist"
    # MuJoCo twin only: on the URDF's `left_camera` link (x forward, z up).
    sim_placement:
      parent_body: "left_camera"
      pos: [0.0, 0.0, 0.0]
      target: [1.0, 0.0, 0.0]
  - name: "wrist_right"
    modality: "rgb"
    frame_id: "right_link6"
    rate_hz: 25.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera3"
    vendor: "sim"
    model: "robotwin_cam_right_wrist"
    # MuJoCo twin only: on the URDF's `right_camera` link (x forward, z up).
    sim_placement:
      parent_body: "right_camera"
      pos: [0.0, 0.0, 0.0]
      target: [1.0, 0.0, 0.0]

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  supported_control_modes:
    - "joint_position"
    # The two parallel grippers (see end_effectors) accept position
    # commands; advertise the mode so a gripper-driving skill matches the gate.
    - "gripper_position"
  supported_vla_embodiments: ["aloha_agilex", "aloha", "lerobot"]
  embodiment_tags:
    - "aloha_agilex"
    - "aloha"
    - "lerobot"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  deadman_required: false

# AgileX PiPER ROS 2 driver is Apache-2.0 / MIT (vendor-distributed); no real
# HAL is wired here (sim-only embodiment: the SAPIEN env or the MuJoCo twin).
sdk_kind: "open"

hal:
  # null -> build_hal derives MujocoArmHAL.from_description from `sim:` below.
  sim: null
  real: null

# MuJoCo wiring for the twin (robotwin:aloha_agilex MJCF): actuators 0-13 are
# the joints above in order. qpos 0-7 are fl_joint1..8 and 8-15 fr_joint1..8;
# each gripper actuator drives joint7 (0 closed .. 0.04765 m open) and an MJCF
# equality mirrors it onto joint8 (qpos 7 / 15), as RoboTwin's config.yml
# couples them. qpos 0 is RoboTwin's config.yml home pose and inside every range.
sim:
  joint_qpos_addr:
    left_joint1: 0
    left_joint2: 1
    left_joint3: 2
    left_joint4: 3
    left_joint5: 4
    left_joint6: 5
    left_gripper: 6
    right_joint1: 8
    right_joint2: 9
    right_joint3: 10
    right_joint4: 11
    right_joint5: 12
    right_joint6: 13
    right_gripper: 14
  grippers:
    - joint: "left_gripper"
      ctrl_range: [0.0, 0.04765]
      qpos_addrs: [6]
      qpos_scale: 0.04765
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 6
    - joint: "right_gripper"
      ctrl_range: [0.0, 0.04765]
      qpos_addrs: [14]
      qpos_scale: 0.04765
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 13

observation_spec:
  state_key: "observation.state"
  state_shape: [14]
  state_representation: "joint_positions"

action_spec:
  dim: 14
  representation: "joint_positions"
  control_freq_hz: 25.0
schema_version: "0.2"

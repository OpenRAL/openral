# RobotDescription — AgileX "aloha-agilex" dual-arm (RoboTwin 2.0 embodiment).
#
# This describes the bimanual AgileX platform RoboTwin 2.0 evaluates by
# default: two 6-DoF PiPER arms with parallel grippers (14-DoF action
# space, 7 per arm) and three RGB cameras (head + per-wrist). It is the
# embodiment behind `lerobot/robotwin_unified` and the public RoboTwin
# checkpoints (e.g. `lerobot/smolvla_robotwin`).
#
# Two sims run it:
# * the SAPIEN env owned by the RoboTwin sidecar (scenes/sim/robotwin_*), where
#   the SAPIEN model is authoritative and the openral side never instantiates
#   the robot;
# * a bare MuJoCo twin (`MujocoArmHAL.from_description`, the `sim:` block
#   below) on an MJCF derived from the same URDF, for `openral deploy sim` and
#   the dashboard (scenes/deploy/aloha_agilex_twin.yaml).
# Joint kinematics below are approximate (sufficient for capability matching +
# SafetyEnvelope authoring).

name: "aloha_agilex"
embodiment_kind: "bimanual"

base_frame: "world"

# The URDF RoboTwin's SAPIEN scene loads (`embodiments.zip`, MIT, pinned
# Hugging Face revision; openral_hal._robotwin_aloha_agilex_assets) for geometry
# outside the sim: renders, viewers, collision lowering. Its arms are `fl_*`
# (left) / `fr_*` (right), bridged by `sim_joint_name`; its joint limits are
# ±10 rad placeholders, so the limits below stay the authority. The MJCF is the
# MuJoCo twin derived from it: the front arms actuated at these limits, the
# base, wheels and rear arms welded.
assets:
  urdf:
    ref: "robotwin:aloha_agilex"
  mjcf: "robotwin:aloha_agilex"

joints:
  # 14-DoF: 2 arms × (6 revolute joints + 1 gripper). AgileX PiPER limits
  # are approximate; the SAPIEN model is authoritative (see header note).
  - name: "left_joint1"
    origin_xyz: [0, 0, 0.058]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    sim_joint_name: "fl_joint1"
    parent_link: "fl_base_link"
    child_link: "fl_link1"
    position_limits: [-2.618, 2.618]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint2"
    origin_xyz: [0.025013, 0.00060169, 0.042]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    sim_joint_name: "fl_joint2"
    parent_link: "fl_link1"
    child_link: "fl_link2"
    position_limits: [0.0, 3.14]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint3"
    origin_xyz: [-0.26396, 0.0044548, 0]
    origin_rpy: [3.1415853, 0, -0.015928]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    sim_joint_name: "fl_joint3"
    parent_link: "fl_link2"
    child_link: "fl_link3"
    # Elbow unfolds toward +q on RoboTwin's ARX5 URDF (`lerobot/robotwin_unified`
    # state mean +0.81 rad); PiPER's [-2.967, 0] magnitude with that sign.
    position_limits: [0.0, 2.967]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint4"
    origin_xyz: [0.246, -0.00025, -0.06]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    sim_joint_name: "fl_joint4"
    parent_link: "fl_link3"
    child_link: "fl_link4"
    position_limits: [-1.745, 1.745]
    velocity_limit: 3.0
    effort_limit: 30.0
    actuator_kind: "servo"
  - name: "left_joint5"
    origin_xyz: [0.06775, 0.0015, -0.0855]

# RobotDescription — Trossen ALOHA bimanual (real + sim).
#
# This describes the *physical* Trossen ALOHA: two 7-DoF ViperX 300 arms
# with parallel grippers (14-DoF action space), one top-down RGB camera.
# gym-aloha's MuJoCo scene mirrors the real robot one-to-one, so the
# same manifest covers both — no robot/sim conflation here.
# Used by tests/sim/test_aloha_bimanual_act_aloha*.py.
#
# Joint kinematic detail is approximate — gym-aloha does not expose the
# URDF through its gym API. Sufficient for capability matching and
# SafetyEnvelope authoring; if a HAL adapter ever drives a real ALOHA
# the URDF wins.

name: "aloha_bimanual"
embodiment_kind: "bimanual"

base_frame: "world"

# robot_state_publisher: `assets.urdf` deliberately unset.
# The ALOHA arms (Trossen ViperX-300) have an upstream xacro at
# github.com/Interbotix/interbotix_ros_manipulators/blob/main/
# interbotix_ros_xsarms/interbotix_xsarm_descriptions/urdf/vx300s.urdf.xacro
# but it requires the upstream apt package
# (`ros-${ROS_DISTRO}-interbotix-xsarm-descriptions`) + xacro
# processing at launch time — neither is wired here yet. The
# `robot_descriptions` Python package ships an MJCF (`aloha_mj_description`)
# only. Wire one of these once a wrapped-task-space VLA targets aloha.

# Unified asset block. MJCF-only (no URDF/SRDF wired yet).
assets:
  mjcf: "gym_aloha:bimanual_viperx_transfer_cube"

joints:
  # 14-DoF: 2 arms × (6 revolute joints + 1 gripper)
  - name: "left_waist"
    origin_xyz: [0, 0, 0.079]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, 1]
    sim_joint_name: "vx300s_left/waist"
    joint_type: "revolute"
    parent_link: "vx300s_left"
    child_link: "left_link1"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_shoulder"
    origin_xyz: [0, 0, 0.04805]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_left/shoulder"
    joint_type: "revolute"
    parent_link: "left_link1"
    child_link: "left_link2"
    position_limits: [-1.85, 1.25]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_elbow"
    origin_xyz: [0.05955, 0, 0.3]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_left/elbow"
    joint_type: "revolute"
    parent_link: "left_link2"
    child_link: "left_link3"
    position_limits: [-1.76, 1.6]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_forearm_roll"
    origin_xyz: [0.2, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    sim_joint_name: "vx300s_left/forearm_roll"
    joint_type: "revolute"
    parent_link: "left_link3"
    child_link: "left_link4"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_wrist_angle"
    origin_xyz: [0.1, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_left/wrist_angle"
    joint_type: "revolute"
    parent_link: "left_link4"
    child_link: "left_link5"
    position_limits: [-1.8, 2.2]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_wrist_rotate"
    origin_xyz: [0.069744, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    sim_joint_name: "vx300s_left/wrist_rotate"
    joint_type: "revolute"
    parent_link: "left_link5"
    child_link: "left_link6"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "left_gripper"
    origin_xyz: [0.0687, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_left/left_finger"
    joint_type: "prismatic"
    parent_link: "left_link6"
    child_link: "left_finger"
    position_limits: [0.0, 1.0]
    # The [0, 1] opening -> the twin's finger slide (m), the gym-aloha ctrl_range: the
    # kernel and /tf pose the finger at curve(q) (#533). Twin-measured; a real ViperX's
    # finger travel is not confirmed against it (issue #250 covers the real HAL).
    urdf_curve: [[0.0, 0.021], [1.0, 0.057]]
    velocity_limit: 0.5
    effort_limit: 4.0
    actuator_kind: "servo"
    role: "gripper"
  - name: "right_waist"
    origin_xyz: [0, 0, 0.079]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, 1]
    sim_joint_name: "vx300s_right/waist"
    joint_type: "revolute"
    parent_link: "vx300s_right"
    child_link: "right_link1"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_shoulder"
    origin_xyz: [0, 0, 0.04805]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_right/shoulder"
    joint_type: "revolute"
    parent_link: "right_link1"
    child_link: "right_link2"
    position_limits: [-1.85, 1.25]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_elbow"
    origin_xyz: [0.05955, 0, 0.3]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_right/elbow"
    joint_type: "revolute"
    parent_link: "right_link2"
    child_link: "right_link3"
    position_limits: [-1.76, 1.6]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_forearm_roll"
    origin_xyz: [0.2, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    sim_joint_name: "vx300s_right/forearm_roll"
    joint_type: "revolute"
    parent_link: "right_link3"
    child_link: "right_link4"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_wrist_angle"
    origin_xyz: [0.1, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_right/wrist_angle"
    joint_type: "revolute"
    parent_link: "right_link4"
    child_link: "right_link5"
    position_limits: [-1.8, 2.2]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_wrist_rotate"
    origin_xyz: [0.069744, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    sim_joint_name: "vx300s_right/wrist_rotate"
    joint_type: "revolute"
    parent_link: "right_link5"
    child_link: "right_link6"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 3.0
    effort_limit: 4.0
    actuator_kind: "servo"
  - name: "right_gripper"
    origin_xyz: [0.0687, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_right/left_finger"
    joint_type: "prismatic"
    parent_link: "right_link6"
    child_link: "right_finger"
    position_limits: [0.0, 1.0]
    # The [0, 1] opening -> the twin's finger slide (m), the gym-aloha ctrl_range: the
    # kernel and /tf pose the finger at curve(q) (#533). Twin-measured; a real ViperX's
    # finger travel is not confirmed against it (issue #250 covers the real HAL).
    urdf_curve: [[0.0, 0.021], [1.0, 0.057]]
    velocity_limit: 0.5
    effort_limit: 4.0
    actuator_kind: "servo"
    role: "gripper"

# The other finger of each gripper: gym-aloha drives it by its own (mirror) actuator at the
# negated slide, so the kernel poses it at -curve(q) on the same axis. Origins and axes
# below are the gym-aloha MJCF's (bodies at qpos 0), as are the joint origins above.
mimic_joints:
  - name: "left_finger_mirror"
    origin_xyz: [0.0687, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_left/right_finger"
    joint_type: "prismatic"
    parent_link: "left_link6"
    child_link: "left_finger_mirror"
    mimics: "left_gripper"
    multiplier: -1.0
    offset: 0.0
  - name: "right_finger_mirror"
    origin_xyz: [0.0687, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    sim_joint_name: "vx300s_right/right_finger"
    joint_type: "prismatic"
    parent_link: "right_link6"
    child_link: "right_finger_mirror"
    mimics: "right_gripper"
    multiplier: -1.0
    offset: 0.0

# Each arm's base plate on the table, and each gripper's rigid prop plate: their own bodies
# in the twin, named as the MJCF bodies so the collision lowering maps them. Poses are the
# gym-aloha MJCF's.
# SIM ONLY: this layout (and the collision_geometry fitted to it) is gym-aloha's, not a
# measured rig; a real deploy refuses a kernel model with no URDF behind it.
fixed_attachments:
  - name: "left_base_mount"
    parent_link: "world"
    child_link: "vx300s_left"
    origin_xyz: [-0.469, 0.5, 0]
    origin_rpy: [0, 0, 0]
  - name: "right_base_mount"
    parent_link: "world"
    child_link: "vx300s_right"
    origin_xyz: [0.469, 0.5, 0]
    origin_rpy: [0, 0, -3.141585]
  - name: "left_gripper_prop_mount"
    parent_link: "left_link6"
    child_link: "vx300s_left/gripper_prop_link"
    origin_xyz: [0.0485, 0, 0]
    origin_rpy: [0, 0, 0]
  - name: "right_gripper_prop_mount"
    parent_link: "right_link6"
    child_link: "vx300s_right/gripper_prop_link"
    origin_xyz: [0.0485, 0, 0]
    origin_rpy: [0, 0, 0]

end_effectors:
  - name: "left_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 4.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6
  - name: "right_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 4.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.6

# Single 480x640 top-down RGB camera matching gym-aloha's
# ``obs["pixels"]["top"]`` stream.
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 50.0
    intrinsics:
      width: 640
      height: 480
      fx: 480.0
      fy: 480.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.top"
    vendor: "sim"
    model: "gym_aloha_top"

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  supported_control_modes:
    - "joint_position"
  supported_vla_embodiments: ["aloha", "lerobot"]
  embodiment_tags:
    - "aloha"
    - "lerobot"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  deadman_required: false
  # provisional: former schema default, not measured on this rig — see issue #303
  max_force_n: 50.0
  max_torque_nm: 10.0
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose — the runner's former defaults,
  # declared here so they are visible; provisional until run on this rig.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Prismatic joints (the 0.041 m gripper stroke), in metres: a rad tolerance of
  # 0.05 was wider than the whole stroke, so the gripper always "arrived".
  # provisional, not measured on this rig: the stroke-time and tolerance
  # fraction of the OpenArm gripper (0.785 rad at 0.5 rad/s, 0.05 rad) scaled
  # to this stroke. The runner also caps each joint at its velocity_limit.
  starting_pose_max_joint_speed_m_s: 0.025
  starting_pose_tolerance_m: 0.0025
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). provisional: AlohaHAL's former constructor default,
  # not measured on this rig — measure with
  # tools/joint_state_staleness_probe.py --robot <this manifest>.
  joint_state_staleness_limit_s: 0.2

# Trossen Interbotix XS SDK + interbotix_ros_manipulators ROS 2 driver are
# BSD-3 / Apache-2.0 (compatible per CLAUDE.md §1.9) but ship as
# vendor-distributed packages, so the manifest declares closed_with_api
# and sets hal.real to the real-hardware HAL adapter (issue #58).
#
# This YAML mirrors `ALOHA_REAL_DESCRIPTION` in
# python/hal/src/openral_hal/aloha.py (drift guarded by
# tests/unit/test_robot_manifests_match_hal_constants.py). The sim
# baseline `ALOHA_DESCRIPTION` in the same file keeps sdk_kind: open and
# the same `hal` block; gym-aloha is constructed directly by
# openral_sim.backends.aloha.
sdk_kind: "closed_with_api"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
hal:
  # null → build_hal derives MujocoArmHAL.from_description(this manifest)
  # from the `sim:` block below; no per-robot Python class is involved.
  sim: null
  real: "openral_hal.aloha:AlohaHAL"

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``
# for the gym-aloha sim twin.  Source:
# ``gym_aloha/assets/bimanual_viperx_transfer_cube.xml``.  Each gripper
# is a parallel jaw driven by two finger actuators (positive +
# mirror_actuator_index=positive+1).  The MJCF's keyframe 0 seeds the
# fingers inside ``ctrlrange=[0.021, 0.057]`` — without it, ``qpos=0``
# (the MjData default) sits below the joint limit and the position
# actuator can't recover in a finite number of steps.
sim:
  joint_qpos_addr:
    left_waist: 0
    left_shoulder: 1
    left_elbow: 2
    left_forearm_roll: 3
    left_wrist_angle: 4
    left_wrist_rotate: 5
    left_gripper: 6        # positive finger; negative finger at qpos 7
    right_waist: 8
    right_shoulder: 9
    right_elbow: 10
    right_forearm_roll: 11
    right_wrist_angle: 12
    right_wrist_rotate: 13
    right_gripper: 14       # positive finger; negative finger at qpos 15
  actuator_index:
    left_waist: 0
    left_shoulder: 1
    left_elbow: 2
    left_forearm_roll: 3
    left_wrist_angle: 4
    left_wrist_rotate: 5
    left_gripper: 6
    right_waist: 8
    right_shoulder: 9
    right_elbow: 10
    right_forearm_roll: 11
    right_wrist_angle: 12
    right_wrist_rotate: 13
    right_gripper: 14
  grippers:
    - joint: "left_gripper"
      ctrl_range: [0.021, 0.057]
      qpos_addrs: [6]
      qpos_scale: 0.036   # 0.057 - 0.021
      # The channel is normalized [0, 1] (0 closed, 1 open): what gym_aloha
      # and the act-aloha checkpoints use. It maps affinely onto the MJCF
      # finger range [0.021, 0.057] m, and reads back the same way.
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 6
      mirror_actuator_index: 7
    - joint: "right_gripper"
      ctrl_range: [0.021, 0.057]
      qpos_addrs: [14]
      qpos_scale: 0.036
      read_mode: "affine_low_high"
      write_mode: "normalised"
      actuator_index: 14
      mirror_actuator_index: 15
  keyframe_index: 0

onboard_compute:
  driver_license: "BSD-3-Clause"             # interbotix_ros_manipulators
  driver_repo: "https://github.com/Interbotix/interbotix_ros_manipulators"
  # NOT the rig's wire contract: a real ALOHA runs interbotix_xs_sdk's
  # xs_sdk (commands/joint_group, per-namespace joint_states), with no
  # controller_manager at all. Left as-is pending the on-rig namespace and
  # motor_config check issue #250 asks for before these change.
  left_arm_controller: "left_arm/arm_controller"
  right_arm_controller: "right_arm/arm_controller"
  left_gripper_controller: "left_arm/gripper_controller"
  right_gripper_controller: "right_arm/gripper_controller"
  joint_state_topic: "/joint_states"
  estop_topic: "/aloha/estop"

observation_spec:
  state_key: "observation.state"
  state_shape: [14]
  state_representation: "joint_positions"

action_spec:
  dim: 14
  representation: "joint_positions"
  control_freq_hz: 50.0
schema_version: "0.2"


# RobotDescription — Anvil OpenARM 2.0 bimanual arm (sim baseline).
#
# This manifest mirrors `ANVIL_OPENARM_V2_DESCRIPTION` in
# python/hal/src/openral_hal/anvil_openarm_v2.py (drift guarded by
# tests/unit/test_robot_manifests_match_hal_constants.py).
#
# The Anvil OpenARM 2.0 (docs.anvil.bot/introduction/openarm-2.0) is
# Anvil Robotics' manufactured variant of the standard OpenArm v2.
# The 2.0 generation carries the OpenARM 2.0 wrist swap (J6 = radial /
# ulnar deviation, J7 = flexion / extension — flipped vs OpenArm 1.0);
# the Anvil variant differs from the standard v2 in exactly two
# documented joint ranges plus one part:
#
#   - J1: +/-135 deg (standard v2: -200..+80 in MJCF sign convention)
#   - J6: -45..+70 deg (standard v2: +/-45) — the extra +25 deg of
#     radial deviation enabled by Anvil's wrist support bracket
#   - the wrist support bracket itself (visual-only CAD meshes on the
#     link5 forearm bodies in the fetched MJCF)
#
# Everything else — kinematics, meshes, native <position> actuators
# with per-class PD gains, single-driven-finger grippers with the
# <equality>-coupled follower — is upstream Enactic OpenArm v2, so per
# ADR-0023 both OpenARM manifests inherit the shared MujocoArmHAL
# behavior declaratively; neither needs bespoke control code.
#
# The MJCF is generated by bensonlee5/anvil-openarm-mujoco (upstream
# enactic/openarm_mujoco v2 files + the Anvil deltas, validated against
# the docs' numeric comparison table) and fetched at a pinned SHA by
# openral_hal._anvil_openarm_v2_assets.ensure_anvil_openarm_v2_mjcf via the
# `openarm:anvil_v2_bimanual` asset ref below.
#
# A real-HW HAL wrapping Anvil's driver stack
# (github.com/anvil-robotics/openarm, the Damiao CAN stack; Quest
# teleop via /follower_{l,r}_forward_position_controller/commands) is a
# planned follow-up; both share this manifest.

name: "anvil_openarm_v2"
embodiment_kind: "bimanual"
# The Anvil bimanual MJCF mounts both arm base_link bodies directly in
# the worldbody (no shared torso body), so — like the ALOHA
# MuJoCo-only manifest — the base frame is the world frame.
base_frame: "world"

# ADR-0058 — unified asset block.  `urdf` deliberately unset: upstream
# (enactic/openarm_description and Anvil's fork) is xacro-only, and
# like ALOHA the MuJoCo asset is the sim source of truth until a
# wrapped-task-space VLA needs robot_state_publisher (ADR-0027).
assets:
  mjcf: "openarm:anvil_v2_bimanual"

joints:
  # ── Left arm (7 revolute) — J1/J6 carry the Anvil 2.0 ranges ──────
  - name: "left_joint1"
    origin_xyz: [0, 0.0625, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_base_link"
    child_link: "openarm_left_link1"
    position_limits: [-2.3562, 2.3562]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint1"
  - name: "left_joint2"
    origin_xyz: [0, 0.06, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link1"
    child_link: "openarm_left_link2"
    position_limits: [-3.31613, 0.174533]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint2"
  - name: "left_joint3"
    origin_xyz: [0, 0, -0.06625]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, -1]
    joint_type: "revolute"
    parent_link: "openarm_left_link2"
    child_link: "openarm_left_link3"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 27.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint3"
  - name: "left_joint4"
    origin_xyz: [0, 0, -0.15375]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link3"
    child_link: "openarm_left_link4"
    position_limits: [0.0, 2.44346]
    velocity_limit: 4.0
    effort_limit: 27.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint4"
  - name: "left_joint5"
    origin_xyz: [0, 0, -0.0955]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, -1]
    joint_type: "revolute"
    parent_link: "openarm_left_link4"
    child_link: "openarm_left_link5"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint5"
  # J6 — radial/ulnar deviation (the OpenARM 2.0 wrist swap); the
  # -45..+70 deg range is the Anvil bracket delta vs standard v2's ±45.
  - name: "left_joint6"
    origin_xyz: [0, 0, -0.1205]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link5"
    child_link: "openarm_left_link6"
    position_limits: [-0.7854, 1.2217]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint6"
  # J7 — flexion/extension; coincident with J6 (gimbal wrist).
  - name: "left_joint7"
    origin_xyz: [0, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link6"
    child_link: "openarm_left_ee_base_link"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint7"
  # ── Left gripper (1 revolute) — drives finger_joint1; the outer
  # finger follows via the MJCF <equality> constraint ────────────────
  - name: "left_gripper"
    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_ee_base_link"
    child_link: "openarm_left_ee_inner_finger"
    position_limits: [0.0, 0.7854]
    velocity_limit: 4.0
    effort_limit: 10.0
    has_torque_sensor: false
    actuator_kind: "servo"
    role: "gripper"
  # ── Right arm (7 revolute) — J1/J6 identical numerics (mirrored
  # axes); J2 keeps the v2 mirrored asymmetry ────────────────────────
  - name: "right_joint1"
    origin_xyz: [0, -0.0625, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_base_link"
    child_link: "openarm_right_link1"
    position_limits: [-2.3562, 2.3562]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint1"
  - name: "right_joint2"
    origin_xyz: [0, -0.06, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_link1"
    child_link: "openarm_right_link2"
    position_limits: [-0.174533, 3.31613]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint2"
  - name: "right_joint3"
    origin_xyz: [0, 0, -0.06625]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, -1]
    joint_type: "revolute"
    parent_link: "openarm_right_link2"
    child_link: "openarm_right_link3"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 27.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint3"
  - name: "right_joint4"
    origin_xyz: [0, 0, -0.15375]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, -1, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_link3"
    child_link: "openarm_right_link4"
    position_limits: [0.0, 2.44346]
    velocity_limit: 4.0
    effort_limit: 27.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint4"
  - name: "right_joint5"
    origin_xyz: [0, 0, -0.0955]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, -1]
    joint_type: "revolute"
    parent_link: "openarm_right_link4"
    child_link: "openarm_right_link5"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint5"
  - name: "right_joint6"
    origin_xyz: [0, 0, -0.1205]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_link5"
    child_link: "openarm_right_link6"
    position_limits: [-0.7854, 1.2217]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint6"
  - name: "right_joint7"
    origin_xyz: [0, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_link6"
    child_link: "openarm_right_ee_base_link"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_right_joint7"
  # ── Right gripper (1 revolute) — mirrored negative range vs left ──
  - name: "right_gripper"
    origin_xyz: [-0.00143, 0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_right_ee_base_link"
    child_link: "openarm_right_ee_inner_finger"
    position_limits: [-0.7854, 0.0]
    velocity_limit: 4.0
    effort_limit: 10.0
    has_torque_sensor: false
    actuator_kind: "servo"
    role: "gripper"

end_effectors:
  - name: "left_gripper"
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 10.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7
  - name: "right_gripper"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 10.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7

capabilities:
  locomotion: ["none"]
  can_lift_kg: 2.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  supported_control_modes:
    - "joint_position"
  supported_vla_embodiments:
    - "anvil_openarm_v2"
    - "openarm"
  embodiment_tags:
    - "openarm"
    - "anvil_openarm_v2"
    - "anvil"
    - "bimanual"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  max_force_n: 40.0
  max_torque_nm: 40.0
  deadman_required: true

# `sdk_kind: open` — the enactic/openarm_mujoco MJCF, the
# anvil-openarm-mujoco generator, and Anvil's Damiao CAN driver
# (github.com/anvil-robotics/openarm) are all open-source /
# Apache-2.0.  A future `AnvilOpenArmV2RealHAL` wrapping that driver
# keeps `sdk_kind: open` and sets `hal.real`.
sdk_kind: "open"
# ADR-0031 — explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# Sim-only today → real: null until the Anvil driver wrapper lands.
hal:
  sim: "openral_hal.anvil_openarm_v2:AnvilOpenArmV2MujocoHAL"
  real: null
  # AnvilOpenArmV2MujocoHAL construction kwargs, threaded by build_hal so
  # the manifest-driven node needs no bespoke ROS params (ADR-0029).
  parameters:
    defaults:
      settle_steps: 4
      gravity_enabled: false
      staleness_limit_s: 0.5

# The Anvil bimanual MJCF ships two wrist cameras (fovy 66 deg,
# 960x600 on the real rig).  The MJCF leaves MuJoCo's offscreen
# framebuffer at its 640x480 default, so the sim sensors render at
# 640x400 — same 16:10 aspect, fovy-matched intrinsics
# (fy = 200 / tan(33 deg) ~= 308).  Published by
# MujocoArmHAL.read_images via the SimSensorBridge (ADR-0065/0070);
# `vla_feature_key` values follow the fleet convention.
sensors:
  - name: "wrist_left"
    modality: "rgb"
    frame_id: "openarm_left_ee_base_link"
    rate_hz: 10.0
    intrinsics:
      width: 640
      height: 400
      fx: 308.0
      fy: 308.0
      cx: 320.0
      cy: 200.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.wrist_left"
    vendor: "sim"
    model: "mujoco_wrist"
    sim_camera_name: "camera_wrist_left"
  - name: "wrist_right"
    modality: "rgb"
    frame_id: "openarm_right_ee_base_link"
    rate_hz: 10.0
    intrinsics:
      width: 640
      height: 400
      fx: 308.0
      fy: 308.0
      cx: 320.0
      cy: 200.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.wrist_right"
    vendor: "sim"
    model: "mujoco_wrist"
    sim_camera_name: "camera_wrist_right"

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL`` (ADR-0023).
# Source: models/anvil_openarm_bimanual.xml from
# bensonlee5/anvil-openarm-mujoco at the SHA pinned in
# openral_hal._anvil_openarm_v2_assets, fetched lazily via the
# ``openarm:anvil_v2_bimanual`` ref above.
# qpos layout (18 slots, same as the Enactic v2 arm): left arm 0-6,
# left fingers 7 + 8, right arm 9-15, right fingers 16 + 17.  The
# public 16-DoF surface maps each gripper channel to finger_joint1
# (qpos 7 / 16) and skips the <equality>-coupled follower (8 / 17).
# 16 actuators in description.joints order → the default 1:1 actuator
# map is correct.  ``seed_ctrl_from_qpos: true`` because the native
# <position> actuators would otherwise yank every joint to ctrl=0 on
# the first mj_step.
sim:
  joint_qpos_addr:
    left_joint1: 0
    left_joint2: 1
    left_joint3: 2
    left_joint4: 3
    left_joint5: 4
    left_joint6: 5
    left_joint7: 6
    left_gripper: 7
    right_joint1: 9
    right_joint2: 10
    right_joint3: 11
    right_joint4: 12
    right_joint5: 13
    right_joint6: 14
    right_joint7: 15
    right_gripper: 16
  grippers:
    - joint: "left_gripper"
      ctrl_range: [0.0, 0.7854]
      qpos_addrs: [7]
      qpos_scale: 0.7854
      read_mode: "passthrough"
      write_mode: "passthrough"
    - joint: "right_gripper"
      ctrl_range: [-0.7854, 0.0]
      qpos_addrs: [16]
      qpos_scale: 0.7854
      read_mode: "passthrough"
      write_mode: "passthrough"
  seed_ctrl_from_qpos: true
schema_version: '0.1'

    velocity_limit: 2.610
    effort_limit: 12.0
    has_torque_sensor: true
    actuator_kind: "bldc"
  # Robotiq 2F-85 jaw as a NORMALISED fraction [0 = closed, 1 = open], like every
  # OpenRAL gripper channel. The URDF leader is `finger_joint` (0 = open .. 0.8 rad
  # = closed), the opposite sense, so the Isaac scenes map it with
  # backend_options.gripper_joint_curve (closed = pi/4, Arena's close target).
  # The five <mimic> followers of the URDF carry no channel of their own.
  # `robotiq_finger_pair` is a logical link (franka_panda's `panda_finger_pair`)
  # with no primitive: posing the URDF's `left_outer_knuckle` here would read the
  # normalised fraction as radians. The real linkage is posed from this fraction
  # by `mimic_joints` below (see README.md "Self-collision").
  - name: "finger_joint"
    origin_xyz: [0.0, -0.0306, 0.0549]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "robotiq_arg2f_base_link"
    child_link: "robotiq_finger_pair"
    position_limits: [0.0, 1.0]
    velocity_limit: 5.0
    effort_limit: 16.5
    has_torque_sensor: false
    actuator_kind: "servo"
    role: "gripper"
    # Position-stall grasp-trigger thresholds, in this channel's [0, 1] fraction units.
    # SIM-MEASURED (2026-10-16), Isaac 6.1 deploy twin of
    # scenes/deploy/isaac_arena_droid_banana_in_bowl.yaml, 15 Hz joint states, sim time:
    # (a) the twin's empty closes (start pose, nothing between the jaws, 1 -> 0 and
    #     0.5 -> 0): every close settles at 0.00000 (|gap| <= 3.6e-7);
    # (b) deploy-sim trial t5's pi0.5 run (fox_mcap, /joint_states vs the commanded
    #     fraction), split by phase, gap = measured - commanded, span = the jaw's spread
    #     over the trigger's 5-sample settle window (0.267 s at 15 Hz):
    #     - banana holds (command <= 0.20, settled, ticks 107-120 / 165-179): command
    #       0.093-0.105, measured 0.469-0.696, gap 0.366-0.598, span 0.0028-0.0185;
    #     - closed on nothing in the run (command <= 0.20, jaw at the command): gap
    #       -0.0008..0.0073, span 0.0018-0.0163;
    #     - free motion (command > 0.5): not a close command, span <= 0.0196.
    # - closed_position 0.0: the channel's closed end (`position_limits[0]`).
    # - closed_rest_offset 0.0: (a).
    # - close_band 0.20: pi0.5 holds the banana at commands 0.09-0.15, outside a
    #   stall_gap band (user-approved value). A command within 0.20 of closed arms.
    # - stall_gap 0.15: 20x the largest closed-on-nothing gap (0.0073), 0.41x the smallest
    #   banana-hold gap (0.366); its half (0.075, the slip/release hysteresis) is still
    #   10x the closed-on-nothing gap.
    # - settle_tolerance 0.02: above the largest settled hold span (0.0185); a closing
    #   jaw moves ~0.4 per tick in the twin, far outside it.
    # UNVERIFIED ON A REAL ROBOTIQ (no real HAL exists): re-measure on hardware before
    # any real `grasp_allowance_enabled` deploy. Safety-WG item; a hazard-log row is owed.
    closure_calibration:
      closed_position: 0.0
      closed_rest_offset: 0.0
      stall_gap: 0.15
      settle_tolerance: 0.02
      close_band: 0.20

end_effectors:
  - name: "robotiq_2f85"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "na"
    n_dof: 1
    # Robotiq 2F-85 product specification: grip force 20-235 N, payload 5 kg.
    max_grip_force_n: 235.0
    max_payload_kg: 3.0  # the Franka's payload bounds the pair, not the jaw's 5 kg
    workspace_radius_m: 0.855

capabilities:
  locomotion: ["none"]
  can_lift_kg: 3.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
    - "gripper_position"
  supported_vla_embodiments: ["droid_franka_robotiq"]
  embodiment_tags:
    - "droid_franka_robotiq"
    - "droid"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  max_force_n: 100.0
  max_torque_nm: 87.0
  deadman_required: true
  # provisional: copied from robots/franka_panda (same arm), not measured here.
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # finger_joint carries the normalised [0, 1] jaw fraction (radian-typed joint).
  starting_pose_max_joint_speed_m_s: 0.1
  starting_pose_tolerance_m: 0.05
  # provisional: robots/franka_panda's value; this robot has no real HAL.
  joint_state_staleness_limit_s: 0.2

# DROID's two RGB streams as Arena renders them (droid.py L566-610: 1280x720
# PinholeCameraCfg, horizontal_aperture 5.376, vertical_aperture 3.024 mm):
# `exterior` = Arena `external_camera` (focal 2.1 mm: fx = fy = 500 px, hfov
# 104.0 deg), the one Arena's openpi client sends as exterior_image_1_left;
# `wrist` = `wrist_camera` on the Robotiq base (focal 2.8 mm: 666.67 px, 87.66 deg).
# Mounted by the scene's camera_mounts (Arena's poses).
sensors:
  - name: "exterior"
    modality: "rgb"
    frame_id: "panda_link0"
    rate_hz: 15.0
    intrinsics: {width: 1280, height: 720, fx: 500.0, fy: 500.0, cx: 640.0, cy: 360.0}
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "sim"
    model: "arena_droid_external_camera"
  - name: "wrist"
    modality: "rgb"
    frame_id: "robotiq_arg2f_base_link"
    rate_hz: 15.0
    intrinsics: {width: 1280, height: 720, fx: 666.6667, fy: 666.6667, cx: 640.0, cy: 360.0}
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    vendor: "sim"
    model: "arena_droid_wrist_camera"

sdk_kind: "closed_with_api"
# DROID's control rate: 15 Hz (openpi examples/droid/main.py
# DROID_CONTROL_FREQUENCY = 15; Arena sim.dt 1/120 s x decimation 8,
# isaaclab_arena_manager_based_env_cfg.py L103-108).
action_spec:
  dim: 8
  representation: "joint_positions"
  control_freq_hz: 15.0

observation_spec:
  state_key: "observation.state"
  state_shape: [8]
  state_representation: "joint_positions"

# Isaac-only: no MJCF and no `sim:` block, so there is no MuJoCo twin to derive
# (`MujocoArmHAL`). Simulated only through the Isaac scenes it is attached to
# (scenes/{sim,deploy}/isaac_arena_droid_banana_in_bowl.yaml), like galaxea_a1 / r1pro.
hal:
  sim: null
  real: null

# The URDF's rigid chain from the arm flange to the jaw (panda_joint8, then
# robotiq_mount_joint: Arena's panda_hand_joint), so the lowering fits the Robotiq
# base and the kernel places it.
fixed_attachments:
  - name: "panda_joint8"
    parent_link: "panda_link7"
    child_link: "panda_link8"
    origin_xyz: [0, 0, 0.107]
    origin_rpy: [0, 0, 0]
  - name: "robotiq_mount_joint"
    parent_link: "panda_link8"
    child_link: "robotiq_arg2f_base_link"
    origin_xyz: [0, 0, 0.018174]
    origin_rpy: [0, 0, 0]
  # The Robotiq outer fingers (URDF left_bar_joint / right_bar_joint), rigid on
  # their outer knuckles (`mimic_joints`).
  - name: "left_bar_joint"
    parent_link: "left_outer_knuckle"
    child_link: "left_bar"
    origin_xyz: [0.0, 0.0315, -0.0041]
    origin_rpy: [0, 0, 0]
  - name: "right_bar_joint"
    parent_link: "right_outer_knuckle"
    child_link: "right_bar"
    origin_xyz: [0.0, 0.0315, -0.0041]
    origin_rpy: [0, 0, 0]

# The Robotiq 2F-85 linkage as moving links of the collision model, posed from the
# `finger_joint` jaw fraction f. Origins and axes are the URDF joints'. The Isaac
# scenes map f onto the URDF leader `finger_joint` through
# `backend_options.gripper_joint_curve` [[0, pi/4], [1, 0]] (Arena's close target,
# not the URDF's 0.8 rad limit), piecewise linear, and drive each URDF <mimic>
# follower at its multiplier times that (`tools/isaac_manifest_scene.py`
# `_write_slots`). So each row composes the curve with its URDF multiplier:
#   outer knuckle, inner knuckle (URDF multiplier +1):  q = pi/4 - pi/4 * f
#   inner finger + pad (URDF multiplier -1):            q = pi/4 * f - pi/4
# (f = 1 open = 0 rad; f = 0 closed = pi/4 rad.) The map is per backend:
# - EXACT in Isaac deploy sim, at the commanded fraction;
# - UNVERIFIED anywhere else: another backend or a real Robotiq driver must map f
#   the same way, or these rows are wrong for it (no real HAL exists today).
# The kernel checks the linkage at the COMMANDED fraction, as for every link. The
# names are the URDF joints'; the left outer knuckle's URDF joint is `finger_joint`
# itself, the manifest's channel, so its row has its own name. NEEDS Safety-WG
# review and a hazard-log row (CLAUDE.md §3) before it is relied on.
mimic_joints:
  - name: "left_outer_knuckle_joint"
    parent_link: "robotiq_arg2f_base_link"
    child_link: "left_outer_knuckle"
    mimics: "finger_joint"
    multiplier: -0.7853982
    offset: 0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, -0.0306011, 0.054904]
    origin_rpy: [0.0, 0.0, 3.141592653589793]
  - name: "right_finger_joint"
    parent_link: "robotiq_arg2f_base_link"
    child_link: "right_outer_knuckle"
    mimics: "finger_joint"
    multiplier: -0.7853982
    offset: 0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, 0.0306011, 0.054904]
    origin_rpy: [0.0, 0.0, 0.0]
  - name: "left_proximal_phalanx_joint"
    parent_link: "robotiq_arg2f_base_link"
    child_link: "left_proximal_phalanx"
    mimics: "finger_joint"
    multiplier: -0.7853982
    offset: 0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, -0.0127, 0.06142]
    origin_rpy: [0.125, 0.0, 3.141592653589793]
  - name: "right_proximal_phalanx_joint"
    parent_link: "robotiq_arg2f_base_link"
    child_link: "right_proximal_phalanx"
    mimics: "finger_joint"
    multiplier: -0.7853982
    offset: 0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, 0.0127, 0.06142]
    origin_rpy: [0.125, 0.0, 0.0]
  - name: "left_distal_phalanx_joint"
    parent_link: "left_bar"
    child_link: "left_distal_phalanx"
    mimics: "finger_joint"
    multiplier: 0.7853982
    offset: -0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, 0.0061, 0.0471]
    origin_rpy: [0.0, 0.0, 0.0]
  - name: "right_distal_phalanx_joint"
    parent_link: "right_bar"
    child_link: "right_distal_phalanx"
    mimics: "finger_joint"
    multiplier: 0.7853982
    offset: -0.7853982
    joint_type: "revolute"
    axis_xyz: [1.0, 0.0, 0.0]
    origin_xyz: [0.0, 0.0061, 0.0471]
    origin_rpy: [0.0, 0.0, 0.0]

schema_version: "0.2"

# Arm + Robotiq base: the `openral collision lower` output (`--tight-link` on every
# link), unchanged. The eight Robotiq 2F-85 linkage links after it are the same
# fitter's box + exact hull of each URDF link's meshes, in that link's own frame
# (`urdf_lowering.lower_link_geometry`), added by hand because the URDF lowering
# scopes its output to `joints` + `fixed_attachments`, not `mimic_joints`. So the
# fleet drift guard checks this robot's ACM only; `tests/unit/

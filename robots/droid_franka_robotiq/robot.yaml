# RobotDescription — DROID platform arm: Franka Emika Panda + Robotiq 2F-85
# (sim only today; no real HAL in this repo).
#
# The robot of Isaac Lab-Arena's `droid_abs_joint_pos` embodiment
# (isaaclab_arena/embodiments/droid/droid.py @738d20a, robot USD
# Arena/assets/robot_library/droid/franka_robotiq_2f_85_flattened.usd) and of the
# DROID dataset the π0.5 `pi05_droid_jointpos` checkpoint was trained on. Not
# `franka_panda`: that manifest declares the Franka hand; the Robotiq jaw, its
# mount and the wrist camera on it differ.
#
# Imported into Isaac Sim from the composed URDF beside this file (provenance in
# its header and README.md): example-robot-data's Panda arm (BSD-3) + the
# ros-industrial Robotiq 2F-85 (BSD-2), mounted where Arena's robot USD mounts it.
# Its meshes are rd:<robot_descriptions module>:<relpath> refs into the pinned
# panda_description (example-robot-data) and robotiq_2f85_v4_description clones,
# expanded by the collision lowering, the Isaac backend and deploy_e2e
# (openral_core.assets.expand_rd_mesh_refs).
#
# Arm joint values, limits and axes are the Franka's (data sheet; identical to
# robots/franka_panda and to Arena's USD, whose limits in degrees match these).

name: "droid_franka_robotiq"
embodiment_kind: "manipulator"
base_frame: "panda_link0"

assets:
  urdf:
    ref: "file:droid_franka_robotiq.urdf"
  # Two hand-reviewed ACM rows: the Robotiq inner knuckle / inner finger pin joints
  # (the closed four-bar loop the URDF tree omits). User-approved 2026-10-16, needs
  # Safety-WG review + hazard-log row (CLAUDE.md §3).
  srdf: "file:droid_franka_robotiq.srdf"

joints:

# RobotDescription — Franka Emika Panda (sim today; real-HW HAL planned).
#
# Mirrors FRANKA_PANDA_DESCRIPTION in python/hal/src/openral_hal/franka_panda.py:168
# — YAML is source of truth for eval-layer robot resolution
# (openral_sim.backends.robots) / from_yaml() consumers; the HAL constant
# remains the runtime-adapter source of truth (drift guarded by
# tests/unit/test_robot_manifests_match_hal_constants.py).
#
# Describes the *physical* Panda only (kinematics, actuator limits, EE,
# capabilities, safety envelope). Sim-imposed contracts (LIBERO's 8-D state,
# 7-D delta-EEF action, 180deg flip; RoboCasa's 4-D agent_pos; etc.) live in
# the scene adapter under python/sim/src/openral_sim/backends/<sim>.py, not here.
#
# Joint/EE limits from the Franka FR3/Panda data sheet
# (frankaemika.github.io/docs/control_parameters.html); the sim MJCF
# (mujoco_menagerie franka_emika_panda/panda.xml) mirrors the same numbers.

name: "franka_panda"
embodiment_kind: "manipulator"
base_frame: "panda_link0"

# robot_state_publisher wiring. The Franka URDF's root link
# matches our base_frame (``panda_link0``), so no static transform is
# needed; deploy_e2e.launch.py launches RSP directly with this URDF.
# Self-collision ACM source for the offline lowering tool: the Franka
# MoveIt SRDF. Regenerate via
# `openral collision lower --robot robots/franka_panda/robot.yaml --acm-only`.
# Unified asset block (URDF / MJCF / SRDF).
assets:
  urdf:
    ref: "rd:panda_description"
  mjcf: "rd:panda_mj_description"
  srdf: "file:franka_panda.srdf"

joints:
  - name: "panda_joint1"
    origin_xyz: [0, 0, 0.333]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link0"
    child_link: "panda_link1"
    position_limits: [-2.8973, 2.8973]
    velocity_limit: 2.175
    effort_limit: 87.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint1"

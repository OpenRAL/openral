    origin_xyz: [0, -0.316, 0]
    origin_rpy: [1.5707963, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link2"
    child_link: "panda_link3"
    position_limits: [-2.8973, 2.8973]
    velocity_limit: 2.175
    effort_limit: 87.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint3"
  - name: "panda_joint4"
    origin_xyz: [0.0825, 0, 0]
    origin_rpy: [1.5707963, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link3"
    child_link: "panda_link4"
    position_limits: [-3.0718, -0.0698]
    velocity_limit: 2.175
    effort_limit: 87.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint4"
  - name: "panda_joint5"
    origin_xyz: [-0.0825, 0.384, 0]
    origin_rpy: [-1.5707963, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link4"
    child_link: "panda_link5"
    position_limits: [-2.8973, 2.8973]
    velocity_limit: 2.610
    effort_limit: 12.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint5"
  - name: "panda_joint6"
    origin_xyz: [0, 0, 0]
    origin_rpy: [1.5707963, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link5"
    child_link: "panda_link6"
    position_limits: [-0.0175, 3.7525]
    velocity_limit: 2.610
    effort_limit: 12.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint6"
  - name: "panda_joint7"
    origin_xyz: [0.088, 0, 0]
    origin_rpy: [1.5707963, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "panda_link6"
    child_link: "panda_link7"
    position_limits: [-2.8973, 2.8973]
    velocity_limit: 2.610
    effort_limit: 12.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "joint7"
  # Synthetic normalised gripper channel (0 = closed, 1 = fully open)
  # mapped to the MJCF tendon actuator inside MujocoArmHAL.
  - name: "panda_gripper"
    joint_type: "prismatic"
    parent_link: "panda_hand"
    child_link: "panda_finger_pair"
    position_limits: [0.0, 1.0]
    velocity_limit: 0.1
    effort_limit: 70.0
    has_torque_sensor: false
    actuator_kind: "servo"
    role: "gripper"
    sim_joint_name: "finger_joint1"

end_effectors:
  - name: "panda_hand"
    kind: "parallel_gripper"
    hand: "na"
    n_dof: 1
    max_grip_force_n: 70.0
    max_payload_kg: 3.0
    workspace_radius_m: 0.855

capabilities:
  locomotion: ["none"]
  can_lift_kg: 3.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  # Two RGB cameras are declared below (`top` = LIBERO agentview, `wrist` =
  # eye_in_hand), so the robot has vision — this must be true to match it (was
  # erroneously false despite the sensors, which dropped vision-gated rSkills /
  # reasoner playbooks like find-object / verify-outcome on a Franka deploy).
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
  supported_vla_embodiments: ["franka_panda"]
  embodiment_tags:
    - "franka_panda"
    - "franka"
    - "panda"
    # `libero` mirrors the LIBERO benchmark's canonical Franka-Panda
    # embodiment so smolvla-libero / pi05-libero-int8 / xvla-libero rSkills
    # accept this manifest under `openral sim run`. Per the robot/sim split
    # convention: physical-only invariants stay; sim-canonical tags / sensors map 1:1 to a known
    # benchmark configuration on the same physical arm.
    - "libero"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  max_force_n: 100.0
  max_torque_nm: 87.0
  deadman_required: true
  # provisional: former schema default, not measured on this rig — see issue #303
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose — the runner's former defaults,
  # declared here so they are visible; provisional until run on this rig.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # panda_gripper is typed prismatic but carries the normalised [0, 1] jaw
  # fraction, not metres. provisional, not measured on this rig: 0.1/s is its
  # declared velocity_limit (the runner caps at it anyway) and 0.05 is the
  # former tolerance, 5 % of the range.
  starting_pose_max_joint_speed_m_s: 0.1
  starting_pose_tolerance_m: 0.05
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). Unmeasured on this rig; 0.2 s is the
  # real HAL's own former constructor default (franka_panda_real.py). OpenArm's 0.1 s
  # was measured on its own 750 Hz broadcaster and does not transfer.
  # provisional — re-measure with
  # tools/joint_state_staleness_probe.py --robot <this manifest>.
  joint_state_staleness_limit_s: 0.2

# Two RGB streams mirroring LIBERO's `agentview`/`eye_in_hand` (renamed to
# `image`/`image2` by the stored SmolVLA preprocessor, surfaced as `top`/`wrist`
# by the openral_sim LIBERO scene adapter). Declared so the rSkill compat check
# on `openral sim run --config <libero>.yaml` matches
# `observation.images.camera{1,2}` (checkpoint-facing, frozen per checkpoint)
# against a real SensorSpec — same pattern as aloha_bimanual's `top`.
# Drift-guard intentionally does not assert sensors against the HAL constant
# (sim-side sensor wiring is owned by the eval adapter).
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 20.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "sim"
    model: "libero_agentview"
  - name: "wrist"
    modality: "rgb"
    frame_id: "panda_hand"
    rate_hz: 20.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    vendor: "sim"
    model: "libero_eye_in_hand"
  # Third RGB view used by 3-camera benchmarks (e.g. VLABench's
  # image/second_image/wrist_image). LIBERO scenes declare only camera1/2, so
  # this stream is inert there; VLABench's backend populates it as camera3.
  - name: "front"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 20.0
    intrinsics:
      width: 256
      height: 256
      fx: 256.0
      fy: 256.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera3"
    vendor: "sim"
    model: "vlabench_front"

# Franka FCI / libfranka is closed-but-permissive (vendor-licensed binaries,
# free for research and commercial). franka_ros2 is Apache-2.0. Per
# CLAUDE.md §7.4 the manifest therefore declares closed_with_api, and
# `hal.real` points to the real-hardware HAL adapter (issue #56).
#
# This YAML mirrors `FRANKA_PANDA_REAL_DESCRIPTION` in
# python/hal/src/openral_hal/franka_panda_real.py (drift guarded by
# tests/unit/test_robot_manifests_match_hal_constants.py). The sim
# baseline `FRANKA_PANDA_DESCRIPTION` in franka_panda.py keeps
# sdk_kind: open / hal.sim: openral_hal.franka_panda:FrankaPandaHAL
# and is constructed directly by the eval layer for MuJoCo runs.
sdk_kind: "closed_with_api"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# Control rate: the skill runner ticks at it (`rate_hz` ROS param 0 = read
# this), the dataset recorder stamps it as fps, and the real HAL sets every
# trajectory point's time_from_start = horizon / control_freq_hz (issue #303).
# A ros2_control HAL refuses to build without it.
# `dim` / `representation` are deliberately not declared: this repo commits no
# policy action contract for this robot, and the recorder takes the width from
# the action itself. Only the control rate is a known quantity.
# provisional: the runner's former 30 Hz default, not measured on this rig. A
# skill trained at another rate declares action_contract.control_freq_hz and
# the runner refuses the mismatch.
action_spec:
  control_freq_hz: 30.0

hal:
  # null → build_hal derives MujocoArmHAL.from_description(this manifest)
  # from the `sim:` block below; no per-robot Python class is involved.
  sim: null
  real: "openral_hal.franka_panda_real:FrankaPandaRealHAL"

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``
# for the sim baseline.  Source: ``franka_emika_panda/panda.xml`` in
# mujoco_menagerie.  Default 1:1 joint→qpos/actuator mapping applies; the
# gripper has two prismatic finger qpos (7, 8) and an actuator at index 7
# whose ``ctrlrange`` is the Panda gripper finger force command (0..255).

sim:
  grippers:
    - joint: "panda_gripper"
      ctrl_range: [0.0, 255.0]
      qpos_addrs: [7, 8]
      qpos_scale: 0.08  # 2 * 0.04 m max finger extent
      read_mode: "sum_over_scale"

onboard_compute:
  driver_license: "Apache-2.0"               # franka_ros2 ROS 2 wrapper
  driver_runtime_license: "Vendor-permissive (libfranka, FCI binaries)"
  driver_repo: "https://github.com/frankarobotics/franka_ros2"
  controller_name: "franka_arm_controller"
  command_topic: "/franka_arm_controller/joint_trajectory"
  joint_state_topic: "/joint_states"
  error_recovery_topic: "/error_recovery/goal"

# Rigid, zero-DoF links of the collision tree. NOT `joints` — that list is
# consumed unfiltered as the action-vector width, the sim qpos map, the
# reasoner's state-contract filter and the runner's joint permutation, so a
# zero-DoF entry there would corrupt all four.
#
# The hand is bolted to the flange through two fixed URDF joints and an
# intermediate `panda_link8` this manifest does not model, so the transform
# below is their composition:
#   panda_joint8      panda_link7 -> panda_link8  xyz "0 0 0.107"  rpy "0 0 0"
#   panda_hand_joint  panda_link8 -> panda_hand   xyz "0 0 0"      rpy "0 0 -0.7853981633974483"
# Source: robot_descriptions `panda_description` panda.urdf L213-222.
# Cross-checked against mujoco_menagerie franka_emika_panda/panda.xml L210,
# `<body name="hand" pos="0 0 0.107" quat="0.9238795 0 0 -0.3826834">` — that
# quaternion is exactly Rz(-pi/4). Both sources agree.
fixed_attachments:
  - name: "panda_hand_joint"
    parent_link: "panda_link7"
    child_link: "panda_hand"
    origin_xyz: [0, 0, 0.107]
    origin_rpy: [0, 0, -0.7853981633974483]


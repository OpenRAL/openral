# RobotDescription — Unitree G1 humanoid (physical embodiment, sim baseline).
#
# Mirrors `G1_DESCRIPTION` in python/hal/src/openral_hal/g1.py (drift guarded
# by tests/unit/test_robot_manifests_match_hal_constants.py). Joint limits
# come from the upstream Unitree G1 URDF / mujoco_menagerie.
#
# `G1MujocoHAL` is the only execution path today; real-HW HAL over
# `unitree_sdk2` is the M2 milestone (CLAUDE.md §6.2), needs a C++ S0
# cerebellar controller first. Without S0 balance the digital twin is a
# contract validator only (falls over under gravity) — tests/sim/test_g1_hal_mujoco.py
# runs with gravity_enabled=False for that reason.
#
# 29 actuated joints: legs 6+6 (hip_pitch/roll/yaw, knee, ankle_pitch/roll),
# waist 3 (yaw, roll, pitch), arms 7+7 (shoulder_pitch/roll/yaw, elbow,
# wrist_roll/pitch/yaw). Floating-base qpos[0..6] is implicit world state, NOT
# enumerated — HAL contract surface is the 29 actuated joints only.

name: "g1"
embodiment_kind: "humanoid"
base_frame: "pelvis"

# robot_state_publisher wiring. The g1 URDF has a ``world →
# pelvis`` virtual root; ``pelvis`` matches our base_frame so no static
# transform is needed (the ``world`` link is a floating-base anchor RSP
# treats as the implicit /tf root).
# Unified asset block (URDF / MJCF).

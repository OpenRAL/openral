# No end-effector in this menagerie variant — wrist endpoints are
# bare.  A future `g1_with_hands` revision would add Inspire / Dex-3
# entries here.
end_effectors: []

# Forward egocentric head camera (ADR-0087).  The menagerie MJCF ships no
# <camera>, so the generic HAL camera rig splices this onto `torso_link` at
# head height, looking forward. `vla_feature_key` matches the InternVLA-N1
# VLN rSkill's `sensors_required` (`observation.images.head`).
sensors:
  - name: "head"
    modality: "rgb"
    frame_id: "head_camera"
    parent_frame: "torso_link"
    rate_hz: 15.0
    intrinsics:
      width: 640
      height: 480
      fx: 343.0
      fy: 343.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.head"
    sim_placement:
      parent_body: "torso_link"
      pos: [0.06, 0.0, 0.40]
      target: [1.06, 0.0, 0.33]

capabilities:
  locomotion: ["bipedal"]
  can_lift_kg: 3.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  # body_twist rides the ADR-0087 kinematic-glide base (sim-only); a real
  # gait is the M2 S0 cerebellum.
  supported_control_modes:
    - "joint_position"
    - "body_twist"
  supported_vla_embodiments:
    - "g1"
    - "humanoid_everyday_g1"
  # `mobile_base` is the canonical class tag BODY_TWIST nav skills match on
  # (InternVLA-N1 VLN, nav2-navigate-to-pose).
  embodiment_tags:
    - "g1"
    - "unitree_g1"
    - "humanoid"
    - "mobile_base"

safety:
  max_ee_speed_m_s: 1.5
  max_joint_speed_factor: 0.5
  max_force_n: 100.0
  max_torque_nm: 88.0
  deadman_required: true

# `sdk_kind: open` because the menagerie MJCF + the `mujoco` Python
# package are both Apache-2.0; the sim HAL needs no closed driver.
# A future `G1RealHAL` over `unitree_sdk2` (BSD-3, closed-with-api
# per CLAUDE.md §7.4) will derive its `RobotDescription` from this
# sim baseline via `make_real_description` and flip the sdk_kind (the
# `hal` block is shared); that's tracked under the M2 milestone (CLAUDE.md §6.2).
sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# Sim-only → real: null until the M2 C++ S0 cerebellum (CLAUDE.md §6.2).
hal:
  sim: "openral_hal.g1:G1MujocoHAL"
  real: null

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# Source: ``unitree_g1/g1.xml`` in mujoco_menagerie.  The G1 MJCF has a
# 6-DoF free joint before the 29 actuated joints, so ``floating_base``
# offsets qpos by 7 (xyz + quat) and qvel by 6 (linear + angular).
# Default 1:1 mapping (with offsets) applies.
sim:
  floating_base: true


# Galaxea A1 real-hardware manifest.
#
# Kinematic limits and link names are transcribed from the official A1 SDK
# A1_URDF_0607_0028.urdf. The SDK itself remains operator-provided and is not
# redistributed by OpenRAL. The HAL remains intentionally joint/gripper-space;
# the LingBot rSkill lowers its EEF output before the safety boundary. Lowered
# collision geometry follows after the vendor confirms a redistributable asset
# source.
name: galaxea_a1
embodiment_kind: manipulator
base_frame: base_link

# That same URDF, which Galaxea publishes without a license in
# userguide-galaxea/robot_descriptions: fetched at a pinned commit with per-file
# SHA-256 on first use, never vendored (openral_hal._galaxea_a1_assets).
# `mjcf` is the MuJoCo twin derived from it (ensure_a1_mjcf): the vendor's
# 0-30 mm finger slides made prismatic, position actuators added (#740).
assets:
  urdf:
    ref: "galaxea:a1"
  mjcf: "galaxea:a1"
  srdf: "file:galaxea_a1.srdf"

# `sim_joint_name` is the joint's name in the twin's MJCF (the same as the URDF's).
joints:
  - name: arm_joint1
    origin_xyz: [-0.0011147, 0, 0.0892]
    origin_rpy: [0, 0, -3.1415853]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: base_link
    child_link: arm_seg1
    position_limits: [-2.8798, 2.8798]
    velocity_limit: 20.944
    effort_limit: 40.0
    actuator_kind: bldc
    sim_joint_name: arm_joint1
  - name: arm_joint2
    origin_xyz: [0, -4e-05, 0.0615]
    origin_rpy: [1.5708, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: arm_seg1
    child_link: arm_seg2
    position_limits: [0.0, 3.1415]
    velocity_limit: 20.944
    effort_limit: 40.0
    actuator_kind: bldc
    sim_joint_name: arm_joint2
  - name: arm_joint3
    origin_xyz: [0.34928, 0.02, 0]
    origin_rpy: [0, 0, 1.5708]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: arm_seg2
    child_link: arm_seg3
    position_limits: [-3.3161, 0.0]
    velocity_limit: 7.5398
    effort_limit: 27.0
    actuator_kind: bldc
    sim_joint_name: arm_joint3
  - name: arm_joint4
    origin_xyz: [0.07, -0.00395, -4e-05]
    origin_rpy: [1.5707927, 1.5707927, 3.1415927]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: arm_seg3
    child_link: arm_seg4
    position_limits: [-2.8798, 2.8798]
    velocity_limit: 25.133
    effort_limit: 7.0
    actuator_kind: bldc
    sim_joint_name: arm_joint4
  - name: arm_joint5
    origin_xyz: [0, 0, 0.2776]
    origin_rpy: [-1.5708, 0, -3.1415853]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: arm_seg4
    child_link: arm_seg5
    position_limits: [-1.6581, 1.6581]
    velocity_limit: 25.133
    effort_limit: 7.0
    actuator_kind: bldc
    sim_joint_name: arm_joint5
  - name: arm_joint6
    origin_xyz: [0, -0.1575, -0.00023266]
    origin_rpy: [1.5708, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: revolute
    parent_link: arm_seg5
    child_link: arm_seg6
    position_limits: [-2.8798, 2.8798]
    velocity_limit: 25.133
    effort_limit: 7.0
    actuator_kind: bldc
    sim_joint_name: arm_joint6

end_effectors:
  - name: gripper
    command_convention: "normalized_open_unit"
    kind: parallel_gripper
    n_dof: 1

sensors:
  - name: front
    modality: rgb
    frame_id: a1_front_camera
    rate_hz: 30.0
    encoding: rgb8
    intrinsics:
      width: 480
      height: 480
      fx: 387.67059326171875
      fy: 386.86669921875
      cx: 220.1776123046875
      cy: 250.0211944580078
      distortion_model: plumb_bob
      distortion_coeffs: [-0.05492031201720238, 0.06242402642965317, -0.0008095245575532317, 0.00015016942052170634, -0.020708303898572922]
    vla_feature_key: observation.images.front
    vendor: Intel
    model: RealSense D455
    metadata:
      output_width: 480
      output_height: 480
      crop: "x=103,y=0,width=480,height=480"
    # MuJoCo twin only (deploy sim): a world-fixed third-person view of the
    # workspace in front of the arm. The real D455 pose is not published; this is
    # a sim choice, not its extrinsic.
    sim_placement:
      pos: [0.9, 0.0, 0.55]
      target: [0.3, 0.0, 0.1]
    # Real-hardware binding: reads the A1 Runtime's public paired-frame bridge; it never opens
    # the RealSense itself (`just camera-web` stays its sole owner).
    deploy_binding:
      backend: galaxea_a1_camera_bridge
      backend_params:
        camera: front
      max_age_ms: 500
  - name: wrist
    modality: rgb
    frame_id: a1_wrist_camera
    parent_frame: arm_seg6
    rate_hz: 30.0
    encoding: rgb8
    intrinsics:
      width: 640
      height: 480
      fx: 392.2943115234375
      fy: 391.7977294921875
      cx: 320.1477355957031
      cy: 241.63327026367188
      distortion_model: plumb_bob
      distortion_coeffs: [-0.05426114425063133, 0.05990355461835861, 0.0004118939395993948, 0.000653077382594347, -0.019962556660175323]
    vla_feature_key: observation.images.wrist
    vendor: Intel
    model: RealSense D405
    metadata:
      output_width: 640
      output_height: 480
    # MuJoCo twin only: on `arm_seg6` (the fingers extend along its +z, 0-79 mm,
    # opening along y), offset along x clear of the fingers and looking past them.
    # The real D405 mount offset is not published; a sim choice.
    sim_placement:
      parent_body: arm_seg6
      pos: [0.06, 0.0, 0.0]
      target: [0.0, 0.0, 0.2]
    # Real-hardware binding: reads the A1 Runtime's public paired-frame bridge; it never opens
    # the RealSense itself (`just camera-web` stays its sole owner).
    deploy_binding:
      backend: galaxea_a1_camera_bridge
      backend_params:
        camera: wrist
      max_age_ms: 500

capabilities:
  can_lift_kg: 5.0
  has_vision: true
  supported_control_modes: [joint_position, gripper_position]
  embodiment_tags: [galaxea_a1]

safety:
  max_ee_speed_m_s: 0.25
  max_joint_speed_factor: 0.05
  max_force_n: 40.0
  max_torque_nm: 40.0
  deadman_required: true
  # provisional: former schema default, not measured on this rig — see issue #303
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose — the runner's former defaults,
  # declared here so they are visible; provisional until run on this rig.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). provisional: the runner's former launch constant (the HAL's own
  # state_timeout_s is separate),
  # not measured on this rig — measure with
  # tools/joint_state_staleness_probe.py --robot <this manifest>.
  joint_state_staleness_limit_s: 0.5

sdk_kind: closed_with_api
# Control rate: the skill runner ticks at it (`rate_hz` ROS param 0 = read
# this), the dataset recorder stamps it as fps, and a real HAL cannot load
# without it (issue #303).
# provisional: the runner's former 30 Hz default, not measured on this rig
# `dim` / `representation` are deliberately not declared: this repo commits no
# policy action contract for this robot, and the recorder takes the width from
# the action itself. Only the control rate is a known quantity.
action_spec:
  control_freq_hz: 30.0

hal:
  sim: null
  real: openral_hal.galaxea_a1:GalaxeaA1HAL
  parameters:
    defaults:
      host: 127.0.0.1
      port: 46011
      state_timeout_s: 0.5
      status_timeout_s: 1.0
      # Feedback may sit just beyond a nominal URDF endpoint because of encoder
      # zero/quantization. Commands remain strictly inside the URDF limits.
      feedback_limit_tolerance_rad: 0.01
      initial_alignment_tolerance_rad: 0.05
      # The official tracker starts from a compiled task.info pose. Its output
      # remains staged until it converges to the measured initial hold.
      tracker_alignment_timeout_s: 5.0
      # This remains far below the A1 Runtime's independently validated 1.70
      # rad IK-solution bound, while allowing the official tracker to cross its
      # observed 0.03..0.038 rad steady-state residual.
      max_target_step_rad: 0.08
      command_lease_s: 0.5
      # The vendor documents bit 6 as ECU->ACU timeout. It is observed while
      # idle and is the only accepted arm bit. The gripper additionally ignores
      # bit 3 (position jump) for compatibility with the physical G2 gripper.
      idle_timeout_error_mask: 64
      gripper_ignored_error_mask: 8
      gripper_stroke_min_mm: 0.0
      gripper_stroke_max_mm: 104.0

# MuJoCo twin (`openral deploy sim`, scenes/deploy/galaxea_a1_twin.yaml) on the
# derived `galaxea:a1` MJCF. qpos 0-5 / actuators 0-5 are the arm in manifest
# order; actuator 6 (`gripper`) drives `gripper1_axis` (qpos 6, 0-0.03 m, +q
# opens) and an MJCF equality couples `gripper2_axis` (qpos 7) to it. The gripper
# is an end effector, not a manifest joint, exactly as on the real HAL: the twin
# publishes the six arm joints, takes the gripper as GRIPPER_POSITION
# (Action.gripper[0], normalised [0, 1], 1 = open, refused outside it) and
# reports it in health as `gripper_position_normalized`. The twin starts at
# qpos 0 (folded, fingers closed — inside every joint range).
sim:
  grippers:
    - end_effector: gripper
      ctrl_range: [0.0, 0.03]
      qpos_addrs: [6, 7]
      qpos_scale: 0.06
      read_mode: sum_over_scale
      write_mode: normalised
      actuator_index: 6

onboard_compute:
  driver_repo: https://github.com/userguide-galaxea/A1_SDK
  driver_runtime: ROS 1 Noetic sidecar
  command_topic: /arm_joint_target_position
  joint_state_topic: /joint_states_host
  motor_status_topic: /arm_status_host
  gripper_command_topic: /gripper_position_control_host
  gripper_feedback_topic: /gripper_stroke_host

schema_version: "0.2"

# The two fingers, as the vendor URDF has them: `fixed` joints on arm_seg6 (at the
# closed pose, q = 0) that declare a 0-0.03 m slide the twin's MJCF actuates. The
# kernel poses them at this closed pose, which nothing reports moving from;
# `sweep_xyz` (the URDF's own axis z and 0.03 m limit) makes the lowered geometry
# cover each finger's whole 30 mm stroke instead.
fixed_attachments:
  - name: "gripper1_axis"
    parent_link: "arm_seg6"
    child_link: "gripper1"
    origin_xyz: [0.014, -0.011914, 0.003125]
    origin_rpy: [-1.570793, -1.570793, -9.3e-05]
    sweep_xyz: [0.0, 0.0, 0.03]
  - name: "gripper2_axis"
    parent_link: "arm_seg6"
    child_link: "gripper2"
    origin_xyz: [-0.014, 0.011914, 0.003125]
    origin_rpy: [1.570793, -1.570793, -9.3e-05]
    sweep_xyz: [0.0, 0.0, 0.03]


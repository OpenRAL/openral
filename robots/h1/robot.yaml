# RobotDescription — Unitree H1 humanoid (physical embodiment, sim baseline).
#
# Mirrors `H1_DESCRIPTION` in python/hal/src/openral_hal/h1.py (drift guarded
# by tests/unit/test_robot_manifests_match_hal_constants.py). Joint limits +
# effort caps come verbatim from the upstream Unitree H1 URDF / mujoco_menagerie.
#
# `H1MujocoHAL` is the only execution path today; real-HW HAL over
# `unitree_sdk2` is the M2 milestone (CLAUDE.md §6.2), needs a C++ S0
# cerebellar controller first. Without S0 balance the digital twin is a
# contract validator only (falls over under gravity) — tests/sim/test_h1_hal_mujoco.py
# runs with gravity_enabled=False for that reason.
#
# 19 actuated joints (coarser-DoF than G1): legs 5+5 (hip_yaw/roll/pitch, knee,
# ankle), torso 1 (yaw only, no roll/pitch), arms 4+4 (shoulder_pitch/roll/yaw,
# elbow). Floating-base qpos[0..6] is implicit world state, NOT enumerated —
# HAL contract surface is the 19 actuated joints only. Joint names follow the
# menagerie's H1 convention (no `_joint` suffix), distinct from G1's.

name: "h1"
embodiment_kind: "humanoid"
base_frame: "pelvis"

# robot_state_publisher wiring. URDF root link is ``pelvis``,
# matching base_frame; no static transform needed.
# Unified asset block (URDF / MJCF). The URDF is a vendored,
# joint-name-patched copy of rd:h1_description: upstream suffixes every joint
# with '_joint' (torso_joint); we strip the suffix so robot_state_publisher's
# /tf joint names match the HAL/menagerie names (torso, left_knee, ...). Only
# joint names changed — links/meshes (package:// paths) verbatim.
assets:
  urdf:
    ref: "file:h1.urdf"
  mjcf: "rd:h1_mj_description"


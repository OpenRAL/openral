# The official assets ship bare wrists: `left_hand_link` / `right_hand_link`
# are fixed frames on the wrist-yaw link, not actuated hands.
end_effectors: []

# The URDF's fixed hand frames carry collision meshes (bare wrist caps), so the
# kernel models them as static links on the wrist-yaw link. Origins verbatim
# from H2.urdf @ 41dec58c (`left_hand_joint` / `right_hand_joint`).
fixed_attachments:
  - name: "left_hand_joint"
    parent_link: "left_wrist_yaw_link"
    child_link: "left_hand_link"
    origin_xyz: [0.05771524, 0, -0.00014865]
    origin_rpy: [0, 0, 0]
  - name: "right_hand_joint"
    parent_link: "right_wrist_yaw_link"
    child_link: "right_hand_link"
    origin_xyz: [0.05824125, 0, -0.00017221]
    origin_rpy: [0, 0, 0]

# No sensors declared. The assets prove only frames — URDF fixed links
# `camera` (on head_yaw_link), `imu_in_torso`, `imu_in_pelvis`; MJCF sites
# `imu` (pelvis) and `secondary_imu` (torso_link). The camera / LiDAR model,
# intrinsics and rates are unverified (see robots/h2/README.md), so nothing is
# declared until a datasheet or a calibrated unit pins them.
sensors: []

capabilities:
  locomotion: ["bipedal"]
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: false
  has_lidar: false
  has_audio: false
  bimanual: true
  # body_twist rides the ADR-0087 kinematic-glide base (sim-only); no public
  # H2 walking/WBC checkpoint exists, so a real gait is the future S0 work.
  supported_control_modes:
    - "joint_position"
    - "body_twist"
  # `mobile_base` is the canonical class tag BODY_TWIST nav skills match on.
  embodiment_tags:
    - "h2"
    - "unitree_h2"
    - "humanoid"
    - "mobile_base"

safety:
  # Deliberately tighter than G1/H1: a ~70 kg, 1.8 m humanoid with 360 N·m hip
  # and knee actuators and no balance controller yet. Joint velocity limits
  # above are the URDF hardware peaks; the 0.3 factor derates them.
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.3
  max_force_n: 150.0
  max_torque_nm: 360.0   # H2 hip / knee peak (URDF effort)
  deadman_required: true
  # BODY_TWIST kernel bounds. The glide integrates any twist uncapped, so these
  # come from the trained command box of the only H2 velocity task published,
  # unitree_rl_mjlab @ 1425b15f src/tasks/velocity/config/h2/env_cfgs.py play
  # ranges (vx -0.5..1.0, vy ±0.5, wz ±0.5): the kernel bounds ‖(vx, vy)‖, so
  # 0.5 is the largest disk inside the vy range.
  max_base_linear_speed_m_s: 0.5
  max_base_angular_speed_rad_s: 0.5

# `sdk_kind: open`: the sim HAL needs no closed driver (BSD-3 Unitree assets +
# Apache-2.0 `mujoco`). A future real HAL over `unitree_sdk2` (BSD-3) will
# derive its RobotDescription from this baseline via `make_real_description`.
sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
hal:
  sim: "openral_hal.h2:H2MujocoHAL"
  # Real-HW HAL (unitree_sdk2 low-level, rt/lowcmd + rt/lowstate) and the C++
  # S0 whole-body controller wiring are a later phase, owned separately.
  real: null

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# The H2 MJCF has a 6-DoF free joint (`floating_base_joint`, qpos 0-6 / qvel
# 0-5) before the 31 hinges. Its TREE order is legs, waist, HEAD, left arm,
# right arm — so the default `7 + i` / `6 + i` maps (description order) would
# send the arm targets to the head. The explicit maps below follow the tree;
# the actuator order is SDK order, so the default 1:1 actuator map holds.
# Guarded against the MJCF by tests/sim/test_h2_hal_mujoco.py.
sim:
  floating_base: true
  joint_qpos_addr:
    left_hip_pitch_joint: 7
    left_hip_roll_joint: 8
    left_hip_yaw_joint: 9

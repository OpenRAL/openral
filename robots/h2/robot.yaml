# The official assets ship bare wrists: `left_hand_link` / `right_hand_link`
# are fixed frames on the wrist-yaw link, not actuated hands.
end_effectors: []

# The URDF's fixed hand frames carry collision meshes (bare wrist caps), so the
# kernel models them as static links on the wrist-yaw link. Origins verbatim
# from H2.urdf @ 41dec58c (`left_hand_joint` / `right_hand_joint`).
fixed_attachments:
  - name: "left_hand_joint"
    parent_link: "left_wrist_yaw_link"
    child_link: "left_hand_link"
    origin_xyz: [0.05771524, 0, -0.00014865]
    origin_rpy: [0, 0, 0]
  - name: "right_hand_joint"
    parent_link: "right_wrist_yaw_link"
    child_link: "right_hand_link"
    origin_xyz: [0.05824125, 0, -0.00017221]
    origin_rpy: [0, 0, 0]

# No sensors declared. The assets prove only frames — URDF fixed links
# `camera` (on head_yaw_link), `imu_in_torso`, `imu_in_pelvis`; MJCF sites
# `imu` (pelvis) and `secondary_imu` (torso_link). The camera / LiDAR model,
# intrinsics and rates are unverified (see robots/h2/README.md), so nothing is
# declared until a datasheet or a calibrated unit pins them.
sensors: []

capabilities:
  locomotion: ["bipedal"]
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: false
  has_lidar: false
  has_audio: false
  bimanual: true
  # body_twist: the ADR-0087 kinematic-glide base in sim, or the sim-only AGILE
  # S0's velocity command (`s0_controller: agile_velocity`); on real hardware the
  # S0 AGILE velocity policy's `command/body/velocity` input.
  supported_control_modes:
    - "joint_position"
    - "body_twist"
  # `mobile_base` is the canonical class tag BODY_TWIST nav skills match on.
  embodiment_tags:
    - "h2"
    - "unitree_h2"
    - "humanoid"
    - "mobile_base"

safety:
  # Deliberately tighter than G1/H1: a ~70 kg, 1.8 m humanoid with 360 N·m hip
  # and knee actuators and no balance controller yet. Joint velocity limits
  # above are the URDF hardware peaks; the 0.3 factor derates them.
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.3
  max_force_n: 150.0
  max_torque_nm: 360.0   # H2 hip / knee peak (URDF effort)
  deadman_required: true
  # BODY_TWIST kernel bounds. The glide integrates any twist uncapped, so these
  # come from the trained command box of the only H2 velocity task published,
  # unitree_rl_mjlab @ 1425b15f src/tasks/velocity/config/h2/env_cfgs.py play
  # ranges (vx -0.5..1.0, vy ±0.5, wz ±0.5): the kernel bounds ‖(vx, vy)‖, so
  # 0.5 is the largest disk inside the vy range.
  max_base_linear_speed_m_s: 0.5
  max_base_angular_speed_rad_s: 0.5
  # provisional: the G1's provisional real-path values (themselves former
  # schema defaults, issue #303), not measured on an H2. Required because the
  # manifest declares a real HAL.
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose; provisional until run on an H2.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Equal to unitree_hg_ros2_control's own state-freshness bound (FreshStateTracker
  # kMaximumStateAge = 500 ms, isaac_ros_robots @ 520aa94f) and to H2MujocoHAL's
  # default. Not yet measured on an H2 — re-derive with
  # tools/joint_state_staleness_probe.py on the first real bring-up.
  joint_state_staleness_limit_s: 0.5

# `closed_with_api`, mirroring the real HAL's description (the G1 pattern: the
# shared manifest carries the real posture). The sim path is fully open (BSD-3
# Unitree assets + Apache-2.0 `mujoco`); the real path runs NVIDIA's Apache-2.0
# ros2_control packages, but `unitree_hg_ros2_control` links `unitree_sdk2`,
# whose core ships only as a prebuilt static library (CLAUDE.md §1.9).
sdk_kind: "closed_with_api"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
#
# hal.real is set, but the H2 is NOT cleared for hardware. Issue #513's safety
# blockers (OpenRAL/management hazard-log Entry 074, Safety-WG review
# safety/reviews/2026-11-07-unitree-g1-h2-real-hw.md, gate item 5): the H2
# collision geometry and the wrist-pitch placement are addressed in the PR that
# set this; still open, and owned by the first bring-up, are
#   * freeze_controller holds the measured pose, it does not balance — the robot
#     stays on a gantry until the e-stop behaviour is characterised;
#   * the IMU frame (`imu_in_pelvis` in config/h2/controller_manager.yaml) must
#     be checked on hardware;
#   * the S0 loop runs at 200 Hz (policy 50 Hz), below CLAUDE.md §3's 500-1000 Hz;
#   * the AGILE checkpoint was trained on the H2 Plus;
# and Safety-WG review of the H2 allowed-collision list and of this bring-up.
hal:
  sim: "openral_hal.h2:H2MujocoHAL"
  real: "openral_hal.unitree_real:UnitreeHgRealHAL"
  # NVIDIA ros2_control graph `deploy run` includes beside the real HAL: the
  # unitree_hg hardware interface (`robot_variant: h2`) + safety / S0 inference /
  # upper-body forward controllers at 200 Hz, all C++ (§1.5). Under `deploy run`
  # the launch reads `robot_model` and `s0_policy` below from this manifest; the
  # NIC comes from OPENRAL_UNITREE_NETWORK_INTERFACE.
  real_bringup: "openral_hal_unitree:real_bringup.launch.py"
  parameters:
    defaults:
      # Which hg-family model's controller/joint-split defaults the real HAL
      # uses. build_hal drops it for the sim HAL, which takes no such kwarg.
      robot_model: "h2"
      # The S0 whole-body policy whose joint split the real HAL enforces — the
      # file packages/openral_hal_unitree/config/h2/policies/<this>.yaml. NVIDIA
      # WBC-AGILE (`nvidia/agile_wbc_unitree_h2`): legs + waist roll/pitch.
      s0_policy: "agile_velocity"

# The one place this robot's control rate lives: the runner ticks at it, the
# recorder stamps it as fps, and the real HAL spaces every upper-body trajectory
# step by it. 50 Hz = the AGILE export's `pipeline.configs.frequency` and the
# real InferenceController's rate (200 Hz manager / decimation 4); the twin takes
# one control period (20 physics steps of the 1 ms MJCF timestep) per action.
action_spec:
  control_freq_hz: 50.0

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# The H2 MJCF has a 6-DoF free joint (`floating_base_joint`, qpos 0-6 / qvel
# 0-5) before the 31 hinges. Its TREE order is legs, waist, HEAD, left arm,
# right arm — so the default `7 + i` / `6 + i` maps (description order) would
# send the arm targets to the head. The explicit maps below follow the tree;
# the actuator order is SDK order, so the default 1:1 actuator map holds.
# Guarded against the MJCF by tests/sim/test_h2_hal_mujoco.py.

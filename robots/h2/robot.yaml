# RobotDescription — Unitree H2 humanoid (physical embodiment, sim baseline).
#
# Mirrors `H2_DESCRIPTION` in python/hal/src/openral_hal/h2.py (drift guarded
# by tests/unit/test_robot_manifests_match_hal_constants.py).
#
# Sources (official Unitree assets, BSD-3-Clause; the H2 is in neither
# mujoco_menagerie nor robot_descriptions):
#   URDF  unitreerobotics/unitree_ros   @ 41dec58c7a3ccb3050243ef16ac2ca74b2b0f9ca
#         robots/h2_description/H2.urdf  — joint origins / axes / limits below
#         are verbatim from this file.
#   MJCF  unitreerobotics/unitree_mujoco @ 1eb6642e3f3fdfb7fb13a9794fd6a2dd93ea0e7d
#         unitree_robots/h2/h2_mujoco.xml — `motor` (torque) actuators in SDK
#         motor order.
# Both are fetched at those pins with per-file SHA-256 (fail-closed) by
# openral_hal._unitree_h2_assets via the `unitree:h2` asset ref.
#
# `H2MujocoHAL` is the only execution path today: a gravity-on twin with the
# free joint pinned upright (ADR-0087 kinematic glide) and a software PD loop
# over the torque actuators. Real-HW HAL over `unitree_sdk2` + the C++ S0
# controller are future work (`hal.real: null` below).
#
# 31 actuated joints in unitree_sdk2 motor-index order (H2_NUM_MOTOR = 31,
# example/h2/low_level/h2_ankle_swing_example.cpp @ 8e1b9275): legs 6+6
# (hip_pitch/roll/yaw, knee, ankle_roll, ankle_pitch — roll BEFORE pitch,
# unlike the G1), waist 3 (yaw, roll, pitch), arms 7+7 (shoulder_pitch/roll/
# yaw, elbow, wrist_roll/pitch/yaw), head 2 (pitch, yaw). Floating-base
# qpos[0..6] is implicit world state, NOT enumerated. The ankles and waist
# roll/pitch are parallel linkages on hardware; the assets model them as
# serial joints, matching the SDK's Mode::PR (series pitch/roll) interface.

name: "h2"
embodiment_kind: "humanoid"
base_frame: "pelvis"
# Floor-projected outline of the whole body at the twin's default pose (all
# joints zero — the official MJCF ships no keyframe; legs straight, elbows at
# zero put the forearms horizontal and forward), computed from every visual
# mesh vertex of h2_mujoco.xml @ 1eb6642e posed by mj_forward, in the pelvis
# frame: x ∈ [-0.099, 0.464], y ±0.223, r_max 0.489. Polygon = the bounding
# octagon (axis + 45° half-planes) rounded outward to 1 cm, CCW. Pose-
# dependent: the forearms set the front edge; without arms x ≤ 0.182, y ±0.187.
footprint_radius: 0.50
footprint_polygon: [[0.47, 0.16], [0.40, 0.23], [-0.03, 0.23], [-0.10, 0.16],
                    [-0.10, -0.16], [-0.03, -0.23], [0.40, -0.23], [0.47, -0.16]]


# RobotDescription — MakerMods Metal arm (single arm, sim baseline).
#
# Product: https://www.makermods.ai/metal-arm — an aluminium arm marketed as
# "7-axis": 6 revolute joints (joint1..joint6) plus a parallel-jaw gripper
# whose two prismatic fingers (upstream joint7 / joint8) are coupled
# (`<mimic joint="joint7" multiplier="-1">` on joint8). Damiao motors over CAN
# (MIT mode), no brakes. Upstream driver: ROS 2 Humble, own topics/messages
# (`metal_controller`, `ArmJointPositionControl`), not ros2_control.
#
# Kinematics, limits and meshes come from `metal_description` in
# makermods-robotics/metal-python-ros at the SHA pinned in
# python/hal/src/openral_hal/_makermods_metal_assets.py (METAL_PINNED_SHA).
# That repository ships no LICENSE file, so NOTHING is vendored here: the
# `makermods:metal` asset ref fetches the pinned clone into $OPENRAL_CACHE_DIR
# and derives the URDF (root `base_link`, the upstream `world` link dropped)
# and the MJCF (MuJoCo-compiled from that URDF, with OpenRAL's sim-only
# position actuators and the finger equality) at runtime.
#
# Joint order = MJCF actuator order (joint1..joint6, then the driven finger
# joint8). The MJCF has 8 qpos slots — joint7 (the mimic finger, qpos 6)
# precedes joint8 (qpos 7) — so `sim.joint_qpos_addr` pins the gripper to 7.
#
# Gripper: normalised [0, 1] (0 = closed, 1 = open), the lerobot convention,
# mapped affinely onto joint8's [0, 0.05] m finger travel (0 = fingers
# touching, ~95 mm between finger bodies fully open in the MJCF).
#
# Real hardware: no HAL yet (`hal.real: null`). The arm has no brakes — a
# de-energised arm falls — so a real HAL needs a safety-WG-reviewed stop
# behaviour (hold / damped descent), not a torque cut. See README.md.

name: "makermods_metal"
embodiment_kind: "manipulator"
base_frame: "base_link"

assets:
  urdf:
    ref: "makermods:metal"
  mjcf: "makermods:metal"

joints:
  - name: "joint1"
    sim_joint_name: "joint1"
    origin_xyz: [0.0, 0.0, 0.06675]
    origin_rpy: [0.0, 0.0, 0.0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "base_link"
    child_link: "link1"
    position_limits: [-2.79, 2.79]
    velocity_limit: 5.0
    effort_limit: 30.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "joint2"
    sim_joint_name: "joint2"
    origin_xyz: [0.00075, 0.0, 0.055]
    origin_rpy: [1.5707963267949, 0.0, 0.0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "link1"
    child_link: "link2"
    position_limits: [-3.14, 0.0]
    velocity_limit: 5.0
    effort_limit: 100.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "joint3"
    sim_joint_name: "joint3"
    origin_xyz: [-0.28, 0.0, 0.0]
    origin_rpy: [0.0, 0.0, 0.0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "link2"
    child_link: "link3"
    position_limits: [0.0, 3.14]
    velocity_limit: 5.0
    effort_limit: 30.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "joint4"
    sim_joint_name: "joint4"
    origin_xyz: [0.215, 0.063, 0.0]
    origin_rpy: [0.0, 0.0, 0.0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "link3"
    child_link: "link4"
    position_limits: [-2.145, 1.413]
    velocity_limit: 20.0
    effort_limit: 10.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "joint5"
    sim_joint_name: "joint5"
    origin_xyz: [0.08, 0.052, 0.00025]
    origin_rpy: [1.5707963267949, 0.0, 0.0]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "link4"
    child_link: "link5"
    position_limits: [-1.482, 1.482]
    velocity_limit: 20.0
    effort_limit: 10.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "joint6"
    sim_joint_name: "joint6"
    origin_xyz: [0.0235, 0.0, 0.044]
    origin_rpy: [-3.14159265330655, 0.0, 0.0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "link5"
    child_link: "link6"
    position_limits: [-2.529, 2.529]
    velocity_limit: 20.0
    effort_limit: 10.0
    actuator_kind: "bldc"
    has_torque_sensor: false
  - name: "gripper"
    sim_joint_name: "joint8"
    joint_type: "prismatic"
    parent_link: "gripper_base"
    child_link: "link8"
    axis_xyz: [1, 0, 0]
    position_limits: [0.0, 1.0]
    velocity_limit: 1.0
    effort_limit: 3.0
    actuator_kind: "bldc"
    role: "gripper"
    has_torque_sensor: false

# The gripper is bolted to link6 (upstream fixed joint `gripper_base`).
fixed_attachments:
  - name: "gripper_base"
    parent_link: "link6"
    child_link: "gripper_base"
    origin_xyz: [0.0758, 0.0, 0.0]
    origin_rpy: [1.57079745225378, -1.57079631189374, 1.57079520133601]

end_effectors:
  - name: "gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    # Not published by MakerMods; the URDF finger effort limit (3 N) is the
    # only upstream figure. Payload is the vendor's 3 kg arm rating capped by
    # what a 3 N two-finger friction grasp holds — keep conservative.
    max_grip_force_n: 3.0
    max_payload_kg: 0.3
    # Vendor-quoted reach (makermods.ai/metal-arm): 612.5 mm.
    workspace_radius_m: 0.6125

sensors:
  # Workcell-style overhead camera for sim (the kit's "front camera" on its
  # stand). Placement is a sim choice, not a measured mount.
  - name: "front"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 30.0
    sim_placement:
      pos: [0.75, 0.0, 0.55]
      target: [0.30, 0.0, 0.0]
    intrinsics:
      width: 640
      height: 480
      fx: 480.0
      fy: 480.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.front"
    vendor: "generic_usb"
    model: "makermods_front_camera"
  # Gripper camera (kit part "Camera, x1", mounted on the gripper). Mount pose
  # not published — sim placement only, static transform NOT calibrated.
  - name: "wrist"
    modality: "rgb"
    frame_id: "wrist_camera"
    parent_frame: "gripper_base"
    static_transform_calibrated: false
    rate_hz: 30.0
    sim_placement:
      parent_body: "gripper_base"
      pos: [0.09, 0.0, -0.05]
      target: [0.0, 0.0, 0.20]
      up: [1.0, 0.0, 0.0]
      fovy_deg: 90.0
    intrinsics:
      width: 640
      height: 480
      fx: 480.0
      fy: 480.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.wrist"
    vendor: "generic_usb"
    model: "makermods_gripper_camera"

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.3
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
    - "gripper_position"
  supported_vla_embodiments: ["makermods_metal"]
  embodiment_tags:
    - "makermods_metal"
    - "makermods"

safety:
  workspace_box_min_xyz: [-0.65, -0.65, 0.0]
  workspace_box_max_xyz: [0.65, 0.65, 0.8]
  max_ee_speed_m_s: 0.5
  max_ee_accel_m_s2: 1.0
  max_joint_speed_factor: 0.5
  max_force_n: 30.0
  max_torque_nm: 100.0
  deadman_required: true
  contact_force_threshold_n: 20.0
  self_collision_margin_m: 0.0
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  joint_state_staleness_limit_s: 0.1

sdk_kind: "open"
hal:
  # sim: MujocoArmHAL.from_description from the `sim:` block below.
  sim: null
  real: null

sim:
  joint_qpos_addr:
    joint1: 0
    joint2: 1
    joint3: 2
    joint4: 3
    joint5: 4
    joint6: 5
    gripper: 7          # qpos 6 is the mimic finger joint7 (equality-coupled)
  grippers:
    - joint: "gripper"
      ctrl_range: [0.0, 0.05]
      qpos_addrs: [7]
      qpos_scale: 0.05
      read_mode: "affine_low_high"
      write_mode: "normalised"
  # Joint 2 / 3 rest at a range limit at qpos 0; seeding ctrl from qpos keeps
  # the position actuators holding the initial pose instead of driving to 0.
  seed_ctrl_from_qpos: true

observation_spec:
  state_key: "observation.state"
  state_shape: [7]
  state_representation: "joint_positions"

action_spec:
  dim: 7
  representation: "joint_positions"
  control_freq_hz: 30.0

schema_version: "0.2"

  # sim_placement: target = where that axis meets the plate (z = 0); `up` is
  # the image-up axis (MuJoCo camera y), so the roll survives the look-at.
  static_transform_xyz_rpy: [0.068, -0.001, 0.587, -0.0377, 0.867, -0.0302]
  static_transform_calibrated: false
  rate_hz: 30.0
  sim_placement:
    parent_body: station_base
    pos: [0.068, -0.001, 0.587]
    target: [0.566, -0.016, 0.0]
    up: [0.7626, 0.0147, 0.6467]
    fovy_deg: 74.7
  intrinsics: {width: 640, height: 480, fx: 314.4, fy: 314.4, cx: 321.4, cy: 241.0}
  encoding: rgb8
  vla_feature_key: observation.images.top
  vendor: generic_usb
  model: makermods_top_camera

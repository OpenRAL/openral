  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: true
  supported_control_modes: [joint_position, gripper_position]
  supported_vla_embodiments: [makermods_metal_station]
  embodiment_tags: [makermods_metal_station, makermods, bimanual]
safety:

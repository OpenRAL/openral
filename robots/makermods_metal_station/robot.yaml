# RobotDescription — MakerMods Metal Arm Station (two Metal arms + top camera, sim baseline).
#
# Two `robots/makermods_metal` arms composed side by side on one base plate,
# with a top camera between them looking down onto the shared workspace.
# Joints, links, end effectors and wrist cameras are the single-arm manifest's
# with `left_` / `right_` prefixes; per-arm values must stay in lock-step with
# robots/makermods_metal/robot.yaml (guarded by
# tests/unit/test_makermods_metal_manifests.py).
#
# Assets: `makermods:metal_station` derives a two-arm URDF (root
# `station_base`, arms mounted by fixed `left_mount` / `right_mount` joints)
# and its MJCF from the pinned, unlicensed upstream description — nothing is
# vendored (see the single-arm manifest and
# python/hal/src/openral_hal/_makermods_metal_assets.py).
#
# MEASURED GEOMETRY: MakerMods publishes no base-to-base spacing or top-camera
# mount; both are fitted from the real station's recordings in
# makermods/pen_holder_bi_20260723_161553 (41 episodes; fit 2026-11-07): FK
# arm-mesh silhouettes of both arms vs the top image (40 frames), 1 897
# left-wrist-camera PCB detections and the pen-at-rest line (39 episodes).
# * Arm spacing 0.612 m (+/-0.02): arms at y = +/-0.306 m
#   (`STATION_ARM_SPACING_M` in the asset module). The fitted right base sits
#   at (0.0069, -0.6119) m, yaw +0.9 deg, in the left base frame; the 7 mm and
#   0.9 deg offsets are within the error, so the mounts are symmetric.
# * Top camera (in station_base = the midpoint of the bases): (0.068, -0.001,
#   0.587) m, i.e. on the mast ~7 cm IN FRONT of the base line, pitched 49.7
#   deg down; f = 314.4 px, principal point (321.4, 241.0) at 640x480 (VFOV
#   74.7 deg), no distortion fitted. Realistic error +/-1.5 cm, +/-1 deg,
#   f +/-10 px.
# Mounts stay `static_transform_calibrated: false` (a dataset fit, not a
# measured mount). Update the asset constant, `fixed_attachments` and the
# camera together.
#
# MJCF layout: per arm 8 qpos (joint1..6, mimic finger joint7, driven finger
# joint8) and 7 actuators (joint1..6, joint8) — left first, then right.
#
# Real hardware: no HAL yet. Upstream runs one CAN bus per arm
# (`two_arm_control.yaml`: right arm `can0`, left arm `can1`).


    left_gripper: 7, right_joint1: 8, right_joint2: 9, right_joint3: 10, right_joint4: 11, right_joint5: 12,
    right_joint6: 13, right_gripper: 15}
  actuator_index: {left_joint1: 0, left_joint2: 1, left_joint3: 2, left_joint4: 3, left_joint5: 4, left_joint6: 5,
    left_gripper: 6, right_joint1: 7, right_joint2: 8, right_joint3: 9, right_joint4: 10, right_joint5: 11,
    right_joint6: 12, right_gripper: 13}
  grippers:
  - joint: left_gripper
    ctrl_range: [0.0, 0.05]
    qpos_addrs: [7]
    qpos_scale: 0.05
    read_mode: affine_low_high
    write_mode: normalised
    actuator_index: 6
  - joint: right_gripper
    ctrl_range: [0.0, 0.05]
    qpos_addrs: [15]
    qpos_scale: 0.05
    read_mode: affine_low_high
    write_mode: normalised
    actuator_index: 13
  seed_ctrl_from_qpos: true
observation_spec:

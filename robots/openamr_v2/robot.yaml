    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    command_convention: "raw_joint_rad"
    command_range: [0.0, 0.7854]
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7
  - name: "right_gripper"
    origin_xyz: [-0.00143, 0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    command_convention: "raw_joint_rad"
    command_range: [-0.7854, 0.0]
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0

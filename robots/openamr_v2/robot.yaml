# RobotDescription — OpenAMRobot 2.0 (open-source mobile base + 350 mm DOLD
# lift + two Enactic OpenArm v2.0 arms with pinch grippers). Sim-only for now.
#
# Source: openAMRobot/openamr-upperbody-sw @ 17cf693 (main, 2026-11-02, MIT;
# CAD-derived geometry CERN-OHL-P-2.0). `openamr_v2.urdf` is its
# `combined_robot.xacro` expanded with the defaults (column=dold_v4_350,
# base_plate=bp000, head_pitch=hp30, base_tilt=bt10, arm_package=openarm,
# hardware_profile=mock), then normalised: the <gazebo>/<ros2_control> blocks and
# comments dropped, the two drive wheels made fixed (the base is driven as a
# planar body, not wheel by wheel). The xacro pins openarm_description@14ff67b and
# openamr-platform-sw@131e500f; the meshes resolve through the pinned clones in
# openral_hal.ros_package_overlay (OpenArm meshes are byte-identical at our
# c103041 pin). Regenerate: robots/openamr_v2/README.md.
#
# UPSTREAM IS PRE-RELEASE (rc.1 2026-11-20, v2.0.0 2026-12-18; nothing is
# physically accepted yet). Upstream marks these as placeholders: the wrist
# camera poses, the 0.400 m wheel track, the lift's velocity/effort (DOLD
# catalogue, "provisional") and every acceleration limit. Re-sync at v2.0.0.
#
# The MuJoCo twin (`openarm:openamr_v2`) is built from this URDF at runtime by
# openral_hal._openamr_v2_assets; its actuators follow `joints` order below.

name: "openamr_v2"
embodiment_kind: "mobile_manipulator"
# REP-105: base_footprint is the URDF root, on the floor under the drive-axle
# midpoint; MobileBaseBridge publishes odom -> base_footprint.
base_frame: "base_footprint"
# Nav2 mobile-base properties. The chassis is 0.80 x 0.43 m around base_footprint
# (casters at x ±0.275, y ±0.215; front sensors at x 0.399). The radius encloses
# the polygon's corners.
footprint_radius: 0.46
footprint_polygon: [[0.40, 0.23], [-0.40, 0.23], [-0.40, -0.23], [0.40, -0.23]]
base_kinematics: "differential"

assets:
  urdf:
    ref: "file:openamr_v2.urdf"
  mjcf: "openarm:openamr_v2"

# Order is [forward_axis, side_axis, yaw_axis] per the schema. base_y exists for
# the planar-base contract (and the twin's slide joint); a differential base never
# commands it: the HAL refuses a BODY_TWIST with non-zero vy.
base_joints:
  - "base_x"
  - "base_y"
  - "base_yaw"

# Joint order IS the twin's actuator order and the 20-D action vector:
# 3 base, lift, 7 left arm, left gripper, 7 right arm, right gripper. Arm and
# gripper joints keep the OpenArm manifest's logical names (robots/openarm), so
# name-addressed (ADR-0102 slot) commands carry over; `sim_joint_name` is the
# URDF/MJCF name. Arm velocity_limit 4.0 rad/s and gripper effort 333 N mirror
# robots/openarm/robot.yaml, not the URDF's motor maxima.
joints:
  # ── planar base (virtual: x, y, yaw) ──────────────────────────────
  - name: "base_x"
    joint_type: "prismatic"
    parent_link: "world"
    child_link: "base_x_link"
    position_limits: [-50.0, 50.0]
    velocity_limit: 0.6
    effort_limit: 200.0
    actuator_kind: "bldc"
    role: "base"
  - name: "base_y"
    joint_type: "prismatic"
    parent_link: "base_x_link"
    child_link: "base_y_link"
    axis_xyz: [0, 1, 0]
    position_limits: [-50.0, 50.0]
    velocity_limit: 0.6
    effort_limit: 200.0
    actuator_kind: "bldc"
    role: "base"
  - name: "base_yaw"
    joint_type: "revolute"
    parent_link: "base_y_link"
    child_link: "base_footprint"
    position_limits: [-3.14159, 3.14159]
    velocity_limit: 1.0
    effort_limit: 200.0
    actuator_kind: "bldc"
    role: "base"
  # ── lift (DOLD v4, 0-0.35 m; provisional datasheet speed 0.018 m/s) ──
  - name: "lift_joint"
    origin_xyz: [0, 0, 0.53]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, 1]
    joint_type: "prismatic"
    parent_link: "lift_column_base_link"
    child_link: "lift_carriage_link"
    position_limits: [0, 0.35]
    velocity_limit: 0.018
    effort_limit: 800.0
    has_torque_sensor: false
    actuator_kind: "dc"
    role: "torso"
  # ── left arm (OpenArm v2.0, 7 revolute + pinch gripper) ──
  - name: "left_joint1"
    origin_xyz: [0, 0.0625, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_base_link"
    child_link: "openarm_left_link1"
    position_limits: [-3.4907, 1.3963]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: false
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint1"
  - name: "left_joint2"
    origin_xyz: [0, 0.06, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link1"
    child_link: "openarm_left_link2"
    position_limits: [-3.3161, 0.17453]
    velocity_limit: 4.0
    effort_limit: 40.0
    has_torque_sensor: false
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint2"
  - name: "left_joint3"
    origin_xyz: [0, 0, -0.06625]
    origin_rpy: [0, 0, 0]
    axis_xyz: [0, 0, -1]
    joint_type: "revolute"
    parent_link: "openarm_left_link2"
    child_link: "openarm_left_link3"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 27.0
    has_torque_sensor: false
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint3"
  - name: "left_joint4"

    effort_limit: 7.0
    has_torque_sensor: false
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint6"
  - name: "left_joint7"
    origin_xyz: [0, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link6"
    child_link: "openarm_left_ee_base_link"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: false
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint7"
  - name: "left_gripper"
    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, -0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_ee_base_link"

# Hand-assembled, NOT tool-fitted (the acm-only lowering keeps it as is):
# - ARMS: robots/openarm/robot.yaml `collision_geometry` (box + hull per link,
#   fitted to the union of the OpenArm MJCF twin's and openarm_description's
#   meshes since 2026-11-04 (urdf_lowering._urdf_link_meshes: the description's
#   link6 is 10.6-13 mm larger at one corner); hazard-log Entry 045, PR #324) copied
#   byte-for-byte with only `link_name` translated to this URDF's names:
#   openarm_{s}_link0 -> openarm_{s}_base_link, link1..6 unchanged,
#   link7 -> ee_base_link, finger_pair -> ee_link1, finger_follower -> ee_link2.
#   Every arm joint and mimic origin/axis is identical between the two
#   manifests, so the link-frame geometry is valid unchanged; the OpenArm
#   torso (openarm_body_link0) is dropped, this robot has none.
# - BODY: one box per URDF link, the axis-aligned bound of every geom
#   (collision and visual) of that link's body in the MJCF twin, +1 mm per
#   side, rounded outward to 4 dp. base_link's box bounds the WHOLE chassis
#   subtree (casters, wheels, lidar, cameras, ultrasonic/ToF, IMU), so those
#   links are not separate kernel links (KNOWN_GAPS in
#   tests/unit/test_collision_fleet_static_links.py).
# tests/unit/test_collision_geometry_enclosure.py holds every twin vertex inside,
# tests/unit/test_collision_geometry_urdf_enclosure.py every URDF mesh vertex.

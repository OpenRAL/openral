    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7
  - name: "right_gripper"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0

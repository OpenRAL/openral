    axis_xyz: [0, -1, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link5"
    child_link: "openarm_left_link6"
    position_limits: [-0.785398, 0.785398]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint6"
  - name: "left_joint7"
    origin_xyz: [0, 0, 0]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link6"
    child_link: "openarm_left_link7"
    position_limits: [-1.5708, 1.5708]
    velocity_limit: 4.0
    effort_limit: 7.0
    has_torque_sensor: true
    actuator_kind: "bldc"
    sim_joint_name: "openarm_left_joint7"
  # ── Left gripper (1 revolute) — v2 grippers are hinge joints ─────
  - name: "left_gripper"
    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    joint_type: "revolute"
    parent_link: "openarm_left_link7"
    child_link: "openarm_left_finger_pair"
    # MJCF correspondence for the collision lowering sweep: the logical
    # finger_pair link rides the inner-finger body (finger_joint1's child), so
    # its hand-authored sphere tracks real gripper articulation in mujoco FK.
    sim_joint_name: "openarm_left_finger_joint1"
    position_limits: [0.0, 0.7854]
    velocity_limit: 4.0
    effort_limit: 333.0
    has_torque_sensor: false
    actuator_kind: "servo"
    role: "gripper"
    # Position-stall grasp trigger (the real gripper reports NO effort: vendor
    # openarm_ros2 4e837e1 openarm_simple_hardware.cpp L268-279 hard-codes effort
    # and velocity to 0.0). Calibration points from 30 fps real teleop
    # recordings: closing on an object stalls
    # 0.18-0.29 rad short of a 0.0 command and stays flat to ~1e-3 rad; closing on
    # nothing rests 0.0086 rad from closed (<= 0.02); free-motion steady-state error
    # 0.006-0.025 rad; position LSB 3.815e-4 rad. Robot-type constants of the
    # gripper mechanism, not per cell: no unit overrides them
    # (docs/reference/real-pick-place-design.md §5).
    closure_calibration:
      closed_position: 0.0
      closed_rest_offset: 0.0086
      stall_gap: 0.08
      settle_tolerance: 0.001

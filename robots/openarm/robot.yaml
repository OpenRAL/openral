end_effectors:
  - name: "left_gripper"
    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    command_convention: "raw_joint_rad"
    command_range: [0.0, 0.7854]
    kind: "parallel_gripper"
    hand: "left"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7
  - name: "right_gripper"
    origin_xyz: [-0.00143, 0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [-1, 0, 0]
    command_convention: "raw_joint_rad"
    command_range: [-0.7854, 0.0]
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 333.0
    max_payload_kg: 2.0
    workspace_radius_m: 0.7

capabilities:
  locomotion: ["none"]
  can_lift_kg: 2.0
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: false
  has_lidar: false
  has_audio: false
  bimanual: true
  # `gripper_position` is executable here ONLY inside a slot group (ADR-0102):
  # `rskill_runner_node._dispatch_slots` emits a gripper slot with
  # `joint_targets=None`, not a whole-robot command on its own; `OpenArmRealHAL`
  # stages a tick's four slots (per-side arm+gripper) into one 16-DoF joint
  # vector. A standalone gripper action is refused loudly — never silently
  # dropped, unlike the pre-ADR-0102 `if action.joint_targets is None: return`.
  # Digital twin does NOT yet do this staging (`OpenArmMujocoHAL` raises on a
  # gripper slot via `_require_control_mode`); `deploy sim` admits it anyway
  # (sim gate uses SIM_EXECUTABLE_CONTROL_MODES, not this list) — twin needs
  # the same staging before it can run the contract. Don't add a mode the HAL
  # can't place: tests/unit/test_openarm_real_hal.py pins this list against
  # what `send_action` actually dispatches.
  supported_control_modes:
    - "joint_position"
    - "gripper_position"
  supported_vla_embodiments:
    - "openarm_v2"
    - "openarm"
  embodiment_tags:
    - "openarm"
    - "openarm_v2"
    - "enactic"
    - "bimanual"

safety:
  max_ee_speed_m_s: 1.0
  max_joint_speed_factor: 0.5
  max_force_n: 40.0
  max_torque_nm: 40.0
  deadman_required: true
  # provisional: former schema default, not measured on this rig — see issue #303
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose. 0.5 rad/s / 0.05 rad are what
  # every attended Thor run has used (the runner's former defaults); declared
  # here so they are visible and reviewable. Not derived from velocity_limit:
  # that gave 2 rad/s (issue #303).
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). Three control periods at 30 Hz.
  # Measured on Thor 2026-09-23 with tools/joint_state_staleness_probe.py
  # (750 Hz JointState over the production Fast-DDS path into
  # RosControlTransport): idle callback gap p99.9 2.6 ms / max 4.6 ms,
  # read-side age max 32 ms; under deliberate GIL starvation gap max 24 ms,
  # stamp->callback latency max 43 ms, no gap above 33 ms. 0.1 s is >2x the
  # worst observed and catches a dead bus within three ticks instead of
  # fifteen. Confirm on an attended run: a spurious trip shows as
  # ROSPerceptionStale in the runner log.
  joint_state_staleness_limit_s: 0.1

# `sdk_kind: open` — the whole real-hardware path is Apache-2.0: the
# upstream enactic/openarm_mujoco MJCF for sim, and `openarm_can` +
# `openarm_ros2` (the ros2_control hardware interface) for hardware.
# There is no closed vendor runtime anywhere in the chain.
sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
#
# `real` drives the physical arm through `openarm_bringup`'s ros2_control
# stack, not through Python-side CAN: the OpenArm control loop runs at
# 400 Hz, and CLAUDE.md §1.5 keeps anything above 100 Hz in C++. The
# actuation chain is
#   OpenArmRealHAL → four ros2_control command topics
#                  → controller_manager (400 Hz, C++)
#                  → openarm_hardware SystemInterface
#                  → openarm_can → SocketCAN → Damiao motors.
# The one place this robot's control rate lives. The skill runner ticks at
# it (`rate_hz` ROS param 0 = read this), the dataset recorder stamps it as
# fps, and the real HAL sets every trajectory point's
# time_from_start = horizon / control_freq_hz so the controller reaches each
# target exactly when the next command is due. A ros2_control HAL refuses to
# build without it — a fixed 100 ms deadline re-plans
# a steep segment every 33 ms and amplifies each step between targets (#303).
action_spec:
  dim: 16
  representation: "joint_positions"
  control_freq_hz: 30.0

hal:
  # null → build_hal derives MujocoArmHAL.from_description(this manifest)
  # from the `sim:` block below; no per-robot Python class is involved.
  sim: null
  real: "openral_hal.openarm_real:OpenArmRealHAL"
  # Vendor ros2_control bringup `deploy run` includes beside the real HAL
  # (controller_manager + openarm_hardware at 400 Hz stay in C++, §1.5).
  real_bringup: "openral_hal_openarm:real_bringup.launch.py"
  # issue #191 Phase 3b — HAL construction kwargs, threaded by build_hal so
  # the manifest-driven node needs no bespoke ROS params.
  #
  # One flat block serves both entrypoints: build_hal drops every key the
  # target constructor does not accept, so the sim HAL never sees the CAN
  # interface names and the real HAL never sees `gravity_enabled`. The joint-state
  # staleness window is `safety.joint_state_staleness_limit_s`, which build_hal
  # threads into both.
  parameters:
    defaults:
      # ── sim (derived MujocoArmHAL) ──────────────────────────────────
      # No settle_steps pin: the twin derives one control period of
      # action_spec.control_freq_hz per action at connect (issue #358).
      gravity_enabled: false
      # ── real (OpenArmRealHAL) ───────────────────────────────────────
      # SocketCAN interface names. The OpenArm Jetson provisioning pins
      # these with a udev rule keyed on the PEAK adapter's per-channel
      # `dev_id` (0x1 → left, 0x0 → right) so they survive replug and do
      # not depend on the kernel's `canN` enumeration order. Override per
      # rig if wired differently.
      # Defaults only. `openral detect` overwrites both from the host via
      # the can_bus_bindings below, because an interface name is a fact about
      # the machine the arm is plugged into, not about the arm.
      left_can_interface: "openarm_left"
      right_can_interface: "openarm_right"
      # Controller names from openarm_bringup's bimanual controller config.
      # Each arm's 7 joints and its gripper are commanded separately, so
      # one 16-DoF Action fans out to four topics.
      left_arm_controller: "left_joint_trajectory_controller"
      left_gripper_controller: "left_gripper_controller"
      right_arm_controller: "right_joint_trajectory_controller"
      right_gripper_controller: "right_gripper_controller"
    # Which physical bus fills which parameter, and how to recognise it.
    # This is the only robot-specific half — `openral detect` supplies the
    # values. The tokens match the OpenArm's documented udev naming
    # (`openarm_left` = motor dev_id 0x1, `openarm_right` = 0x0); a host that
    # names them differently still resolves as long as the role is in the
    # name. Ambiguous or unmatched roles warn and leave the defaults alone
    # rather than guessing which arm is which.
    can_bus_bindings:
      left_can_interface: "left"
      right_can_interface: "right"

# Cameras declared by the openarm_tabletop_pnp MJCF scene. The HAL's
# offscreen renderer publishes each to /openral/cameras/<name>/image
# and the WorldStateAggregator forwards them onto observation.images.
# Per the canonical HAL-facing sensor-naming convention, these sensor names are canonical; the
# checkpoint-facing ``vla_feature_key`` is frozen per checkpoint and
# the rskill manifest's ``image_preprocessing.aliases`` bridges
# scene-side → checkpoint-side names.
#
# ``top``: overhead workspace overview (mddoai dataset POV).
# ``wrist_left`` / ``wrist_right``: body-parented, orthogonal to jaw axis.
sensors:
  # ── head_zed — ZED Mini head camera SDK depth + mount ────────────────────
  # Robot-parented per the sensor-leg rule (robot manifest for wrist/head
  # cams, DeployScene.sensors for overhead/front); Enactic mounts it the same
  # way (openarm_zed_wrapper.xacro `mount_origin`, reference_points.yaml
  # `kind: sensor_mount`). The manifest owns this camera's identity and frames; a
  # deploy scene never redefines it (check_scene_sensor_overrides). Its real-hardware
  # `deploy_binding` and calibrated mount are per unit (units/<unit>.yaml). The
  # binding is `ros2_image` because the
  # pixels/cloud arrive on zed_wrapper's own topics: the ZED SDK computes depth
  # on the host GPU and the device only emits a side-by-side UVC stream.
  #
  # POSE PARTLY MEASURED, INTRINSICS UNCALIBRATED (no vendor extrinsic
  # exists; Stereolabs ship mount as a xacro param, Enactic leave theirs
  # commented "tune before hardware"). Position is still the stated
  # approximation: 0.20 m above the shoulder midpoint (= `openarm_base`, since
  # both arm mounts sit at (0,+/-0.031,0)), x = y = 0. Roll/pitch are MEASURED
  # (2026-09-24, Thor cell, arms unpowered): a level-surface fit on a real ZED
  # cloud showed the old 45deg-down placeholder was 22.7deg off in pitch (24.9deg
  # on the Orin cell); correcting to roll -0.7deg / pitch 67.7deg leaves 0.4deg of
  # residual tilt. Height, x/y and yaw are NOT observable from one level plane
  # and remain unmeasured, so the kernel's world-voxel check still requires the
  # extrinsic check below to PASS before it is trusted. fx/fy from StereoLabs'
  # published 90deg horizontal FOV at HD1080 depth (fx=(1920/2)/tan(45deg)=960,
  # same basis a unit overlay's calibrated intrinsics would replace). Good
  # enough to prove the pipeline, not to project anything geometric. What a
  # geometric consumer (the kernel's world-voxel check) depends on is the
  # EXTRINSIC below, not these intrinsics: the ZED SDK builds its cloud from
  # its own factory calibration. `openral calibrate camera` measures
  # intrinsics only (a monocular checkerboard fit) and cannot fix this pose.
  # The pose below is the NOMINAL mount (the Thor cell's 2026-09-24 measurement),
  # used by sim twins only. The Thor and Orin cells have different ZED mounts, so
  # each unit's calibrated pose lives in its overlay, robots/openarm/units/<unit>.yaml
  # (selected by $OPENRAL_ROBOT_UNIT or the scene's `robot_unit`); no scene may
  # redefine this sensor (openral_core.check_scene_sensor_overrides). OpenRAL does
  # not calibrate that pose: measure it yourself (a hand-eye calibration) to the
  # accuracy in openral_core.depth_extrinsic and declare it in the unit overlay; a
  # real deploy with the world-voxel check on refuses to run on this nominal value
  # (runbook: docs/tutorials/deploy/openarm-real-world-voxel-check.md, step 2).
  #
  # A depth sensor with intrinsics auto-enables the octomap leg, so every
  # in-tree OpenArm scene pins `runtime.enable_octomap` explicitly and must
  # set `octomap_cloud_topic` (this cloud comes from the SDK topic, not raycast).
  # Optional hardware: entry is inert (no device/topic) on cells without the
  # stereo camera.
  #
  # IMAGE GEOMETRY — `frame_id` IS NOT THE IMAGE FRAME, AND THE INTRINSICS ARE
  # NOT THE CAMERA'S. `frame_id: zed_camera_link` is the ZED *body* frame
  # (x forward, REP-103 body), kept because the kernel's world-voxel mount
  # (openarm_base -> zed_camera_link) and the unit overlays are keyed on it. The
  # driver publishes its depth (/zed/zed_node/depth/depth_registered) AND RGB
  # (/zed/zed_node/rgb/color/rect/image) in `zed_left_camera_frame_optical`, both
  # 1920x1080, with camera_info (/zed/zed_node/depth/camera_info,
  # .../rgb/color/rect/camera_info) K = [1498.18, 0, 936.11; 0, 1498.18, 541.81;
  # 0, 0, 1] (Thor cell, 2026-10-02): that focal length is 56 % longer than the
  # nominal fx = fy = 960 below. (That was a 1920x1080 grab; the bench override now grabs
  # VGA 672x376, where rect K is fx = fy = 356.3 and raw K is fx 384.9 with Brown
  # distortion, and the units bind `top` to the raw image — Orin cell, 2026-10-07.)
  # Anything that projects or back-projects pixels
  # MUST use the image header's frame_id and the driver's camera_info, never this
  # frame_id or these intrinsics (segmenter_node: `camera_infos` parameter).
  #
  # SIM: the twin MJCF ships no head camera, so the generic camera rig splices
  # one in from `sim_placement` below — the static mount above expressed from the
  # MJCF body `openarm_left_base_link` (= openarm_base + [0, 0.031, 0], same
  # orientation): `target` is one metre along the mount's x axis and `up` its z
  # axis, so roll -0.0123 / pitch 1.1823 are reproduced exactly (drift-checked
  # by tests/unit/test_openarm_head_zed_sim_mount.py). SimSensorBridge ray-casts
  # depth from that camera and renders its colour at the same raster, both in
  # `zed_camera_link_optical_frame` (REP-103 child of `zed_camera_link`), the
  # sim's stand-in for the driver's `zed_left_camera_frame_optical`.
  - name: "head_zed"
    modality: "depth"
    frame_id: "zed_camera_link"
    parent_frame: "openarm_base"
    static_transform_xyz_rpy: [0.0, 0.0, 0.20, -0.0123, 1.1823, 0.0]
    rate_hz: 10.0
    intrinsics:
      width: 1920
      height: 1080
      fx: 960.0
      fy: 960.0
      cx: 960.0
      cy: 540.0
    encoding: "32FC1"
    catalog_id: "stereolabs/zed_mini"
    vendor: "StereoLabs"
    model: "ZED Mini"
    sim_placement:
      parent_body: "openarm_left_base_link"
      pos: [0.0, -0.031, 0.20]
      target: [0.3788, -0.031, -0.7255]
      up: [0.9254, 0.0123, 0.3788]
    # Real-hardware binding: per host, in robots/openarm/units/<unit>.yaml.

  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 10.0
    # The ZED-M left image at the restock rSkill's training raster (672x376): the Thor
    # cell's live camera_info K (fx = fy = 1498.18, cx = 936.11, cy = 541.81 at
    # 1920x1080, 2026-10-02) scaled per axis, so a sim renders the policy's view at its
    # field of view (65.3 deg horizontal) and aspect.
    intrinsics:
      width: 672
      height: 376
      fx: 524.363
      fy: 521.589
      cx: 327.639
      cy: 188.630
    encoding: "rgb8"
    vla_feature_key: "observation.images.top"
    vendor: "sim"
    model: "mujoco_top"
    # On the real cell `top` is the ZED-M's rectified LEFT image (the wrapper owns the
    # device; `ros2_image` subscribes). The frame and intrinsics above are the sim
    # render's stand-ins: fine for a policy view, which conditions on pixels, but NOT
    # for anything geometric on real hardware — use `head_zed` for that. The key stays
    # `observation.images.top`: the restock π0.5 rSkill aliases it onto its checkpoint's
    # `observation.images.context` (`image_preprocessing.aliases: {top: "context"}`), and
    # the ros2_image reader takes the wire encoding from each message, not `encoding`.
    # Real-hardware binding: per host, in robots/openarm/units/<unit>.yaml.
    # It is the same device as head_zed, so it rides head_zed's mount (unit calibration
    # included): the Isaac scene renders both from that one pose.
    shares_mount_with: "head_zed"
    # Twin: the bimanual MJCF ships no head camera, so the generic camera rig splices one
    # in at head_zed's nominal mount. The MJCF world origin IS `openarm_base` (its
    # `openarm_left_base_link` sits at [0, 0.031, 0], the manifest's
    # openarm_base->openarm_left_link0), so the mount is expressed from that body;
    # `target` is one metre along the nominal 1.1823 rad down-pitch.
    sim_placement:
      parent_body: "openarm_left_base_link"
      pos: [0.0, -0.031, 0.20]
      target: [0.379, -0.031, -0.725]
  - name: "wrist_left"
    modality: "rgb"
    frame_id: "openarm_left_ee_base_link"
    rate_hz: 10.0
    intrinsics:
      width: 640
      height: 480
      fx: 640.0
      fy: 640.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.wrist_left"
    vendor: "sim"
    model: "mujoco_wrist"
    # The twin's MJCF (openarm_v20_bimanual.xml) names its wrist cameras with a
    # `camera_` prefix; without this the sim HAL logs `camera_absent` and renders nothing.
    sim_camera_name: "camera_wrist_left"
    # Real-hardware binding: per host, in robots/openarm/units/<unit>.yaml.
  - name: "wrist_right"
    modality: "rgb"
    frame_id: "openarm_right_ee_base_link"
    rate_hz: 10.0
    intrinsics:
      width: 640
      height: 480
      fx: 640.0
      fy: 640.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.wrist_right"
    vendor: "sim"
    model: "mujoco_wrist"
    sim_camera_name: "camera_wrist_right"
    # Real-hardware binding: per host, in robots/openarm/units/<unit>.yaml.

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# Source: ``enactic/openarm_mujoco/v2/openarm_v20_bimanual.xml`` fetched
# lazily by ``openral_hal._openarm_v2_assets.ensure_openarm_v2_mjcf``
# (drops out when ``robot_descriptions`` bumps its pin past v2).
# Layout: 7 arm + 1 driver-finger per side = 16 actuators, but 18 qpos
# (each side has a passive follower finger at qpos 8 / 17 — we skip
# those, the MJCF's <equality> constraint keeps the follower in sync).
# OpenArm v2 ships <position> actuators with per-class PD gains, so
# ``seed_ctrl_from_qpos=true`` is required: the actuators must hold the
# initial pose on the first ``mj_step`` or they'll drive every joint to
# ``ctrl == 0``.
sim:
  joint_qpos_addr:
    left_joint1: 0
    left_joint2: 1
    left_joint3: 2
    left_joint4: 3
    left_joint5: 4
    left_joint6: 5
    left_joint7: 6
    left_gripper: 7          # qpos 8 is the left follower finger (passive)
    right_joint1: 9
    right_joint2: 10
    right_joint3: 11
    right_joint4: 12
    right_joint5: 13
    right_joint6: 14
    right_joint7: 15
    right_gripper: 16        # qpos 17 is the right follower finger (passive)
  grippers:
    - joint: "left_gripper"
      ctrl_range: [0.0, 0.7854]
      qpos_addrs: [7]
      qpos_scale: 0.7854
      read_mode: "passthrough"
      write_mode: "passthrough"
    - joint: "right_gripper"
      ctrl_range: [-0.7854, 0.0]
      qpos_addrs: [16]
      qpos_scale: 0.7854
      read_mode: "passthrough"
      write_mode: "passthrough"
  seed_ctrl_from_qpos: true

# Per-robot scene rendering defaults (openral-core 0.3.0).
# Per the scene-composition / robot-manifest separation convention — the
# tabletop arena composition + the overview-camera pose moved OUT
# of this robot manifest into the scenes that own them: the deploy scene
# (`scenes/deploy/openarm_tabletop.yaml` `composition:`) and the sim/eval scene
# (`scenes/sim/openarm_tabletop.yaml` `backend_options.top_camera_*`). The robot
# manifest now describes only the robot; the scene describes the scene; the
# rSkill is separate. (Was `scene_defaults`, reworked in issue #191 Phase 3b.)

# Follower fingers (URDF ``<mimic>`` / MJCF joint equality): each gripper's
# second jaw, posed by the gripper joint's value — ``q = multiplier * q[mimics]
# + offset`` — with no command channel of its own. The kernel places it as its
# own rigid collision link every check (``MimicJoint``,
# docs/reference/finger-mimic-geometry.md). Origins/axes are re-injected from
# the MJCF by ``openral collision lower`` (the MJCF spells the coupling as the
# same axis with multiplier 1; the URDF as the negated axis with -1 — the same
# motion); multiplier/offset are checked against the MJCF equality there.
mimic_joints:
  - name: "openarm_left_finger_joint2"
    origin_xyz: [-0.00143, 0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    parent_link: "openarm_left_link7"
    child_link: "openarm_left_finger_follower"
    mimics: "left_gripper"
    multiplier: 1.0
    offset: 0.0
    joint_type: "revolute"
    sim_joint_name: "openarm_left_finger_joint2"
  - name: "openarm_right_finger_joint2"
    origin_xyz: [-0.00143, -0.018, -0.068]
    origin_rpy: [0, 0, 0]
    axis_xyz: [1, 0, 0]
    parent_link: "openarm_right_link7"
    child_link: "openarm_right_finger_follower"
    mimics: "right_gripper"
    multiplier: 1.0
    offset: 0.0
    joint_type: "revolute"
    sim_joint_name: "openarm_right_finger_joint2"

# Rigid, zero-DoF links of the collision tree. NOT `joints` (consumed
# unfiltered as action-vector width/sim qpos map/state-contract filter/joint
# permutation — a zero-DoF entry there would corrupt all four). Both arm
# pedestals mount on `base_frame` (openarm_base); without them the two arms
# are separate trees, each lowered superimposed on the base origin. Source:
# `openarm:bimanual` MJCF openarm_v20_bimanual.xml L173-174/L259 — worldbody
# directly contains `openarm_left_base_link pos="0 0.031 0"` /
# `openarm_right_base_link pos="0 -0.031 0"`, no quat (identity). This
# manifest is MJCF-derived (`openarm_*_link0` == MJCF's `openarm_*_base_link`,
# confirmed by left_joint1 origin matching). The arms are still placed from
# the MJCF, never from the vendored openarm.urdf (whose arms sit 0.698 m above
# its root; mixing the two frames would misplace both arms by that much).
#
# The torso (`openarm_body_link0`) is the one link the MJCF does not carry:
# its worldbody holds the two arm base links directly, so the kernel never saw
# the pedestal the hands can swing into (issue #356). It is a STATIC link —
# a fixed-attachment child with no MJCF body — and `openral collision lower`
# takes its geometry from openarm.urdf's `openarm_body_link0` (collision +
# visual meshes, package://openarm_description), placing it here. Origin:
# openarm.urdf L31-35 world->body_link0 = identity, L58-62
# body_link0->left_base_link = [0, 0.031, 0.698]; the manifest's
# openarm_base->openarm_left_link0 = [0, 0.031, 0] (above), so
# openarm_base->body_link0 = [0, 0, -0.698] — the same number
# `assets.urdf.base_to_root_xyz_rpy` bridges on /tf. The torso is lowered as
# three box+hull slabs (`--tight-link openarm_body_link0=3`): one hull of the
# foot plate + column + shoulder block would reach 0.12 m past the column,
# across the bimanual workspace.
fixed_attachments:
  - name: "openarm_left_base_mount"
    parent_link: "openarm_base"
    child_link: "openarm_left_link0"
    origin_xyz: [0, 0.031, 0]
    origin_rpy: [0, 0, 0]
  - name: "openarm_right_base_mount"
    parent_link: "openarm_base"
    child_link: "openarm_right_link0"
    origin_xyz: [0, -0.031, 0]
    origin_rpy: [0, 0, 0]
  - name: "openarm_body_mount"
    parent_link: "openarm_base"
    child_link: "openarm_body_link0"
    origin_xyz: [0, 0, -0.698]
    origin_rpy: [0, 0, 0]


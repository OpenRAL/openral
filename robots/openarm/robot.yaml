# RobotDescription — Enactic OpenArm v2 bimanual arm (sim baseline).
#
# Mirrors `OPENARM_DESCRIPTION` in python/hal/src/openral_hal/openarm.py
# (drift guarded by tests/unit/test_robot_manifests_match_hal_constants.py).
#
# Joint limits + per-joint kp/kv (MJCF) + symmetric finger gains come from
# upstream `enactic/openarm_mujoco` v2 bimanual MJCF (PR #19). v2 dropped v1's
# software-PD-on-torque-motors in favour of native <position> actuators with
# per-class PD gains (DM8009 kp=230 kv=2.7; DM4340 kp=190 kv=2.2; DM4310
# kp=30 kv=1.5; fingers kp=30 kv=0.2), proper ctrlrange/forcerange, and a
# single driven finger per side (follower tracks via MJCF <equality>).
#
# HAL fetches the v2 MJCF lazily via
# `openral_hal._openarm_v2_assets.ensure_openarm_v2_mjcf` because
# `robot_descriptions` still pins a pre-v2 commit; removable once upstream bumps.
#
# Real-hardware path shares this manifest: `hal.real` is `OpenArmRealHAL`,
# commanding `openarm_bringup`'s four ros2_control controllers (per-side
# arm+gripper); the C++ `openarm_hardware` SystemInterface below them drives
# the Damiao CAN FD motor buses at 400 Hz. Python never touches motors
# directly (CLAUDE.md §1.5).

name: "openarm_v2"
embodiment_kind: "bimanual"
base_frame: "openarm_base"

# robot_state_publisher: `assets.urdf` deliberately unset.
# Upstream URDF + xacro live at github.com/enactic/openarm_description
# (single-arm) and github.com/reazon-research/openarm_ros2
# (bimanual bringup); both require xacro processing at launch time
# which deploy_e2e.launch.py does not yet support. The
# `robot_descriptions` Python package ships only
# `openarm_v1_mj_description` (MJCF). Wire one of these once a
# wrapped-task-space VLA targets openarm.

# Unified asset block. Vendored URDF + bimanual MJCF.
assets:
  urdf:
    ref: "file:openarm.urdf"
    # openarm.urdf roots at `world`, NOT this manifest's `base_frame`
    # (`openarm_base`), so without this bridge nothing on /tf publishes
    # `openarm_base` and every consumer fails (sensor mounts, SlamMapBridge,
    # eventually octomap_server/world-cloud bridge). `root_frame` must be the
    # URDF's ROOT (`world`), not `body_link0`: robot_state_publisher already
    # publishes world->body_link0, so bridging onto body_link0 gives it two
    # parents and tf2 lookups become order-dependent, silently dropping data.
    # Offset derived from two mounts of the SAME physical link
    # (`openarm_*_link0` == MJCF's `openarm_*_base_link` == URDF's
    # `left_base_link`): openarm_base->openarm_left_link0 = [0,0.031,0]
    # (fixed_attachments); body_link0->left_base_link = [0,0.031,0.698]
    # (openarm.urdf); world->body_link0 = identity => openarm_base sits
    # 0.698 m above world, so world in openarm_base is z=-0.698. Additive TF
    # only — base_frame and all existing origins keep their frame (same
    # mechanism UrdfAsset documents for Franka's panda_link0-on-mobile-base).
    root_frame: "world"
    base_to_root_xyz_rpy: [0.0, 0.0, -0.698, 0.0, 0.0, 0.0]
  mjcf: "openarm:bimanual"
  # Hand-reviewed ACM exemptions (rest-pose contacts the sweep can't prove);
  # unioned into the MJCF lowering - see the SRDF header for the paper trail.
  srdf: "file:openarm.srdf"


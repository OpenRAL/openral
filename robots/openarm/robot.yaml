# RobotDescription — Enactic OpenArm v2 bimanual arm (sim baseline).
#
# This manifest mirrors `OPENARM_DESCRIPTION` in
# python/hal/src/openral_hal/openarm.py (drift guarded by
# tests/unit/test_robot_manifests_match_hal_constants.py).
#
# Joint limits + per-joint kp/kv (in the MJCF) + symmetric finger
# gains come from the upstream `enactic/openarm_mujoco` v2 bimanual
# MJCF — see PR #19 on master.  v2 dropped v1's
# software-PD-on-top-of-torque-motors complexity in favour of
# native <position> actuators with per-class PD gains
# (DM8009: kp=230 kv=2.7; DM4340: kp=190 kv=2.2; DM4310: kp=30 kv=1.5;
# fingers: kp=30 kv=0.2), proper ctrlrange / forcerange, and a
# single driven finger per side (the follower finger tracks via an
# <equality> constraint inside the MJCF).
#
# The HAL fetches the v2 MJCF lazily via
# `openral_hal._openarm_v2_assets.ensure_openarm_v2_mjcf` because
# the `robot_descriptions` package still pins to a pre-v2 commit;
# the helper can be removed once upstream bumps.
#
# The real-hardware path shares this manifest. `hal.real` is
# `OpenArmRealHAL`, which commands `openarm_bringup`'s four ros2_control
# controllers (per-side arm + gripper); the C++ `openarm_hardware`
# SystemInterface below them drives the Damiao CAN FD motor buses at
# 400 Hz. Python never touches the motors directly (CLAUDE.md §1.5).

name: "openarm_v2"
embodiment_kind: "bimanual"
base_frame: "openarm_base"

# robot_state_publisher: `assets.urdf` deliberately unset.
# Upstream URDF + xacro live at github.com/enactic/openarm_description
# (single-arm) and github.com/reazon-research/openarm_ros2
# (bimanual bringup); both require xacro processing at launch time
# which sim_e2e.launch.py does not yet support. The
# `robot_descriptions` Python package ships only
# `openarm_v1_mj_description` (MJCF). Wire one of these once a
# wrapped-task-space VLA targets openarm.

# Unified asset block. Vendored URDF + bimanual MJCF.
assets:
  urdf:
    ref: "file:openarm.urdf"
    # openarm.urdf roots at `world`, NOT at this manifest's `base_frame`
    # (`openarm_base`), so without this bridge nothing on /tf ever publishes
    # `openarm_base` and every consumer that looks it up fails: sensor mounts
    # (_sensor_wiring defaults `parent_frame` to base_frame), SlamMapBridge,
    # and — once the octomap frames are manifest-derived — octomap_server and
    # the world-cloud bridge.
    #
    # `root_frame` must be the URDF's ROOT (`world`), not the visually obvious
    # `body_link0`: robot_state_publisher already publishes world->body_link0,
    # so bridging onto body_link0 would give it two parents, and a frame with
    # two parents is not a tree — tf2 lookups become order-dependent and start
    # silently dropping data.
    #
    # The offset follows from the two mount points, which describe the SAME
    # physical link (this file's note below: `openarm_*_link0` IS the MJCF's
    # `openarm_*_base_link`, i.e. the URDF's `left_base_link`):
    #
    #   openarm_base -> openarm_left_link0  = [0, 0.031, 0]      (fixed_attachments)
    #   body_link0   -> left_base_link      = [0, 0.031, 0.698]  (openarm.urdf)
    #   world        -> body_link0          = identity           (openarm.urdf)
    #   => openarm_base sits 0.698 m ABOVE world, so world expressed in
    #      openarm_base is z = -0.698.
    #
    # This is additive TF only: `base_frame` is unchanged, so the MJCF-derived
    # collision geometry and every existing origin in this manifest keep their
    # frame. It is the mechanism UrdfAsset already documents for exactly this
    # case ("Franka's panda_link0 mounted onto a base_link mobile platform").
    root_frame: "world"
    base_to_root_xyz_rpy: [0.0, 0.0, -0.698, 0.0, 0.0, 0.0]
  mjcf: "openarm:bimanual"
  # Hand-reviewed ACM exemptions (rest-pose contacts the sweep can't prove);
  # unioned into the MJCF lowering - see the SRDF header for the paper trail.
  srdf: "file:openarm.srdf"


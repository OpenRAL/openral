# OpenArm cell on the Jetson AGX Orin (qorin1). head_zed's mount below is this unit's own,
# fitted 2026-09-25 from the arms' own returns (links 4-6 of both arms, hanging at q = 0, 40
# stacked clouds, mock hardware) to their MJCF meshes, with roll/pitch held at the Thor
# level-surface values, which keep this cell's table level too (0.25 deg). Median arm
# point-to-mesh 7.3 -> 3.9 mm; correction -17.0 mm x, -9.8 mm y, +16.3 mm z, -0.44 deg yaw
# from the manifest's nominal mount. Resting arms only, so not a calibration: it assumes they
# hang at q = 0, and from hanging arms the height and yaw are unresolved (a re-fit moved the
# height 28 mm with no change in residual, 2026-09-26). It aligns the robot self-filter. For
# the world-voxel check, fit over several poses with real joint readings
# (tools/depth_extrinsic_capture.py, then tools/depth_extrinsic_check.py check --unit orin).
#
# Per-host camera bindings. Carried over unchanged from robot.yaml, which served every
# OpenArm cell before per-unit overlays existed; re-check the Arducam by-id paths with
# `ls -l /dev/v4l/by-id` on this host. The ros2_image topics are zed_wrapper's, launched
# by the OpenArm scenes' `drivers:`. Selected by $OPENRAL_ROBOT_UNIT or a scene's
# `robot_unit`.
schema_version: "0.1"
robot_id: openarm
unit: orin
sensors:
  - name: head_zed
    static_transform_xyz_rpy: [-0.0170, -0.0098, 0.2163, -0.0123, 1.1823, -0.0076]
    deploy_binding:
      backend: ros2_image
      backend_params:
        topic: /zed/zed_node/depth/depth_registered
        reliability: best_effort
        qos_depth: 5
      max_age_ms: 500
  - name: top
    deploy_binding:
      backend: ros2_image
      backend_params:
        topic: /zed/zed_node/rgb/color/rect/image
        reliability: best_effort
        qos_depth: 5
      max_age_ms: 200
  - name: wrist_left
    deploy_binding:
      backend: opencv_thread
      backend_params:
        device: /dev/v4l/by-id/usb-Arducam_Arducam_B0495__USB3_2.3MP__CELL1_CAM_LEFT-video-index0
        width: 640
        height: 480
        fps: 30
  - name: wrist_right
    deploy_binding:
      backend: opencv_thread
      backend_params:
        device: /dev/v4l/by-id/usb-Arducam_Arducam_B0495__USB3_2.3MP__CELL1_CAM_RIGHT-video-index0
        width: 640
        height: 480
        fps: 30

# OpenArm cell on the Jetson Thor. head_zed's mount below was measured on 2026-10-02 by
# fitting the ZED's depth returns of the arms, posed at their real joint readings over 13
# poses, to the robot's own meshes (median arm residual 2.3 mm; held-out spread 0.6 mm
# height / 1.2 mm planar / 0.15 deg tilt / 0.07 deg yaw; its 65.6 deg downward pitch agrees
# with an inclinometer on the camera). That fitting tool is not part of OpenRAL (it took four
# pose designs and two days to constrain the camera's tilt, and its accuracy is bounded by
# the arm's ~1 cm of joint play); the value is declared here as the
# operator's calibration, which is what `deploy run` requires (runbook step 2).
# Measure again if the ZED head is touched: the camera's view of the floor shifted by about
# 1 deg between 2026-10-01 and 2026-10-02 with nothing deliberately moved. Earlier starting
# estimates for this cell, oldest first: 2026-09-25 resting-arm fit (height and yaw
# unresolved), 2026-10-01 table-plane + tape-measure correction (the ZED had been
# reconnected and moved), 2026-10-01 fits over 3-10 poses (tilt unresolved).
#
# Per-host camera bindings. Carried over unchanged from robot.yaml, which served every
# OpenArm cell before per-unit overlays existed; re-check the Arducam by-id paths with
# `ls -l /dev/v4l/by-id` on this host. The ros2_image topics are zed_wrapper's, launched
# by the OpenArm scenes' `drivers:`. Selected by $OPENRAL_ROBOT_UNIT or a scene's
# `robot_unit`.
schema_version: "0.1"
robot_id: openarm
unit: thor
sensors:
  - name: head_zed
    static_transform_xyz_rpy: [0.06597, -0.004548, 0.094539, -0.055916, 1.145014, -0.036625]
    deploy_binding:
      backend: ros2_image
      backend_params:
        topic: /zed/zed_node/depth/depth_registered
        reliability: best_effort
        qos_depth: 5
      max_age_ms: 500
  - name: top
    deploy_binding:
      backend: ros2_image
      backend_params:
        topic: /zed/zed_node/rgb/color/rect/image
        reliability: best_effort
        qos_depth: 5
      max_age_ms: 200
  - name: wrist_left
    deploy_binding:
      backend: opencv_thread
      backend_params:
        device: /dev/v4l/by-id/usb-Arducam_Arducam_B0495__USB3_2.3MP__CELL1_CAM_LEFT-video-index0
        width: 640
        height: 480
        fps: 30
  - name: wrist_right
    deploy_binding:
      backend: opencv_thread
      backend_params:
        device: /dev/v4l/by-id/usb-Arducam_Arducam_B0495__USB3_2.3MP__CELL1_CAM_RIGHT-video-index0
        width: 640
        height: 480
        fps: 30
#
# Surveyed fixtures (`fixtures:`, a list of `UnitFixture`): none yet. A place / grasp target
# this cell's furniture provides (the shelf, the front box's table) goes here as
#   - id: "cell:shelf_top"        # the target_id a place / grasp declaration names
#     frame_id: openarm_base      # must be the manifest's base_frame (fixed-base robots only)
#     pose: {xyz: [...], quat_xyzw: [...], frame_id: openarm_base}   # box centre
#     half_extents: [...]         # m, each <= 1.5, volume <= 8 m^3 (the place-region caps)
#     top_plane_normal: [0.0, 0.0, 1.0]
#     survey_uncertainty_m: ...   # (0, 0.05]
#     surveyed_on: YYYY-MM-DD
#     surveyed_by: ...
#     method: ...                 # how it was measured, as for head_zed's mount above
# Every value must be MEASURED on this cell, never estimated. A fixture is a declared volume
# that arms nothing by itself: the producer verifies it live against the voxel map before it
# becomes a place region (real pick-and-place design §2.3; ADR-0097 amendment, drafted).

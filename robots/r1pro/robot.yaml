end_effectors:
  - name: "left_gripper"
    # The MuJoCo twin's encoding (0 closed, 1 open). The BEHAVIOR scene declares its
    # own normalized_open_symmetric (OmniGibson's [-1, 1]), which sim_runner and the
    # rSkill runner pass as scene_gripper_convention.
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    parent_link: "left_gripper_link"
    actuated: true
  - name: "right_gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    parent_link: "right_gripper_link"
    actuated: true

capabilities:
  locomotion: ["wheeled"]
  can_lift_kg: 3.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: true
  has_vision: true
  has_lidar: false
  bimanual: true
  supported_control_modes:
    - "body_twist"
    - "joint_position"
    - "gripper_position"
  embodiment_tags:
    - "r1pro"
    - "mobile_base"

safety:
  max_ee_speed_m_s: 0.5
  max_joint_speed_factor: 0.5
  max_force_n: 50.0
  max_torque_nm: 10.0
  deadman_required: true
  max_base_linear_speed_m_s: 0.7
  max_base_angular_speed_rad_s: 0.3

sensors:
  - name: "head"
    modality: "rgb"
    frame_id: "zed_link"
    rate_hz: 30.0
    intrinsics:
      width: 720
      height: 720
      fx: 306.0
      fy: 306.0
      cx: 360.0
      cy: 360.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.head"
    vendor: "sim"
    model: "zed"
    # zed_link is a REP-103 optical frame (z forward, y down), pitched 20 deg down.
    sim_placement:
      parent_body: "zed_link"
      pos: [0.0, 0.0, 0.0]
      target: [0.0, 0.0, 1.0]
      up: [0.0, -1.0, 0.0]
  - name: "left_wrist"
    modality: "rgb"
    frame_id: "left_realsense_link"
    rate_hz: 30.0
    intrinsics:
      width: 480
      height: 480
      fx: 388.6639
      fy: 388.6639
      cx: 240.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.left_wrist"
    vendor: "sim"
    model: "realsense"
    sim_placement:
      parent_body: "left_realsense_link"
      pos: [0.0, 0.0, 0.0]
      target: [0.0, 0.0, 1.0]
      up: [0.0, -1.0, 0.0]
  - name: "right_wrist"
    modality: "rgb"
    frame_id: "right_realsense_link"
    rate_hz: 30.0
    intrinsics:
      width: 480
      height: 480
      fx: 388.6639
      fy: 388.6639
      cx: 240.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.right_wrist"
    vendor: "sim"
    model: "realsense"
    sim_placement:
      parent_body: "right_realsense_link"
      pos: [0.0, 0.0, 0.0]
      target: [0.0, 0.0, 1.0]
      up: [0.0, -1.0, 0.0]

sdk_kind: "open"

# The MuJoCo twin (openral_hal._behavior_r1pro_assets). qpos 0..2 are the planar base
# joints, which are not manifest joints: BODY_TWIST moves them (_PlanarBaseTwin). Each
# hand's finger_joint2 follows finger_joint1 through an MJCF equality and has no
# actuator; the gripper actuator drives finger_joint1 over its 0-0.05 m slide
# (0 closed), read as the two fingers' summed opening over 0.1 m.
sim:
  joint_qpos_addr:
    torso_joint1: 3
    torso_joint2: 4
    torso_joint3: 5
    torso_joint4: 6
    left_arm_joint1: 7
    left_arm_joint2: 8
    left_arm_joint3: 9
    left_arm_joint4: 10
    left_arm_joint5: 11
    left_arm_joint6: 12
    left_arm_joint7: 13
    left_gripper_finger_joint1: 14
    left_gripper_finger_joint2: 15
    right_arm_joint1: 16
    right_arm_joint2: 17
    right_arm_joint3: 18
    right_arm_joint4: 19
    right_arm_joint5: 20
    right_arm_joint6: 21
    right_arm_joint7: 22
    right_gripper_finger_joint1: 23
    right_gripper_finger_joint2: 24
  actuator_index:
    torso_joint1: 0
    torso_joint2: 1
    torso_joint3: 2
    torso_joint4: 3
    left_arm_joint1: 4
    left_arm_joint2: 5
    left_arm_joint3: 6
    left_arm_joint4: 7
    left_arm_joint5: 8
    left_arm_joint6: 9
    left_arm_joint7: 10
    left_gripper_finger_joint1: 11
    right_arm_joint1: 12
    right_arm_joint2: 13
    right_arm_joint3: 14
    right_arm_joint4: 15
    right_arm_joint5: 16
    right_arm_joint6: 17
    right_arm_joint7: 18
    right_gripper_finger_joint1: 19
  grippers:
    - joint: "left_gripper_finger_joint1"
      ctrl_range: [0.0, 0.05]
      qpos_addrs: [14, 15]
      qpos_scale: 0.1
    - joint: "right_gripper_finger_joint1"
      ctrl_range: [0.0, 0.05]
      qpos_addrs: [23, 24]
      qpos_scale: 0.1
  seed_ctrl_from_qpos: true

# The robot's control rate: one action per 1/30 s, BEHAVIOR's challenge env
# (StanfordVL/BEHAVIOR-1K @ c6aca46, OmniGibson/omnigibson/eval/utils/eval_utils.py:
# action_frequency 30, physics_frequency 120). The MuJoCo twin steps one period per
# action; observation_spec and the action layout stay with the BEHAVIOR scene adapter.
action_spec:
  control_freq_hz: 30.0

hal:
  # null -> build_hal derives MujocoArmHAL.from_description from `sim:` above. The
  # BEHAVIOR deploy scene (scenes/deploy/behavior_r1pro.yaml) attaches its own env.
  sim: null
  real: null
schema_version: "0.2"

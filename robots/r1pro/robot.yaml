      height: 480
      fx: 388.6639
      fy: 388.6639
      cx: 240.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.left_wrist"
    vendor: "sim"
    model: "realsense"
    sim_placement:
      parent_body: "left_realsense_link"
      pos: [0.0, 0.0, 0.0]
      target: [0.0, 0.0, 1.0]
      up: [0.0, -1.0, 0.0]
  - name: "right_wrist"

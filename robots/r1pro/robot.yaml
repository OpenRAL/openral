# Simulated Galaxea R1 Pro used by the 2026 BEHAVIOR-1K challenge.
# Joint limits come from behavior-1k/omnigibson-robot-assets r1pro.urdf.

name: "r1pro"
embodiment_kind: "mobile_manipulator"
base_frame: "base_link"
odom_frame: "odom"
# Bare-chassis outline (ADR-0099: Nav2 is base-only), measured from the
# BEHAVIOR-1K r1pro.urdf @ c325bd3b visual meshes (collision meshes are not
# shipped); see docs/reference/g1-r1pro-base-footprints.md. Does not cover the
# torso, which leans 8.6 cm past the front bumper in BEHAVIOR's reset pose.
footprint_radius: 0.41
footprint_polygon: [[0.24, 0.31], [0.20, 0.34], [-0.11, 0.34], [-0.36, 0.15],
                    [-0.39, 0.11], [-0.40, 0.03], [-0.40, -0.03], [-0.39, -0.11],
                    [-0.36, -0.15], [-0.11, -0.34], [0.20, -0.34], [0.24, -0.31]]

# Visual-only URDF: BEHAVIOR's r1pro.urdf at the revision the limits below came
# from, its unshipped collision meshes dropped (openral_hal._behavior_r1pro_assets).
assets:
  urdf:
    ref: "behavior:r1pro"
  # The `deploy sim` MuJoCo twin built from that URDF: visual meshes double as convex
  # collision, the swerve base is planar base_x/base_y/base_yaw joints placed by
  # BODY_TWIST, and 20 position actuators (openral_hal._behavior_r1pro_assets).
  mjcf: "behavior:r1pro"

joints:
  - name: "torso_joint1"
    joint_type: "revolute"
    parent_link: "base_link"
    child_link: "torso_link1"
    position_limits: [-1.1345, 1.8326]
    velocity_limit: 2.5
    effort_limit: 100.0
    actuator_kind: "bldc"
  - name: "torso_joint2"
    joint_type: "revolute"
    parent_link: "torso_link1"
    child_link: "torso_link2"

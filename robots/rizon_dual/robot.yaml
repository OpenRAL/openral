end_effectors:
  - name: "left_flange"
    kind: "tool"
    hand: "left"
    n_dof: 0
    max_payload_kg: 4.0
    workspace_radius_m: 0.78
  - name: "right_flange"
    kind: "tool"
    hand: "right"
    n_dof: 0
    max_payload_kg: 4.0
    workspace_radius_m: 0.78

capabilities:
  locomotion: ["none"]
  can_lift_kg: 4.0
  has_force_control: true
  bimanual: true
  supported_control_modes: ["joint_position"]
  supported_vla_embodiments: ["rizon_dual"]
  embodiment_tags: ["rizon_dual", "rizon4s", "flexiv", "bimanual"]

# provisional: none of these is measured on the rig yet. The speeds sit under the 1 rad/s
# the reference rig's VR acceptance session earned (half the RDK's own 2 rad/s cap); the
# torque ceiling is the Rizon 4s' proximal rating.
safety:
  max_ee_speed_m_s: 0.5
  max_joint_speed_factor: 0.25
  max_force_n: 150.0
  max_torque_nm: 123.0
  deadman_required: true
  max_ee_accel_m_s2: 1.0
  contact_force_threshold_n: 30.0
  self_collision_margin_m: 0.03
  starting_pose_max_joint_speed_rad_s: 0.3
  starting_pose_tolerance_rad: 0.05
  # A real encoder feed silent for half a second is a fault (measure with
  # tools/joint_state_staleness_probe.py --robot robots/rizon_dual/robot.yaml).
  joint_state_staleness_limit_s: 0.5

# flexiv_ros2 / flexiv_description / the RDK's API are Apache-2.0, but the RDK's driver
# core is a vendor-precompiled static library.
sdk_kind: "closed_with_api"

# provisional: the runner's 30 Hz default; the controllers interpolate at 1 kHz.
action_spec:
  control_freq_hz: 30.0

hal:
  sim: null
  real: "openral_hal.flexiv_rizon_real:RizonDualRealHAL"
  # controller_manager + 2 x upstream FlexivHardwareInterface (C++, 1 kHz, §1.5).
  real_bringup: "openral_hal_rizon:real_bringup.launch.py"
  parameters:
    defaults:
      # Must match packages/openral_hal_rizon/config/rizon_dual_controllers.yaml.
      left_arm_controller: "left_arm_controller"
      right_arm_controller: "right_arm_controller"

# The two arm mounts, verbatim from rizon_dual.urdf's left_/right_base_joint (world at
# the column's foot): the kernel places both arm trees relative to `world` through these.
fixed_attachments:
  - name: "left_base_joint"
    parent_link: "world"
    child_link: "left_base_link"
    origin_xyz: [0.0, 0.34, 1.5]
    origin_rpy: [3.141592653589793, -1.5707963267948966, 0.0]
  - name: "right_base_joint"
    parent_link: "world"
    child_link: "right_base_link"
    origin_xyz: [0.0, -0.34, 1.5]
    origin_rpy: [0.0, 1.5707963267948966, 0.0]

schema_version: "0.2"


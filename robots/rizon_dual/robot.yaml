# RobotDescription — two Flexiv Rizon 4s arms driven as one robot (reference rig: q5090).
#
# Kinematics are upstream flexiv_description jazzy-v1.9 (Rizon4s), composed on one `world`
# by packages/openral_hal_rizon/urdf/rizon_dual.urdf.xacro with the rig's measured mounts;
# rizon_dual.urdf is that xacro rendered. Joint origins below are read off that URDF.
# Position limits are Flexiv's SOFT limits (config/Rizon4s/joint_limits.yaml; the RDK
# refuses targets past them), except joint7: held to home +-90 deg on the reference rig,
# where the wrist cabling winds past that (a right wrist wound 3.2 rad, 2026-11-11).
#
# The rig's Damiao jaws (CAN) have no upstream ros2_control driver; this embodiment is the
# two 7-DoF arms only (14-D action: left 0..6, right 7..13).

name: "rizon_dual"
embodiment_kind: "manipulator"
base_frame: "world"

assets:
  urdf:
    ref: "file:rizon_dual.urdf"
  srdf: "file:rizon_dual.srdf"


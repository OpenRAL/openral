# RobotDescription — Hugging Face SO-100 follower (real + sim).
#
# This is the embodiment used by ``openral_hal.so100_sim.SO100DigitalTwin``
# and by physical SO-100 hardware. The arm has 5 servo joints + a 1-DoF
# gripper, all driven over a USB serial bus by Feetech motors.
#
# Joint kinematic detail is taken from the public SO-100 URDF in
# ``robot_descriptions`` / mujoco_menagerie. ``position_limits`` are in
# radians despite the lerobot SDK exposing degrees — OpenRAL keeps the
# URDF-native units.

name: "so100_follower"
embodiment_kind: "manipulator"

base_frame: "base"

# robot_state_publisher wiring. `robot_descriptions` ships
# the SO-ARM100 URDF (cloned from github.com/TheRobotStudio/SO-ARM100
# on first import); root link is ``base``, matching our base_frame.
# Unified asset block (URDF / MJCF).
assets:
  urdf:
    ref: "file:so100_follower.urdf"
  mjcf: "rd:so_arm100_mj_description"

joints:
  - name: "shoulder_pan"
    origin_xyz: [0, -0.0452, 0.0165]
    origin_rpy: [1.57079, 0, 0]
    axis_xyz: [0, 1, 0]
    joint_type: "revolute"
    parent_link: "base"
    child_link: "shoulder"
    position_limits: [-2.0944, 2.0944]
    velocity_limit: 4.5
    effort_limit: 5.0
    actuator_kind: "servo"
  - name: "shoulder_lift"
    origin_xyz: [0, 0.1025, 0.0306]
    origin_rpy: [-1.8, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "shoulder"
    child_link: "upper_arm"
    position_limits: [-1.7453, 1.7453]
    velocity_limit: 4.5
    effort_limit: 5.0
    actuator_kind: "servo"
  - name: "elbow_flex"
    origin_xyz: [0, 0.11257, 0.028]
    origin_rpy: [1.57079, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "upper_arm"
    child_link: "lower_arm"
    position_limits: [-1.7453, 1.7453]
    velocity_limit: 4.5
    effort_limit: 5.0
    actuator_kind: "servo"
  - name: "wrist_flex"
    origin_xyz: [0, 0.0052, 0.1349]
    origin_rpy: [-1, 0, 0]
    axis_xyz: [1, 0, 0]
    joint_type: "revolute"
    parent_link: "lower_arm"
    child_link: "wrist"
    position_limits: [-1.7453, 1.7453]
    velocity_limit: 4.5
    effort_limit: 3.0
    actuator_kind: "servo"
  - name: "wrist_roll"
    joint_type: "revolute"
    parent_link: "wrist"
    child_link: "gripper_base"
    axis_xyz: [1.0, 0.0, 0.0]
    position_limits: [-3.1416, 3.1416]
    velocity_limit: 4.5
    effort_limit: 3.0
    actuator_kind: "servo"
  - name: "gripper"
    joint_type: "revolute"
    parent_link: "gripper_base"
    child_link: "gripper_finger"
    axis_xyz: [0.0, 0.0, 1.0]
    # NORMALISED jaw fraction — [0 = closed, 1 = open] — NOT the jaw's
    # mechanical radian range; see the sibling note in
    # `robots/so101_follower/robot.yaml` and issue #62. Matches the in-code
    # `SO100_DESCRIPTION` (`openral_hal.so100_follower`), which already
    # declared `(0.0, 1.0)`; this YAML had drifted because the
    # manifest↔HAL-constant guard skips SO-100.
    position_limits: [0.0, 1.0]
    velocity_limit: 4.5
    effort_limit: 1.5
    actuator_kind: "servo"
    role: "gripper"

end_effectors:
  - name: "gripper"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 5.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.32

# SO-100 ships with optional USB cameras. The defaults here mirror the
# convention used by the lerobot SO-100 dataset (``camera1`` = overhead/top,
# ``camera2`` = wrist). For the smoketest digital twin no real images
# are produced — the VLA runs against zero tensors.
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 30.0
    # Per the sim camera-placement convention — sim placement for the overhead camera. The generic HAL camera
    # rig splices this `top` camera into the bare SO-100 MJCF for `deploy sim`
    # (the upstream `so_arm100` arm ships zero cameras, issue #88), world-fixed
    # above the arm's workspace looking down. Poses are in metres relative to the
    # arm base at the MJCF origin (the bare twin is NOT re-anchored).
    sim_placement:
      pos: [0.0, -0.22, 0.60]
      target: [0.0, -0.22, 0.0]
    intrinsics:
      width: 256
      height: 256
      fx: 192.0
      fy: 192.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "generic_usb"
    model: "so100_top"
  - name: "wrist"
    modality: "rgb"
    # The wrist camera is bolted to the gripper body (it rolls with wrist_roll);
    # its own optical frame is `wrist_camera`, parented to the `gripper` URDF
    # link. `wrist_roll` is a joint, not a tf frame; `wrist` is the arm link and
    # must not be reused as the camera frame (it would gain a second parent).
    frame_id: "wrist_camera"
    parent_frame: "gripper"
    rate_hz: 30.0
    # Per the sim camera-placement convention — sim placement for the wrist camera. The rig parents it to the
    # SO-100 MJCF `Fixed_Jaw` body (the roll-mounted end body, the SO-100
    # equivalent of the SO-101 `gripper` body), pose in that body's local frame
    # (local +X = world-down, fingers along local -Y), looking forward-down the
    # approach axis at the workspace.
    sim_placement:
      parent_body: "Fixed_Jaw"
      pos: [0.0, -0.05, -0.07]
      target: [0.10, -0.20, 0.01]
    intrinsics:
      width: 256
      height: 256
      fx: 192.0
      fy: 192.0
      cx: 128.0
      cy: 128.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    catalog_id: "generic/usb_uvc_rgb"
    vendor: "generic_usb"
    model: "so100_wrist"

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
    - "gripper_position"
  supported_vla_embodiments: ["so100_follower"]
  # ``manipulator`` is already declared in ``embodiment_kind`` above and is
  # intentionally omitted here.
  embodiment_tags:
    - "so100_follower"
    - "lerobot"

safety:
  workspace_box_min_xyz: [-0.4, -0.4, 0.0]
  workspace_box_max_xyz: [0.4, 0.4, 0.6]
  max_ee_speed_m_s: 0.5
  max_ee_accel_m_s2: 2.0
  max_joint_speed_factor: 0.7
  max_force_n: 10.0
  max_torque_nm: 3.0
  deadman_required: true
  # provisional: former schema default, not measured on this rig — see issue #303
  self_collision_margin_m: 0.0
  # Runner ramp to a skill's starting_pose — the runner's former defaults,
  # declared here so they are visible; provisional until run on this rig.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). provisional: SO100FollowerHAL's former constructor default,
  # not measured on this rig — measure with
  # tools/joint_state_staleness_probe.py --robot <this manifest>.
  joint_state_staleness_limit_s: 0.5
  contact_force_threshold_n: 5.0

sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# sim: null → derive MujocoArmHAL.from_description from the `sim:` block below.
hal:
  sim: null
  real: "openral_hal.so100_follower:SO100FollowerHAL"
  # Real-HAL construction defaults threaded by build_hal so the
  # manifest-driven lifecycle node needs no bespoke `port` ROS parameter.
  parameters:
    defaults:
      port: "/dev/ttyUSB0"
      calibrate_on_connect: false

# MuJoCo wiring consumed by ``openral_hal.MujocoArmHAL.from_description``.
# Source: ``trs_so_arm100/so_arm100.xml`` in mujoco_menagerie (vendored via
# ``robot_descriptions``). The Jaw joint is revolute and its closed
# position is non-zero (-0.174 rad), so gripper.read_mode is
# ``affine_low_high``.
sim:
  grippers:
    - joint: "gripper"
      ctrl_range: [-0.174, 1.75]
      qpos_addrs: [5]
      qpos_scale: 1.924  # 1.75 - (-0.174); kept for symmetry, unused in affine mode
      read_mode: "affine_low_high"

observation_spec:
  state_key: "observation.state"
  state_shape: [6]
  state_representation: "joint_positions"

action_spec:
  dim: 6
  representation: "joint_positions"
  control_freq_hz: 30.0


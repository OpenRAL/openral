# RobotDescription — Hugging Face SO-101 follower (real + sim).
#
# Hardware revision of the SO-100: identical 6-DoF kinematic chain (5 servo
# joints + 1-DoF jaw, Feetech STS3215 over USB serial), updated mechanical
# design/calibration. Same lerobot SDK driver (SO100DigitalTwin / Feetech
# serial backend); only the Onshape-derived MJCF mesh set differs.
#
# Kinematics from the public SO-101 MJCF (`robot_descriptions` /
# `TheRobotStudio/SO-ARM100/Simulation/SO101`, `new_calib` variant). Arm
# `position_limits` are radians (URDF-native), despite lerobot's SDK exposing
# degrees. Gripper is the exception: normalised [0, 1] jaw fraction, limits
# `[0.0, 1.0]` (issue #62).
#
# Joint order = kinematic chain order (shoulder_pan -> shoulder_lift ->
# elbow_flex -> wrist_flex -> wrist_roll -> gripper), matching the MJCF's
# <position> actuators ("1".."6") and hinge joints (sim_joint_name "1".."6").
# `MujocoArmHAL._sim_kwargs_for` maps manifest-to-MJCF by INDEX; SimAttachedHAL
# reads live state by sim_joint_name, so deploy-sim matches direct `openral sim run`.

name: "so101_follower"
embodiment_kind: "manipulator"

base_frame: "base"
# URDF for the offline collision-lowering tool (geometry + joint FK).
# robot_descriptions ships a real URDF for the SO-ARM101. No SRDF with matching
# link names, so the ACM uses the conservative sampling fallback.
# Unified asset block (URDF / MJCF).
assets:
  urdf:
    ref: "file:so101_follower.urdf"
  mjcf: "rd:so_arm101_mj_description"

joints:
  - name: "shoulder_pan"
    sim_joint_name: "1"
    origin_xyz: [0.0207909, -0.0230745, 0.0948817]
    origin_rpy: [-3.14159, 0, 1.5708]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "base"
    child_link: "shoulder"
    position_limits: [-1.9199, 1.9199]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
  - name: "shoulder_lift"
    sim_joint_name: "2"
    origin_xyz: [-0.0303992, -0.0182778, -0.0542]
    origin_rpy: [1.5707927, -1.5707927, 3.1415927]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "shoulder"
    child_link: "upper_arm"
    position_limits: [-1.7453, 1.7453]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
  - name: "elbow_flex"
    sim_joint_name: "3"
    origin_xyz: [-0.11257, -0.028, 0]
    origin_rpy: [0, 0, 1.5708]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "upper_arm"
    child_link: "lower_arm"
    position_limits: [-1.7453, 1.5708]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
  - name: "wrist_flex"
    sim_joint_name: "4"
    origin_xyz: [-0.1349, 0.0052, 0]
    origin_rpy: [0, 0, -1.5708]
    axis_xyz: [0, 0, 1]
    joint_type: "revolute"
    parent_link: "lower_arm"
    child_link: "wrist"
    position_limits: [-1.6581, 1.6581]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
  - name: "wrist_roll"
    sim_joint_name: "5"
    # The URDF `wrist_roll` joint origin (wrist -> gripper). It was left at the
    # zero default while the gripper link carried no collision primitive, which
    # put the kernel's `gripper` frame at the wrist frame's origin.
    origin_xyz: [0.0, -0.0611, 0.0181]
    origin_rpy: [1.5708, -9.38083e-08, 3.14159]
    joint_type: "revolute"
    parent_link: "wrist"
    child_link: "gripper"
    axis_xyz: [0.0, 0.0, 1.0]
    position_limits: [-2.7925, 2.7925]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
  - name: "gripper"
    sim_joint_name: "6"
    joint_type: "revolute"
    parent_link: "gripper"
    # `moving_jaw` is a LOGICAL link (the URDF's is `jaw`), like franka_panda's
    # `panda_finger_pair`: the kernel would pose a child of this joint at the
    # [0, 1] fraction read as radians, and the fraction -> jaw-angle map differs
    # per backend (MuJoCo: -0.1745 + 1.9199 f, Isaac: 1.7453 f, real: the
    # servo calibration). It carries no primitive; the jaw's swept envelope over
    # its whole URDF travel is a primitive of `gripper` instead (see
    # `collision_geometry`).
    child_link: "moving_jaw"
    axis_xyz: [0.0, 0.0, 1.0]
    # NORMALISED jaw fraction — [0 = closed, 1 = open] — NOT the jaw's
    # mechanical radian range. `position_limits` is the unit of the value that
    # travels on this channel (the safety kernel's envelope, the runner's
    # pre-clamp and the supervisor's gripper_min/max all read it as such), and
    # the SO-ARM HAL contract puts a [0, 1] fraction here
    # (`MujocoArmHAL._gripper_command_to_raw`, `SO100FollowerHAL`). The jaw's
    # mechanical range lives in `sim.grippers[].ctrl_range` below and in the
    # URDF, which is where the [-0.1745, 1.7453] rad span belongs. Declaring
    # radians here left the envelope not constraining the channel at all — a
    # malformed 1.5 fraction cleared the check and reached the HAL (issue #62).
    position_limits: [0.0, 1.0]
    velocity_limit: 4.5
    effort_limit: 3.35
    actuator_kind: "servo"
    # Per the gripper/task-space joint-role convention, tag the gripper joint
    # (was role: unknown) so the runner / dataset bridge identify it structurally,
    # matching so100_follower. The
    # gripper is one of the 6 enumerated joints (not a separate channel).
    role: "gripper"

end_effectors:
  - name: "gripper"
    command_convention: "normalized_open_unit"
    kind: "parallel_gripper"
    hand: "right"
    n_dof: 1
    max_grip_force_n: 5.0
    max_payload_kg: 0.5
    workspace_radius_m: 0.32

# SO-101 ships with optional USB cameras. ``top`` mirrors the
# overhead third-person view used by the lerobot SO-101 datasets;
# ``wrist`` is the wrist-mounted view on the gripper body. The
# ``so101_box`` sim scene routes the in-scene OAK-D Pro overhead
# stream into ``observation.images.camera1`` and the MJCF wrist
# camera into ``observation.images.camera2`` (the ``vla_feature_key``
# values stay camera1/2 since they are checkpoint-frozen per the canonical
# HAL-facing sensor-naming convention).
sensors:
  - name: "top"
    modality: "rgb"
    frame_id: "world"
    rate_hz: 30.0
    # Per the sim camera-placement convention — sim placement for the overhead OAK-D Pro. The generic HAL
    # camera rig splices this `top` camera into the bare SO-101 MJCF for
    # `deploy sim` (the upstream arm ships zero cameras, issue #88), world-fixed
    # above the arm's workspace looking straight down. Poses are in metres
    # relative to the arm base at the MJCF origin (the bare twin is NOT
    # re-anchored). The `so101_box` sim-run scene renders its own `oak_top`
    # camera and ignores this block.
    sim_placement:
      pos: [0.0, -0.15, 0.70]
      target: [0.0, -0.15, 0.0]
    intrinsics:
      width: 640
      height: 480
      fx: 480.0
      fy: 480.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera1"
    vendor: "luxonis"
    model: "oak_d_pro"
    # Real-hardware binding: per host, in robots/so101_follower/units/<unit>.yaml.
  - name: "wrist"
    modality: "rgb"
    # The wrist camera is bolted to the terminal gripper body; its own optical
    # frame is `wrist_camera`, parented to the `gripper` URDF link. `wrist_roll` is a joint,
    # not a tf frame; `wrist` is the arm link and must not be reused as the
    # camera frame (it would gain a second parent).
    frame_id: "wrist_camera"
    parent_frame: "gripper"
    rate_hz: 30.0
    # Per the sim camera-placement convention — sim placement for the wrist camera, matching the real lerobot
    # SO-101 phone-on-bracket rig (Cornito/so101_test2): mounted on the static
    # finger face (~60 mm out along the face normal + ~35 mm toward the
    # fingertips) and rolled 180° (`up: [0, 0, -1]`, the phone is inverted) so
    # the open jaws hang into the bottom ~20% of the frame and the workspace +
    # grasped object fill the rest. fovy 90 ≈ the wide phone lens.
    sim_placement:
      parent_body: "gripper"
      pos: [-0.0084, 0.0834, -0.0545]
      target: [-0.0074, -0.091, -0.1886]
      up: [0.0, 0.0, -1.0]
      fovy_deg: 90.0
    # 640x480 is MEASURED (`v4l2-ctl --get-fmt-video` on the icSpring rig: 640/480
    # MJPG; the deploy_binding below requests the same) — the previous
    # 256x256 entry was fictional. Load-bearing twice: `rSkill.check_sensors`
    # gates min_width/min_height against these intrinsics
    # (openral_rskill/loader.py `_check_resolution`), and
    # `SensorRosPublisher._publish_camera_info` takes width/height from the
    # frame but fx/fy/cx/cy from here — a stale value mis-gates compatibility
    # AND desyncs CameraInfo. Focal lengths are NOMINAL not calibrated (fx=fy,
    # centred, scaled to preserve the old horizontal FOV 2*atan(128/192)=67.4deg
    # -> fx=480); run a real checkerboard calibration before this feeds
    # cuVSLAM/nvblox/object-lift. `sim_placement.fovy_deg: 90` implies a wider
    # lens than these intrinsics — pre-existing disagreement, left alone.
    intrinsics:
      width: 640
      height: 480
      fx: 480.0
      fy: 480.0
      cx: 320.0
      cy: 240.0
    encoding: "rgb8"
    vla_feature_key: "observation.images.camera2"
    catalog_id: "generic/usb_uvc_rgb"
    vendor: "generic_usb"
    model: "so101_wrist"
    # Real-hardware binding: per host, in robots/so101_follower/units/<unit>.yaml.

capabilities:
  locomotion: ["none"]
  can_lift_kg: 0.5
  has_dexterous_hands: false
  has_tactile: false
  has_force_control: false
  has_vision: true
  has_lidar: false
  has_audio: false
  bimanual: false
  supported_control_modes:
    - "joint_position"
    - "gripper_position"
  supported_vla_embodiments: ["so101_follower"]
  embodiment_tags:
    - "so101_follower"
    - "lerobot"

safety:
  workspace_box_min_xyz: [-0.4, -0.4, 0.0]
  workspace_box_max_xyz: [0.4, 0.4, 0.6]
  max_ee_speed_m_s: 0.5
  max_ee_accel_m_s2: 2.0
  max_joint_speed_factor: 0.7
  max_force_n: 10.0
  max_torque_nm: 3.35
  deadman_required: true
  contact_force_threshold_n: 5.0
  # Per the SO-101 negative self-collision-margin safety exception — the SO-101 operates in light SELF-CONTACT across the pen VLA's
  # compact folded envelope: the true (fcl non-convex) link clearance is ≈ 0
  # everywhere the arm works, so a geometric self-collision check cannot cleanly
  # separate safe grazing from harmful pressing — the *real* self-contact
  # protection is the force/torque limits above (max_torque_nm / max_force_n /
  # contact_force_threshold_n). This negative margin lets the OBB self-check pass
  # the VLA's operating envelope (kernel box distance −0.02…−0.05 there, verified
  # offline) with headroom, while gross over-folds (elbow ≳ 125°, far outside the
  # VLA distribution) and — importantly — WORLD/voxel collisions (arm vs
  # table/objects, where clearances are real and positive) are unaffected and
  # still E-stop. Safety-WG sign-off required (hazard-log). Do NOT enlarge without
  # re-running the envelope sweep; the world/self split is deliberate.
  self_collision_margin_m: -0.06
  # Runner ramp to a skill's starting_pose — the runner's former defaults,
  # declared here so they are visible; provisional until run on this rig.
  starting_pose_max_joint_speed_rad_s: 0.5
  starting_pose_tolerance_rad: 0.05
  # Joint-state freshness window: the real HAL's read_state and the skill
  # runner's blocking waits refuse state older than this (one place; build_hal
  # and deploy_e2e.launch.py read it). provisional: SO100FollowerHAL's former constructor default,
  # not measured on this rig — measure with
  # tools/joint_state_staleness_probe.py --robot <this manifest>.
  joint_state_staleness_limit_s: 0.5

sdk_kind: "open"
# Explicit sim/real HAL entrypoints (resolved by openral_hal.build_hal).
# sim: null → derive MujocoArmHAL.from_description from the `sim:` block below.
# real: the SO-101 reuses the SO-100 lerobot Feetech follower verbatim.
hal:
  sim: null
  real: "openral_hal.so100_follower:SO100FollowerHAL"
  # Real-HAL construction defaults threaded by build_hal so the
  # manifest-driven lifecycle node needs no bespoke `port` ROS parameter.
  parameters:
    defaults:
      port: "/dev/ttyUSB0"
      calibrate_on_connect: false

# MuJoCo wiring consumed by ``MujocoArmHAL.from_description``.
# Source: ``Simulation/SO101/so101_new_calib.xml`` in
# ``TheRobotStudio/SO-ARM100`` (vendored via ``robot_descriptions``).
# The jaw joint range is ``[-0.17453293, 1.74532925]`` (radians, the
# MJCF ``jnt_range`` at full precision — a hand-rounded copy here put the
# deploy tier's gripper affine 0.002 lerobot units off the sim tier's,
# which reads the range straight from the MJCF) and its
# closed position is non-zero, so ``gripper.read_mode`` is
# ``affine_low_high`` (same as SO-100). The qpos slot for the jaw is
# index 5 (sixth joint in the kinematic chain).
sim:
  grippers:
    - joint: "gripper"
      ctrl_range: [-0.17453293, 1.74532925]
      qpos_addrs: [5]
      qpos_scale: 1.91986218  # hi - lo; kept for symmetry, unused in affine mode
      read_mode: "affine_low_high"

observation_spec:
  state_key: "observation.state"
  state_shape: [6]
  state_representation: "joint_positions"

action_spec:
  dim: 6
  representation: "joint_positions"
  control_freq_hz: 30.0

# Hand-authored OBB (box) collision model, part of the SO-101 negative
# self-collision-margin safety exception (issue #84). Boxes not capsules: the
# SO-101's rectangular 3D-printed brackets make a capsule's circular
# cross-section over-report clearance by ~7-9 cm at the arm's compact folded
# poses, false-E-stopping valid poses; boxes (PCA-fit, tight per link) cut that
# to ~1-4 cm (verified vs an fcl non-convex mesh oracle). half_extents +
# origin_xyz_rpy are the link-frame mesh OBB. True self-clearance in the VLA
# envelope is ~0 (grazing contact by design) — handled by a small negative
# self_collision_margin below, NOT by disabling any pair. Follow-up: teach
# `openral collision lower` to emit OBBs for blocky links, for regenerability.
#
# The gripper body and the jaw (2026-10-16): the five arm boxes left `gripper`
# and `jaw` without a primitive, so the octomap self-filter (which removes only
# what the model covers) left the gripper's own depth returns in the world map,
# and a LeIsaac PickOrange deploy-sim stopped on `wrist` vs a voxel ON the gripper
# body (PhysX: 0 penetration). `gripper` now carries two box + exact hull
# entries: its own meshes, and the jaw's meshes swept over the jaw's whole URDF
# travel (rigid on `gripper`; see the `gripper` joint for why the jaw cannot be
# posed from the fraction). The one ACM row the tool adds is the adjacent
# [gripper, wrist]. NEEDS Safety-WG review and a hazard-log row (CLAUDE.md §3)
# before it is relied on.
collision_geometry:
  - link_name: "base"
    shape: { shape: "box", half_extents_m: [0.0555, 0.0478, 0.0360] }
    origin_xyz_rpy: [0.0208, -0.0011, 0.0661, 0.0, 0.0, 0.0]
  # Shoulder (2026-10-16): box + exact hull of the URDF `shoulder` meshes, the
  # `--tight-link shoulder` fit, replacing the hand PCA box [0.0605, 0.0304, 0.0361],
  # whose bottom hung to z = 0.029 in the base frame, 1 mm below the mounting surface
  # (the mesh bottoms at 0.0487): two LeIsaac PickOrange deploy-sim stops on the
  # counter beside the base, PhysX 0 penetration. Mesh inside the hull to 1 nm.
  # Less conservative than the box: NEEDS Safety-WG review and a hazard-log row.
  - link_name: "shoulder"
    shape: { shape: "box", half_extents_m: [0.0286, 0.0324, 0.0564] }
    origin_xyz_rpy: [-0.0192, 0.0012, -0.0091, 3.1416, 0.0000, -1.5708]
    tight_geometry:
      dop_lo_m: [-0.027502854, -0.031401189, -0.055300168, -0.051059697, -0.038753252, -0.05126299, -0.051685379, -0.024884725, -0.03644096, -0.04896936, -0.050927329, -0.060056903, -0.037830497]

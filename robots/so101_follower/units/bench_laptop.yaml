# SO-101 laptop bench host (scenes/deploy/so101_bench.yaml). Per-host camera bindings,
# moved out of robot.yaml so a second SO-101 host adds its own units/<unit>.yaml instead
# of editing the shared manifest. Use kernel-stable /dev/v4l/* symlinks, never raw
# /dev/videoN; retune with `ls -l /dev/v4l/by-id /dev/v4l/by-path` or
# `openral detect --deployment`. Selected by the scene's `robot_unit` or $OPENRAL_ROBOT_UNIT.
schema_version: "0.1"
robot_id: so101_follower
unit: bench_laptop
sensors:
  - name: top
    deploy_binding:
      backend: opencv_thread
      backend_params:
        # by-path: the USB port this host's top camera is plugged into.
        device: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:11:1.0-video-index0
        width: 640
        height: 480
        fps: 30
  - name: wrist
    deploy_binding:
      backend: opencv_thread
      backend_params:
        device: /dev/v4l/by-id/usb-icSpring_icspring_camera_20240307110322-video-index0
        width: 640
        height: 480
        fps: 30
# This unit's jaw: the `gripper` fraction f -> the URDF value u the `jaw` mimic reads
# (jaw = 1.74533 u rad, robot.yaml `mimic_joints`). lerobot's 0..100 gripper spans this
# unit's calibrated servo range (scenes/deploy/calibration/so_follower.json: range_min
# 2045 = jaw closed, the homing pose; range_max 3515), i.e. 1470 ticks = 2.2550 rad of
# jaw travel, from closed at the URDF's lower limit (-0.174533 rad, where the meshes'
# fingertips meet): jaw = -0.174533 + 2.25495 f. Without it /tf (the dashboard's 3D
# model) and the kernel posed the real jaw by Isaac's 1.74533 f: ~10 deg open when
# closed, ~19 deg short when open. Recalibrated the gripper? Recompute from its range.
gripper_joint_curve:
  gripper: [[0.0, -0.1], [1.0, 1.19199]]
# This unit's wrist roll: lerobot's calibration puts its zero (the middle of the
# calibrated range, the pose held while calibrating) a quarter turn from the URDF's
# zero, so /tf (the dashboard's 3D model) and the kernel showed the whole gripper
# rolled 90 degrees. An offset is a two-point curve of slope 1 over the joint's range
# (robot.yaml position_limits +-2.7925): urdf = value + pi/2. Seen from the gripper's
# tip, a positive URDF roll turns it clockwise (the axis points from the tip to the
# wrist). Recalibrated the wrist roll? Re-check this against the real arm.
joint_curve:
  wrist_roll: [[-2.7925, -1.2217037], [2.7925, 4.3632963]]

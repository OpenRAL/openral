# rSkill manifest — OpenRAL packaging format V1 (CLAUDE.md §6.4)
# Wraps: OpenRAL/lingbot-vla-v2-6b-nf4 (NF4 pre-quantized mirror of
#        robbyant/lingbot-vla-v2-6b, Apache-2.0 code + weights)
# Source: github.com/robbyant/lingbot-vla-v2 @ 69729b4
# Paper:  "From Foundation to Application: Improving VLA Models in Practice"
#         (huggingface.co/papers/2607.06403)
#
# Robbyant LingBot-VLA 2.0: 6.38B Qwen3-VL-4B backbone with a sparse-MoE
# flow-matching action expert (10 denoising steps), trained for dual-arm
# manipulation on RoboTwin/AgileX "Cobot Magic". Routed via the out-of-process
# `lingbot_vla2` adapter (openral_sim.policies.lingbot_vla2): upstream
# `lingbotvla` pins torch==2.8.0/transformers==4.57.3 + custom Triton MoE
# kernels (incompatible with openral transformers>=5, CLAUDE.md §3), so it
# runs in an auto-provisioned Python 3.12 + torch-2.9.1 ZMQ sidecar
# (tools/lingbot_vla2_sidecar.py + tools/_lingbot_vla2_server.py); the boot
# helper overrides upstream's torch 2.8.0/triton 3.4.0 which publish no
# linux-aarch64 wheels (docs/reference/aarch64-support.md).
#
# Contract (verified against upstream configs/vla/robotwin/robotwin.yaml +
# assets/norm_stats/robotwin.json): 3 cameras
# cam_high/cam_left_wrist/cam_right_wrist (HWC uint8, resized to 256x256
# server-side); observation.state 14-D [arm_l(6) grip_l(1) arm_r(6) grip_r(1)];
# action 14-D/step (arm.position 12 + effector.position 2); chunk_size 50,
# upstream RoboTwin deploy replays 25 (`--use_length 25`).
#
# Camera-name mapping: aloha_agilex RobotDescription declares three sensors
# top/wrist_left/wrist_right with frozen vla_feature_keys camera1/2/3 (so the
# compat check resolves against those). Runtime wiring is handled by the
# adapter, NOT a lerobot rename_map: it aligns the scene's first three camera
# keys positionally onto cam_high -> cam_left_wrist -> cam_right_wrist. No
# `image_preprocessing.aliases` block needed.

# ── Identity ───────────────────────────────────────────────────────────────
schema_version: "0.1"
name: "OpenRAL/rskill-lingbot_vla2-aloha_agilex-robotwin-nf4"
version: "0.1.0"
license: "apache-2.0"
role: "s1"
kind: "vla"  # learnable Vision-Language-Action policy

# ── Policy identity ────────────────────────────────────────────────────────
model_family: "lingbot_vla2"

# ── Compatibility contract ─────────────────────────────────────────────────
# RoboTwin 2.0 dual-arm embodiment: AgileX Cobot Magic (robots/aloha_agilex).
embodiment_tags:
  - "aloha_agilex"

# Three RGB streams. Keyed on the aloha_agilex frozen vla_feature_keys
# camera1 / camera2 / camera3 so the loader's compatibility check resolves; the
# adapter re-keys the scene cameras onto the model's cam_high / cam_left_wrist /
# cam_right_wrist positionally at runtime.
sensors_required:
  - modality: "rgb"
    vla_feature_key: "observation.images.camera1"
    min_width: 256
    min_height: 256
  - modality: "rgb"
    vla_feature_key: "observation.images.camera2"
    min_width: 256
    min_height: 256
  - modality: "rgb"
    vla_feature_key: "observation.images.camera3"
    min_width: 256
    min_height: 256

# Output side. 14-DoF dual-arm command. For aloha_agilex the loader auto-fills
# n_dof (14) + vla_action_key from robots/aloha_agilex/robot.yaml.
actuators_required:
  - kind: "joint_position"
    control_mode_semantics:
      mode: "absolute"

# ── Runtime / weights ──────────────────────────────────────────────────────
runtime: "pytorch"
quantization:
  # `int4` is the OpenRAL QuantizationDtype enum value that matches the sidecar's
  # bitsandbytes NF4 scheme (nf4 + compute_dtype bf16), applied to the Qwen3-VL
  # backbone only; the MoE action expert stays bf16. The pack is applied AT LOAD:
  # `weights_uri` points at the fp32 upstream and the sidecar's
  # `_nf4_backbone_in_place` quantizes the backbone during the build, the path
  # `_detect_prequantized` falls back to when a checkpoint carries no
  # `quantization_metadata.json` sentinel (costs the 25.5 GB read + a ~30 s pack).
  # NF4 is CUDA-only; a CPU/bf16 or ≥16 GB-card bf16 load is the
  # `--quantization none` path over the same upstream weights.
  dtype: "int4"
  backend: "pytorch"
# Informational VRAM ceilings, used by `openral rskill check` / `openral doctor`.
# fp32 / bf16 are the on-disk / bf16-cast footprints; int4 is MEASURED live on an
# RTX 4070 Laptop (8 GB): 6.79 GB resident weights, 6.97 GB peak during inference
# (NF4 backbone + bf16 expert, sdpa, 10 denoising steps). 7.0 is the rounded ceiling.
min_vram_gb:
  fp32: 25.5
  bf16: 12.8
  int4: 7.0
# The fp32 upstream foundation checkpoint (25.5 GB, 6 shards), NF4-packed on-line by
# the sidecar at load. This previously pointed at an OpenRAL prequant mirror (~6.8 GB)
# that was never published, so every load 404'd. The mirror is worth republishing for
# the smaller download and the skipped per-boot pack -- repoint here when it exists.
# Unpinned, like every other third-party upstream in this tree.
weights_uri: "hf://robbyant/lingbot-vla-v2-6b"

# ── Preprocessing ──────────────────────────────────────────────────────────
# No `processors` block: LingBot-VLA 2.0 is not a lerobot PolicyProcessorPipeline
# family (smolvla / pi05 / xvla / diffusion / rldx). Normalization ships inside
# the upstream repo at assets/norm_stats/robotwin.json and is applied server-side
# by the model's FeatureTransform, so there is nothing to download here.
state_contract:
  dim: 14

# ── Execution semantics ────────────────────────────────────────────────────
# chunk_size=50 predicted; the adapter replays 25 steps before re-inferring,
# mirroring the upstream RoboTwin deploy (`--use_length 25`).
chunk_size: 50
n_action_steps: 25
latency_budget:
  # MEASURED per full 50-step chunk inference on an RTX 4070 Laptop (8 GB), NF4
  # backbone + bf16 expert, sdpa, 10 denoising steps: mean 804 ms / median 746 ms
  # / p95 976 ms / max 1110 ms over 10 steady calls (cold first call ~1650 ms).
  # 1500 ms is p95 + margin above the observed max. The paper reports ~130 ms on
  # a 4090D reference; the gap is NF4 + no flash-attn + a laptop GPU.
  per_chunk_ms: 1500.0

# ── Provenance ─────────────────────────────────────────────────────────────
# GM-100 paper numbers (agilex 34.4% / galaxea 15.6% success) are paper-cited,
# NOT reproduced locally — see README. eval/ is empty (.gitkeep): a full RoboTwin
# sim eval is infeasible on the 8 GB reference GPU (6.9 GB NF4 model + 1.9 GB
# SAPIEN = 8.8 GB > 8 GB, no CPU render), so `openral benchmark run --suite
# robotwin` populates it on a ≥12 GB card. The model path is verified live (README
# "Verified performance" + tests/sim/test_aloha_agilex_lingbot_vla2_robotwin.py).
paper_url: "https://huggingface.co/papers/2607.06403"
source_repo: "hf://robbyant/lingbot-vla-v2-6b"

description: >
  LingBot-VLA 2.0 (6.38 B, Qwen3-VL-4B backbone + sparse-MoE flow-matching
  action expert) for dual-arm manipulation on the RoboTwin 2.0 / AgileX
  Cobot Magic embodiment. Predicts 50-step action chunks from three RGB views
  (head + per-wrist) driving a 14-DoF dual-arm joint command (25-step
  replay). Runs in a torch-2.9 ZMQ sidecar; NF4 backbone
  quantization targets 8 GB GPUs. NOTE: pre-trained FOUNDATION checkpoint —
  zero-shot actions collapse to the distribution mean; post-train on
  RoboTwin first.

# ── Task-data gate ─────────────────────────────────────────────────────────
# RoboTwin dual-arm generalist; declaring `robotwin` makes the benchmark runner
# accept all `robotwin/<task>` scenes (family match) and refuse non-RoboTwin ones.
evaluated_tasks: ["robotwin"]

# ── Action vocabulary ──────────────────────────────────────────────────────
# GENERALIST marks the multi-task foundation checkpoint; the specific verbs
# cover the RoboTwin dual-arm task families (pick-place / handover / pouring).
actions:
  - "generalist"
  - "pick"
  - "place"
  - "transfer"
  - "pour"
objects:
  - "block"
  - "bottle"
  - "cup"
  - "bowl"
scenes:
  - "tabletop"

# ── Per-checkpoint action contract ─────────────────────────────────────────
action_contract:
  dim: 14
  # RoboTwin / AgileX aloha-agilex emits absolute joint positions
  # (2×(6 arm + 1 gripper)).
  representation: "joint_positions"
  # EXPLICIT joint units — the RoboTwin aloha-agilex arms record in RADIANS
  # (same rationale as smolvla-robotwin: continuous joints wrap past π, so the
  # >5.0 peak would otherwise trip the degrees-vs-radians heuristic and corrupt
  # every command with a ÷π/180 scaling). Channels 6/13 are the 0–1 grippers.
  joint_units: "radians"

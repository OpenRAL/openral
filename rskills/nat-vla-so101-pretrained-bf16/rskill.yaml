# rSkill manifest — OpenRAL packaging format V1 (CLAUDE.md §3 rSkill packaging)
# Wraps: ahad-j/nat-vla-450m — NaT VLA (LFM2-VL-450M writing NAT action tokens),
#        the multi-robot PRETRAINED checkpoint (DROID, Bridge, RT-1, BC-Z, Franka,
#        bimanual YAM and SO-100/101 data). Not fine-tuned on any OpenRAL task:
#        this skill runs it zero-shot on the SO-ARM it saw in pretraining.
# Code:  lerobot `nat_vla` (huggingface/lerobot#5416, Apache-2.0); lerobot 0.7.0
#        predates it, so openral_sim.policies._nat_vla vendors it at the merge commit.
# Paper: "NAT: Scaling Causal Neural Action Tokenizers Across Embodiments"
#        (https://ahadjawaid.com/nat-paper).
#
# LICENSE: weights are a derivative of LiquidAI LFM2-VL-450M under the LFM Open
# License v1.0 — commercial use only for organizations under $10M annual revenue.
# Posture `lfm1.0` is not commercial-allowed: a commercial deploy needs
# OPENRAL_ALLOW_NONCOMMERCIAL=1 (logged).
#
# The pretrained config carries no features and no normalisation stats, so this
# manifest supplies them: 2 cameras (fixed overview + wrist), the 6-D SO-ARM
# state/action in LeRobot servo degrees (gripper 0-100), the pretraining's pooled
# SO-ARM stats (MolmoAct2 norm tag so100_so101_molmoact2, q01/q99) and the joint
# mapping from this robot's calibration convention to the mixture's
# (policy_extras below).

# ── Identity ───────────────────────────────────────────────────────────────
schema_version: "0.1"
name: "OpenRAL/rskill-nat_vla-so101-pretrained-bf16"
version: "0.1.0"
license: "lfm1.0"
role: "s1"
kind: "vla"

# ── Policy identity ────────────────────────────────────────────────────────
model_family: "nat_vla"

# ── Compatibility contract ─────────────────────────────────────────────────
embodiment_tags:
  - "so101_follower"
sensors_required:
  - modality: "rgb"
    vla_feature_key: "observation.images.camera1"
    min_width: 224
    min_height: 224
  - modality: "rgb"
    vla_feature_key: "observation.images.camera2"
    min_width: 224
    min_height: 224
actuators_required:
  - kind: "joint_position"
    control_mode_semantics:
      mode: "absolute"

# ── Runtime / weights ──────────────────────────────────────────────────────
runtime: "pytorch"
quantization:
  dtype: "bf16"
  backend: "pytorch"
# MEASURED on an RTX 5070 Laptop (2026-11-22, two 640x480 cameras): 1.14 GiB
# resident, 1.21 GiB peak.
min_vram_gb:
  bf16: 1.5
weights_uri: "hf://ahad-j/nat-vla-450m@a5c2e13d45832050e364265962f6ad536460e955"

# ── Preprocessing ──────────────────────────────────────────────────────────
# Slots camera1 (fixed overview) / camera2 (wrist) -> checkpoint image keys; the
# prompt lists the images in this order.
image_preprocessing:
  flip_180: false
  input_template: "observation.images.{cam}"
  aliases:
    camera1: "front"
    camera2: "wrist"
state_contract:
  dim: 6
policy_extras:
  # The setup / control-mode strings NaT's pretraining used for the SO-ARM.
  setup: "single so100/so101 robotic arm in molmoact2"
  control_mode: "absolute joint pose"
  # The stats the pretrained checkpoint saw. NaT VLA was pretrained with MolmoAct2's
  # data pipeline (NAT paper, arXiv 2611.28873, App. F), which normalises the SO-ARM
  # mixture's state and action by the pooled q01/q99 of this tag; the tag's setup_type
  # is the setup string above. (A single dataset's stats, e.g. makermods/eraser_place,
  # map the normalised poses onto the wrong joint angles: the backward swing and
  # shoulder_lift tracking-fault stops on the real arm, 2026-11-24.)
  norm_stats: "hf://allenai/MolmoAct2-SO100_101@152569fe57914d97be91055800035f54e250d009/norm_stats.json"
  norm_tag: "so100_so101_molmoact2"
  # Joint convention: model = scale * robot + offset, per state/action column
  # (shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper).
  # The mixture is mostly lerobot's OLD calibration convention: episodes start at
  # shoulder_lift 185-198 and elbow ~180 (Tank-123/so101_test, Yan1205/so100_test,
  # MolmoAct2's own sample state 189/181), pooled medians 123/124. This robot's
  # range-centred convention starts at -103/95 (makermods/eraser_place starts,
  # median over 25 episodes) and reaching RAISES shoulder_lift where the old
  # convention lowers it: shoulder_lift is sign-flipped. Offsets fitted on the
  # start poses and cross-checked on the medians (-37.4 -> 124.4, 36.3 -> 122.3);
  # URDF forward kinematics agrees on the signs. Estimates, about +/-5 deg.
  # Pan keeps its sign: +pan is clockwise seen from above in both (URDF axis points
  # down; Tank-123 overhead and Beegbrain/pick_lemon_and_drop_in_bowl top footage).
  # wrist_flex keeps its sign: d(wrist) ~ +d(lift) - d(elbow) in both conventions'
  # reaches once lift/elbow are mapped. wrist_roll's sign is unverified; gripper agrees.
  joint_affine:
    - [1.0, 0.0]
    - [-1.0, 87.0]
    - [1.0, 86.0]
    - [1.0, 0.0]
    - [1.0, 0.0]
    - [1.0, 0.0]

# ── Execution semantics ────────────────────────────────────────────────────
# 32-step chunks; 16 replayed (the tokenizer decodes the first 16 after 7 tokens).
chunk_size: 32
n_action_steps: 16
latency_budget:
  per_chunk_ms: 500.0

# ── Provenance ─────────────────────────────────────────────────────────────
paper_url: "https://ahadjawaid.com/nat-paper"
source_repo: "hf://ahad-j/nat-vla-450m"

description: >
  NaT VLA (450M, LiquidAI LFM2-VL-450M writing NAT action tokens) multi-robot
  pretrained checkpoint, run zero-shot on the SO-101 follower: 6-DoF absolute
  joint chunks (32, 16 replayed) in LeRobot servo degrees from a fixed overview
  and a wrist camera. Not fine-tuned on an OpenRAL task; LFM Open License v1.0
  weights (commercial use only under $10M revenue).

actions:
  - "generalist"
  - "pick"
  - "place"
objects: []
scenes:
  - "tabletop"

action_contract:
  dim: 6
  representation: "joint_positions"
  joint_units: "degrees"
  gripper_scale: 100.0

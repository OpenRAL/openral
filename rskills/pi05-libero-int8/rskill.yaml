# rSkill manifest — OpenRAL packaging format V1 (CLAUDE.md §6.4)
# Wraps: lerobot/pi05_libero_finetuned_v044 with int8 runtime packing.
# Base:  lerobot/pi05_base (Physical Intelligence π0.5)
#
# Why int8 (not NF4): bf16 π0.5 peaks at 8.06 GB of device memory, which does
# not fit an 8 GB consumer GPU once the driver takes its cut. NF4 4-bit fits
# but is *too lossy* for the 3.4 B π0.5 backbone — it destroys competence
# (0/5 on libero_spatial with NF4 4-bit). LLM.int8 (bitsandbytes Linear8bitLt
# on every Linear ≥4M elements) restores the policy AND fits, at 6.35 GB. The
# pi05 adapter loads the bf16 source, rewraps Linears to Linear8bitLt, then
# packs to int8 on the device move (accelerate-free meta-init fast path).
#
# ⚠️ int8 is a *memory* fit, not a free one. Measured on a GB10 — LIBERO-Spatial
# tasks 0/1/2, seed 42, max_steps 220, n=50 per task per arm (300 episodes
# total). Same episodes, same protocol; the only difference is
# quantization.dtype:
#
#            task 0    task 1    task 2    total
#     bf16     98%       94%       94%     143/150 = 95%   9.6 ms/step
#     int8     76%       22%       82%      93/150 = 62%  24.8 ms/step
#
# int8 costs ~33 points of task success overall (Fisher exact p=4e-13) *and*
# runs ~2.6x slower per step — LLM.int8's mixed-precision decomposition is
# slower than a plain bf16 GEMM.
#
# Read the per-task row, not just the total. bf16 is steady (98/94/94) while
# int8 swings 22–82%. The damage is **task-dependent**, so a single-task
# spot-check can easily land on 82% and look acceptable; task 1 is where this
# policy nearly stops working. That variance is the real hazard, more than the
# average.
#
# What int8 buys is 1.7 GB, and that is the whole reason it exists: on an 8 GB
# card bf16 will not load at all, and 62% beats not running. **On any host with
# ≳9 GB, prefer bf16** — no manifest edit needed, just `--vla-extra dtype=bf16`.
# With TensorRT an FP8 engine is better again: 78.9 ms/call vs bf16 eager's
# 190 ms, at bf16-identical task success (openral-pro, OPENRAL_PI05_TRT=1,
# OPENRAL_PI05_TRT_PRECISION=fp8_bf16_attn).
#
# The older "0.5–0.7 across 10-episode runs" figure is not wrong so much as
# unusable: at n=10 the binomial SD is ~0.16, wide enough to cover most of the
# spread above. eval/scene_libero_spatial.json still records that n=10 run.
#
# LICENSE WARNING (CLAUDE.md §7.4):
#   Code: Apache-2.0
#   Weights: Physical Intelligence "permissive research" license — NOT full Apache-2.0.
#   Commercial deployment is prohibited without a separate agreement with Physical Intelligence.
#   The OpenRAL loader derives is_commercial_use_allowed=False from
#   license=permissive_research; activating commercially still requires
#   OPENRAL_ALLOW_NONCOMMERCIAL=1 plus a vendor agreement.

# ── Identity ───────────────────────────────────────────────────────────────
schema_version: "0.1"
name: "OpenRAL/rskill-pi05-franka_panda-libero_spatial-int8"
evaluated_tasks: ["libero_spatial", "libero_object", "libero_goal", "libero_10"]  # trained on the full LIBERO set (all 4 suites, 40 tasks)
version: "0.1.0"
license: "permissive_research"   # non-standard; weights are NOT apache-2.0
role: "s1"
kind: "vla"  # rSkill kind discriminator. "vla" = learnable Vision-Language-Action policy.

# ── Policy identity ────────────────────────────────────────────────────────
model_family: "pi05"

# ── Compatibility contract ─────────────────────────────────────────────────
# LIBERO benchmark targets table-top manipulation with a Franka Panda arm.
embodiment_tags:
  - "franka_panda"

# π0.5 LIBERO consumes the same two-RGB-camera + 8-D state contract as
# smolvla_libero (LiberoEnv ``image`` and ``image2`` streams renamed to
# ``camera1`` / ``camera2`` by the stored preprocessor).
sensors_required:
  - modality: "rgb"
    vla_feature_key: "observation.images.camera1"
    min_width: 224
    min_height: 224
  - modality: "rgb"
    vla_feature_key: "observation.images.camera2"
    min_width: 224
    min_height: 224

# Output side. For the canonical franka_panda embodiment the
# loader auto-fills n_dof + vla_action_key from robots/franka_panda/robot.yaml.
actuators_required:
  - kind: "joint_position"
    control_mode_semantics:
      mode: "absolute"

# ── Runtime / weights ──────────────────────────────────────────────────────
runtime: "pytorch"
quantization:
  # ``int8`` selects the OpenRAL pi05 adapter's LLM.int8 path: load the bf16
  # source, rewrap every Linear ≥4M weight elements to bitsandbytes
  # ``Linear8bitLt`` (accelerate-free meta-init), then pack to int8 on the
  # ``.to(cuda)`` move. Unlike NF4 there is no prequantized pack —
  # quantization runs at startup from the bf16 checkpoint below.
  dtype: "int8"
  backend: "pytorch"
# Informational VRAM ceilings, used by `ral skill check` / `openral doctor`.
# CLAUDE.md §11 still forbids silent downcast — the actually-applied dtype
# stays pinned by quantization.dtype.
#
# These are **peak device memory for a full rollout**, measured on a GB10
# (torch `max_memory_reserved`, i.e. what the caching allocator took from the
# driver — the number that decides whether a load OOMs), not weight size:
#
#     int8    6.35 GB   (5.90 allocated)
#     bf16    8.06 GB   (7.91 allocated)
#     fp32   16.10 GB   (15.76 allocated)
#
# All three previous figures were **understated** — by 0.4, 1.1 and 2.1 GB
# respectively. The bf16 one is what made this manifest look self-contradictory:
# 7.0 reads as "fits an 8 GB card", while the header says bf16 OOMs there. The
# header is right. bf16 peaks at 8.06 GB and an 8 GB GPU has less than that free
# once the driver takes its cut; int8's 1.7 GB saving is what buys the headroom.
#
# Do not confuse these with **host** RSS during load, which reaches ~13 GiB
# while the checkpoint is materialized on CPU before the device move. That is
# host RAM, not VRAM, and it is the same order of magnitude for every dtype
# here — which is exactly how "~13.6 GiB peak" ended up being read as a bf16
# *VRAM* figure.
min_vram_gb:
  fp32: 16.1
  bf16: 8.1
  int8: 6.4
weights_uri: "hf://lerobot/pi05_libero_finetuned_v044"

# ── Preprocessing (all knobs needed to interpret IO) ───────────────────────
# Processors are self-hosted in the OpenRAL rSkill repo (published copies of the
# source checkpoint's processors), so the rSkill does not depend on the upstream
# lerobot/pi05_libero_finetuned_v044 repo to resolve them.
processors:
  preprocessor_uri: "hf://OpenRAL/rskill-pi05-franka_panda-libero_spatial-int8/policy_preprocessor.json"
  postprocessor_uri: "hf://OpenRAL/rskill-pi05-franka_panda-libero_spatial-int8/policy_postprocessor.json"
# The pi05 LIBERO finetune wants the default LIBERO image preprocessing
# (180° rotation + camera1/2 alias remap to image/image2) and the canonical
# LIBERO 8-D proprio state.
image_preprocessing:
  flip_180: true
  aliases:
    top: "image"
    wrist: "image2"
state_contract:
  # LIBERO checkpoints train on 8-D TASK-SPACE proprio
  # (eef_pos ‖ eef_axisangle ‖ gripper). `openral sim run` supplies it directly;
  # `openral deploy sim` assembles it from live TF + JointState via the
  # `libero_eef8d` state-adapter. Without the layout the runner falls back to raw
  # joint-space state and the policy never reaches the target. Shared verbatim
  # with smolvla-libero — same franka_panda LIBERO 8-D contract.
  layout: "libero_eef8d"
  dim: 8
  bindings:
    eef_frame: "panda_hand_tcp"       # robosuite grip site within ~6 mm
    world_frame: "world"              # HAL-published static world->base root
    gripper_qpos_joints:
      - "panda_gripper"               # single deploy gripper joint, mirrored to [v,-v]

# ── Execution semantics ────────────────────────────────────────────────────
chunk_size: 50
# Half-chunk replan — closed-loop replanning every 25 env steps.
n_action_steps: 25
latency_budget:
  per_chunk_ms: 200.0   # π0.5 (3B PaliGemma backbone) is heavier than SmolVLA

# ── Provenance ─────────────────────────────────────────────────────────────
# Headline benchmark dict is populated by `openral benchmark scene
# --write-eval --update-manifest` (see eval/scene_libero_spatial.json for the
# locally-reproduced result).

paper_url: "https://arxiv.org/abs/2410.24164"
source_repo: "hf://lerobot/pi05_libero_finetuned_v044"

description: >
  π0.5 (PaliGemma 3B + flow-matching) fine-tuned on LIBERO v0.44,
  LLM.int8-packed at load so 8 GB GPUs can run it at all — bf16 peaks at
  8.1 GB and will not load there. int8 is a memory fit, not a free one: over
  300 LIBERO-Spatial episodes it scores 62% vs bf16's 95%, task-dependent
  (22-82%), and is ~2.6x slower per step. With >9 GB prefer
  `--vla-extra dtype=bf16`, or openral-pro's TensorRT FP8; see the README. PI
  permissive-research weights: commercial use needs a vendor agreement.

# Action vocabulary surfaced to the reasoner LLM tool
# palette so it can pick this skill by what it does (action verb +
# object + scene), not just by its slug.
actions:
  - "pick"
  - "place"
  - "open"
  - "close"
objects:
  - "bowl"
  - "cup"
  - "drawer"
  - "object"
scenes:
  - "tabletop"
  - "kitchen"

# Per-checkpoint action contract (consumed by the dataset bridge
# to bind the LeRobot v3 `action` feature shape).
action_contract:
  cartesian_delta_scale: [0.05, 0.05, 0.05, 0.5, 0.5, 0.5]
  dim: 7
  # LIBERO action space is 6-D OSC end-effector delta + gripper.
  # Declaring the representation makes deploy-sim dispatch cartesian_delta +
  # gripper (via canonical_slots_for_representation) instead of defaulting the
  # whole vector to JOINT_POSITION, which the joint-space envelope rejects.
  representation: "delta_ee_6d_plus_gripper"

benchmarks:
  libero_spatial: 0.5

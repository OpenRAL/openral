schema_version: "0.1"
name: "OpenRAL/rskill-topreward_qwen3vl_4b-any-general-nf4"
version: "0.1.0"
# rSkill packaging is uniformly Apache-2.0. The TOPReward *method* is MIT and
# the wrapped Qwen3-VL-4B-Instruct *weights* are themselves Apache-2.0
# (Qwen/Qwen3-VL-4B-Instruct, license: apache-2.0), so redistributing a
# quantized copy is fully permitted — the whole stack is Apache-2.0 / MIT.
license: "apache-2.0"
role: "s2"
kind: "reward"

# Embodiment-agnostic: a reward monitor scores any rollout video + task
# instruction and is exempt from the rSkill<->robot embodiment gate.
embodiment_tags: ["any"]  # explicit embodiment-agnostic wildcard

# Consumes the same RGB camera stream the co-active VLA uses. No actuators.
sensors_required:
  - modality: "rgb"
    min_width: 224
    min_height: 224

actuators_required: []

runtime: "pytorch"

# Pre-quantized NF4 (bitsandbytes) checkpoint of the Qwen3-VL-4B backbone, HOSTED
# at weights_uri so consumers load the packed 4-bit weights DIRECTLY — no 8.3 GB
# bf16 download, no re-quantize. lerobot's STOCK `TOPRewardModel` reads the
# `quantization_config` baked into the checkpoint's config.json and loads 4-bit
# with no OpenRAL subclass. Measured: 2.89 GB on disk, 3.13 GB peak for an
# 8-frame Qwen3-VL forward on an 8 GB GPU. transformers 5.x (no downgrade pin).
quantization:
  dtype: "int4"
  backend: "pytorch"
  extra:
    scheme: "nf4"
    quantizer: "bitsandbytes"
    compute_dtype: "bfloat16"
    double_quant: "true"
    # Hosted pre-quantized checkpoint; config.json carries the BitsAndBytesConfig,
    # so lerobot's stock loader materializes 4-bit directly (no subclass).
    loader: "lerobot.rewards.topreward.TOPRewardModel (stock; 4-bit from config.json)"

min_vram_gb:
  fp32: 18.0
  bf16: 9.0
  int4: 3.2  # measured 3.13 GB peak (8-frame prefix forward, RTX 4070 Laptop 8 GB)

# TOPReward is ZERO-SHOT: the "weights" are the off-the-shelf (Apache-2.0)
# Qwen3-VL-4B-Instruct VLM. OpenRAL hosts a pre-quantized NF4 copy so nobody
# re-quantizes: weights_uri points at THIS repo (self-referencing, like Robometer);
# source_repo credits the upstream bf16 backbone.
weights_uri: "hf://OpenRAL/rskill-topreward_qwen3vl_4b-any-general-nf4"

chunk_size: 1
latency_budget:
  # S2-cadence monitor over a frame window; not a per-control-step signal.
  per_chunk_ms: 3000.0

source_repo: "hf://Qwen/Qwen3-VL-4B-Instruct"
paper_url: "https://arxiv.org/abs/2602.19313"

# Reward / progress-monitor contract. TOPReward's model returns ONE clip-level
# scalar log P("True" | video, instruction). The DEPLOY backend
# (openral_runner.backends.reward.topreward_reward.TOPRewardMonitor) turns this
# into a per-frame series by the same prefix sweep + per-window min-max
# normalization used by lerobot's offline labeler (compute_rabc_weights).
reward:
  backend: "topreward"  # select the in-process TOPReward monitor
  progress_range: [0.0, 1.0]
  # Advisory bars on the normalized progress signal — TOPReward is zero-shot and
  # not physically calibrated, so these gate the trend, not a hard success verdict.
  # Live on LIBERO ep0 (a success demo): rises across the attempt toward ~0.9.
  success_threshold: 0.8
  check_floor: 0.5
  preference: false
  # Score the whole attempt from its start (TOPReward judges "is the task complete
  # by now"), matching Robometer's full-attempt window rather than a trailing tail.
  frame_window_s: 40.0
  target_fps: 2.0  # TOPRewardConfig default fps for the Qwen video processor
  instruction_required: true
  plateau_window_s: 3.0
  plateau_tolerance: 0.06
  default_patience_s: 30.0

description: >
  TOPReward (arXiv 2602.19313) as an NF4 reward rSkill on lerobot 0.6.0. A
  ZERO-SHOT reward: asks an off-the-shelf Qwen3-VL-4B VLM how likely the task
  instruction is given the rollout video, reading log P("True") as the signal.
  Per-frame progress (0-1) comes from lerobot's prefix sweep. Runs parallel to a
  VLA, queried on demand by the Reasoner. Advisory-only — never gates motors.
  Embodiment-agnostic.

actions:
  - "monitor"

objects:
  - "task progress"
  - "task success"

scenes:
  - "tabletop"
  - "kitchen"
  - "indoor"
  - "manipulation"

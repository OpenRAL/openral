# BEHAVIOR-1K R1 Pro deploy-sim environment.
# OmniGibson owns the scene/task physics in its official conda environment.

scene:
  id: "behavior"
  backend: "isaacsim"
  observation_height: 224
  observation_width: 224
  cameras: ["head", "left_wrist", "right_wrist"]
  backend_options:
    task: "turning_on_radio"
    instance_index: 0
    mode: "public_test"
    env_wrapper: "omnigibson.eval.wrappers.DefaultWrapper"
    boot_timeout_s: 1200
    timeout_ms: 120000

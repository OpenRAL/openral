# zed_wrapper parameter override for a ZED-M bolted to a robot.
#
# Named for the cell it was measured on, but nothing in it is OpenArm-specific:
# any deploy scene whose `drivers:` block launches zed_wrapper can point its
# `ros_params_override_path` here (see the ZED recipe in
# docs/tutorials/deploy/deploy-run-and-dashboard.md).
#
# Referenced from `scenes/deploy/openarm_bench.yaml`'s `drivers:` entry
# as a scene-relative path, so the setting travels with the scene instead of
# living in an operator's home directory.
#
# Positional tracking OFF on purpose. With it on, the wrapper publishes its own
# map -> odom -> zed_camera_link chain — and the manifest already parents
# zed_camera_link to `openarm_base`, so the frame would have TWO parents. A TF
# frame with two parents is not a tree: lookups become order-dependent and
# octomap_server silently drops clouds. The camera is rigidly bolted to the rig,
# so its pose belongs to the robot's tree, not to visual odometry.
/**:
    ros__parameters:
        pos_tracking:
            pos_tracking_enabled: false
        general:
            # HD720, not HD1080. The ZED-M shares one 5 Gbit/s hub uplink with
            # both Arducams on this cell (`lsusb -t`: all three hang off Bus 002
            # Dev 002), and at 1920x1080 the SDK opened the camera and then
            # dropped it repeatedly mid-stream — "Connection issue detected:
            # CAMERA REBOOTING" on a ~2.8 s retry loop, with no frame ever
            # reaching the bus. HD720 roughly halves the pixel rate.
            grab_resolution: 'HD720'
        depth:
            depth_mode: 'NEURAL_LIGHT'
            # Off so `pos_tracking_enabled: false` above actually holds. The SDK
            # force-enables positional tracking whenever depth stabilization is
            # on ("POSITIONAL TRACKING disabled in the parameters, but forced to
            # ENABLE because required by `depth.depth_stabilization > 0`"), which
            # silently defeated the setting this file exists for. Stabilization
            # smooths depth temporally using that tracking; octomap integrates
            # over time anyway, so the smoothing buys nothing here.
            depth_stabilization: 0
            # The cloud feeds octomap_server, whose insert is CPU-bound and was
            # skipping a third of a 10 Hz COMPACT cloud on Thor (octree 5-7 Hz,
            # map data age p50 320 ms / p99 835 ms at the kernel during a
            # dispatch, 2026-09-24). Half resolution and the cell's reach (the
            # shelf sits under 1 m from the base) cut the points per insert so
            # the octree can keep the cloud's cadence.
            point_cloud_res: 'REDUCED'
            max_depth: 2.5

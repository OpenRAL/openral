# Isaac Lab-Arena DROID / RoboLab `banana_in_bowl` on OpenRAL's Isaac Sim 6.x backend —
# the deploy twin of scenes/sim/isaac_arena_droid_banana_in_bowl.yaml: same maple
# table, stand, banana + bowl layout, dome light, cameras, gripper curve and graded
# placement (see that file for where each value comes from). Env-only, as every
# DeployScene: the operator or reasoner supplies the goal, and the local registry
# routes it to rskills/pi05-droid-jointpos-arena.
#
# Time base: 15 Hz, the manifest's action_spec.control_freq_hz = the skill's
# action_contract.control_freq_hz (no scene override needed).
#
# World collision: the DROID platform has no depth sensor (its `exterior` / `wrist` are
# RGB), so this scene adds a SIMULATED depth camera, `exterior_depth` (`sim_sensors`),
# rendered by Isaac (distance_to_image_plane) from the `exterior` mount and field of
# view at half resolution. The HAL publishes its cloud on
# /openral/cameras/exterior_depth/points, octomap maps it and the safety kernel checks
# every chunk against the voxels with the manifest's lowered collision model
# (robots/droid_franka_robotiq/robot.yaml; the Robotiq 2F-85 linkage is mimic links
# posed from the jaw fraction, exact in Isaac, see its README). It exists in this
# scene only. `range_max_m` cannot keep
# the stand out: its top is flush with the table, 0.87 m from the camera, nearer than
# the banana (1.04 m) and the bowl (0.91 m); 1.6 m keeps the far table edge in.
#
# Requirements: NVIDIA RTX GPU, Isaac Sim 6.1, network access to the Isaac 6.1 asset root.
#
# Run::
#
#     openral deploy sim --config scenes/deploy/isaac_arena_droid_banana_in_bowl.yaml \
#       --initial-task "pick up the banana and place it in the bowl" \
#       --enable-octomap --enable-octomap-kernel-check

robot_id: "droid_franka_robotiq"

base_pose:
  xyz: [0.0, 0.0, 0.0]
  quat_xyzw: [0.0, 0.0, 0.0, 1.0]
  frame_id: world

scene:
  id: isaac_sim
  backend: isaacsim
  assets_uri: "isaac:Isaac/IsaacLab/Arena/assets/object_library/srl_robolab_assets/scenes/maple_table.usda"
  observation_height: 720
  observation_width: 1280
  cameras: ["exterior", "wrist"]
  backend_options:
    boot_timeout_s: 1200
    # Render small (398x224): pi05 resizes each 1280x720 frame to 224x126 with padding,
    # and rendering is most of a step's cost (the restock scenes render at 224 too).
    camera_render_height:
      exterior: 224
      wrist: 224
    dome_light:
      intensity: 1500.0
      color: [0.75, 0.75, 0.75]
    objects:
      - name: franka_stand
        usd: "isaac:Isaac/IsaacLab/Arena/assets/object_library/srl_robolab_assets/robots/franka_stand_grey.usda"
        xyz: [0.0, 0.0, 0.0]
        dynamic: false
      - name: banana
        usd: "isaac:Isaac/IsaacLab/Arena/assets/object_library/srl_robolab_assets/objects/ycb/banana.usd"
        xyz: [0.50973, -0.11581, 0.02118]
      - name: bowl
        usd: "isaac:Isaac/IsaacLab/Arena/assets/object_library/srl_robolab_assets/objects/ycb/bowl.usd"
        xyz: [0.56110, 0.15261, 0.03035]
    initial_joint_positions:
      panda_joint1: 0.0
      panda_joint2: -0.6283185
      panda_joint3: 0.0
      panda_joint4: -2.5132741
      panda_joint5: 0.0
      panda_joint6: 1.8849556
      panda_joint7: 0.0
      finger_joint: 1.0  # open
    joint_drive_gains:
      "finger_joint": [5729.578, 0.011459]
      # The Robotiq's mimic followers on the leader's gains, driven toward the mimic of the
      # MEASURED leader (`gripper_followers_track`): the four-bar the URDF tree cuts open
      # moves as one body. Spark gripper probe 2026-10-21 (R21 replay, contacts): follower
      # error vs mimic p95 17.1 -> 0.75 deg, max 22.7 -> 4.8 deg (was up to 39 deg).
      "(right_finger_joint|.*_phalanx_joint)": [5729.578, 0.011459]
    gripper_followers_track: measured
    gripper_joint_curve:
      finger_joint: [[0.0, 0.7853982], [1.0, 0.0]]
    # Simulated-only depth for the world map: Arena's `external_camera` as metric
    # depth at 640x360. fx = fy = 320 / tan(104.0 deg / 2) = 250.0, the `exterior`
    # mount's field of view (its 1280x720 fx = 500 halved).
    sim_sensors:
      - name: exterior_depth
        modality: depth
        frame_id: exterior_depth_optical_frame
        rate_hz: 10.0
        range_max_m: 1.6
        intrinsics: {width: 640, height: 360, fx: 250.0, fy: 250.0, cx: 320.0, cy: 180.0}
        encoding: "32FC1"
        vendor: "sim"
        model: "isaac_distance_to_image_plane"
    camera_mounts:
      exterior: &arena_external  # Arena `external_camera`
        link: panda_link0
        xyz: [0.05, 0.57, 0.66]
        quat_wxyz: [-0.393, -0.195, 0.399, 0.805]
        axes: usd
        hfov_deg: 104.0
      exterior_depth: *arena_external
      wrist:
        link: robotiq_arg2f_base_link
        xyz: [-0.074, 0.031, 0.011]
        quat_wxyz: [-0.113824, -0.704153, 0.692134, 0.110289]
        axes: usd
        hfov_deg: 87.66
    placement_success:
      regions:
        in_bowl:
          min_xyz: [-0.0807, -0.0806, -0.0275]
          max_xyz: [0.0807, 0.0806, 0.0825]
          relative_to: bowl
      grades:
        # A banana lies on its side: no upright requirement, one level.
        - {name: complete, score: 1.0, region: target}
      settle_s: 1.0
      require_released: true
      tasks:
        "pick up the banana and place it in the bowl": &banana_in_bowl
          - {object: banana, target: in_bowl}
        # RoboLab's default instruction (banana_in_bowl_task.py L15-45).
        "Pick up the banana and place it in the bowl": *banana_in_bowl

# Grasp declaration for the grasp allowance / manipulation-workspace contact rule
# (runtime block below). DERIVED, not hand-written, by `tools/derive_scene_inputs.py
# --instruction "pick up the banana and place it in the bowl"` on Isaac 6.1 (spark,
# 2026-10-16), from the sim's ground truth through the reasoner's grounding
# (`ground_grasp_target` / `ground_workspace`). `search_box` is the banana's bound,
# padded. `workspace_box` is the hull of the table top the banana rests on (Arena's
# maple table, `/World/environment/table/table_01`; its legs left out) and the bowl's
# `in_bowl` region, padded 2 cm, plus headroom, cut to the 0.5 m half-extent cap around
# the banana. The producer confirms it on the voxel map (`workspace_region` is
# producer-only). The search box is labelled `sim:` (ground truth): it serves the HAL
# only and never seeds the #418 tracker.
# HAZARD-LOG LINE OWED: the table is a MOVABLE support (an enabled, non-kinematic rigid
# body here and in Arena). The sidecar exports it flagged `dynamic`, so it is never
# declared static geometry, and the workspace relaxes nothing until the map confirms it.
# SIM-ONLY, pending Safety-WG review (ADR + hazard-log rows owed).
grasp_declaration:
  target_id: "obj:banana"
  contact_links: [robotiq_finger_pair]
  timeout_s: 120.0
  stamp_ns: 0
  search_box:
    frame_id: panda_link0
    pose: {xyz: [0.509671, -0.115792, 0.021202], quat_xyzw: [0.0, 0.0, 0.0, 1.0], frame_id: panda_link0}
    half_extents: [0.099504, 0.134225, 0.063602]
    evidence_ref: "sim:banana"
    stamp_ns: 0
  workspace_box:
    frame_id: panda_link0
    pose: {xyz: [0.54859, -0.0568645, 0.0929435], quat_xyzw: [0.0, 0.0, 0.0, 1.0], frame_id: panda_link0}
    half_extents: [0.37, 0.4410725, 0.1399435]
    evidence_ref: "sim:/World/environment/table/table_01+destination"
    stamp_ns: 0

# Committed posture: world collision on (octomap over exterior_depth + the kernel's
# voxel check), no SLAM / Nav2 (a fixed-base arm at a table).
runtime:
  # The VLA emits no success signal: Robometer-4B (the deploy default reward model) scores
  # the exterior camera beside it, and the critic producer turns its success into a Tier-C
  # event (2026-10-22). 8 s of footage per heartbeat (subsampled to its 8 frames); the
  # 2 s default left one frame per score at the sim's camera rate (Spark R219).
  enable_reward_monitor: true
  enable_critic: true
  reward_monitor_score_window_s: 8.0
  # Robometer's success alone is no completion signal (it peaked mid-carry as often as at
  # the placement, R221-R223): on success >= 0.6 or a release the policy is held and the
  # scene VLM (qwen35-4b-nf4) asked on both cameras; all yes ends the goal as a success.
  enable_scene_vlm: true
  enable_completion_check: true
  enable_slam: false
  enable_nav2: false
  enable_octomap: true
  enable_octomap_kernel_check: true
  # Raw octree clearing requires a unique valid tracked-object binding and guarded
  # support/neighbor/static keep-outs. Untracked and pinch fallback geometry never
  # grants clearing. Per-cell ownership remains incomplete; this stays SIM-ONLY,
  # pending Safety-WG review. `deploy run` refuses it.
  payload_sweep_clear_enabled: true
  # The #418 object tracker owns the attachment set and keys the kernel's grasp exemption,
  # payload ownership and the place region on tracked ids (the values of the successful
  # Spark run R365, 2026-10-22). It is what clears the held payload from the voxel map:
  # with tracking off a geometry-only attachment stays mapped and the arm may stop on what
  # it holds. A goal waits up to `grounding_wait_s` (source time) for its target query and
  # is refused if it does not ground. SIM-ONLY, pending Safety-WG review (ADR + hazard rows
  # owed). `deploy run` refuses `on`.
  object_tracking: "on"
  grounding_wait_s: 15.0
  grounding_required: true
  # Grasp allowance + manipulation-workspace contact
  # (docs/reference/manipulation-workspace-contact.md), SIM-ONLY and PENDING Safety-WG
  # review: the ADR (§7) and the hazard-log rows (§8) are owed. The exempt links are
  # `RobotDescription.hand_links()`: robotiq_finger_pair, the six Robotiq mimic links
  # (outer / inner knuckles, inner fingers), the two outer fingers (`*_bar`, fixed on
  # the outer knuckles) and robotiq_arg2f_base_link. The bounds are the doc's deploy-sim calibration
  # values (§8); the lead is the schema cap. `deploy run` refuses this block.
  grasp_allowance_enabled: true
  workspace_contact_enabled: true
  workspace_contact_max_speed_mps: 0.5
  workspace_contact_max_lead_m: 0.10
  # The wrist housing panda_link6 joins panda_link7 as a wrist link for the contact rule
  # only (2026-10-21 decision; R50-R82 stopped on it commanded into the table or bowl rim,
  # no physical contact). SIM-ONLY, pending Safety-WG review and a hazard-log row.
  workspace_contact_wrist_links: 2
  # The grasp-target producer, which measures the target region: the scene's simulated
  # depth camera (`exterior_depth`, the `exterior` mount), its RGB from the same render.
  # `camera` names the manifest sensor on that mount. /tf has no frame for the logical
  # `robotiq_finger_pair`; the URDF's `robotiq_arg2f_tcp` (between the fingertips)
  # stands in for the TCP. The trigger reads finger_joint's sim-measured
  # `closure_calibration` (robots/droid_franka_robotiq/robot.yaml).
  vision_attachment:
    enabled: true
    camera: exterior
    rgb_topic: /openral/cameras/exterior_depth/image
    rgb_camera_info_topic: /openral/cameras/exterior_depth/camera_info
    depth_topic: /openral/cameras/exterior_depth/depth/image
    depth_camera_info_topic: /openral/cameras/exterior_depth/depth/camera_info
    grasp_target_enabled: true
    grasp_target_premeasure: true
    # The banana goes into the bowl: without the place producer a payload meeting its
    # destination is a world collision (Spark R142, 2026-10-22). The HAL leg runs only with
    # `object_tracking` off or shadow; under `on` the tracker measures the place region and
    # the runner arms its goal-scope place declaration without this flag.
    place_target_enabled: true
    tf_frames: {robotiq_finger_pair: robotiq_arg2f_tcp}

# SO-101 in LeIsaac's PickOrange kitchen (LightwheelAI/leisaac v0.1.0, Apache-2.0) on
# OpenRAL's Isaac Sim 6.x backend — the deploy twin of
# scenes/sim/isaac_leisaac_pick_orange.yaml: same stage archive, in-stage oranges +
# plate, dome light, collider strip, spawn, LeIsaac drive gains, cameras and graded
# placement (see that file for where each value comes from). Env-only, as every
# DeployScene: the operator or reasoner supplies the goal.
#
# Time base: LeIsaac records and evaluates one action per 1/60 s physics step, and
# rskills/smolvla-so101-leisaac-pick-orange declares action_contract.control_freq_hz
# 60. `backend_options.control_freq_hz: 60` below is the ONE place this deploy's rate
# lives (`openral_core.sim_scene_description`): the CLI, the launch (kernel rates, the
# runner's `rate_hz`, recorder fps), the HAL (`build_hal` -> SimAttachedHAL time-base
# check, proprio publish rate) and the Isaac scene all read it from here. It is
# reported by `deploy sim` ("sim scene overrides robot ..."), the launch, the Isaac
# scene (`isaac_control_rate_overridden`) and the HAL (`sim.time_base`), and the
# runner's goal span records `control.rate_hz` 60 / `control.rate_source`
# rate_hz_param. The runner still refuses a skill whose trained rate is not 60 Hz.
#
# World collision: the SO-101 has no depth sensor (its real `top` / `wrist` are RGB),
# so this scene adds a SIMULATED depth camera, `top_depth` (`sim_sensors`), rendered
# by Isaac (distance_to_image_plane) from the same pose and field of view as `top`.
# The HAL publishes its cloud on /openral/cameras/top_depth/points, octomap maps it and
# the safety kernel checks every chunk against the voxels. It exists in this scene
# only — the robot manifest, and so a real SO-101 deploy, is unchanged. Self-collision
# is the manifest's OBB model with its documented negative margin
# (robots/so101_follower/robot.yaml, `self_collision_margin_m`).
#
# Requirements: NVIDIA RTX GPU, Isaac Sim 6.x, network access to github.com on first use.
#
# Run::
#
#     openral deploy sim --config scenes/deploy/isaac_leisaac_pick_orange.yaml \
#       --initial-task "Grab orange and place into plate" \
#       --enable-octomap --enable-octomap-kernel-check

robot_id: "so101_follower"

base_pose:
  xyz: [2.2, -0.61, 0.89]
  quat_xyzw: [0.0, 0.0, 1.0, 0.0]  # LeIsaac rot wxyz (0, 0, 0, 1): yaw 180 deg
  frame_id: world

scene:
  id: isaac_sim
  backend: isaacsim
  observation_height: 480
  observation_width: 640
  cameras: ["top", "wrist"]
  backend_options:
    # First boot also downloads + extracts the 73 MB stage.
    boot_timeout_s: 1200
    environment_archive:
      url: "https://github.com/LightwheelAI/leisaac/releases/download/v0.1.0/kitchen_with_orange.zip"
      sha256: "d314c54b63a17e91402bfaddf26e21ff614adf2430fa092b78897f15b8adea34"
      usd: "kitchen_with_orange/scene.usd"
    strip_xform_colliders: true
    control_freq_hz: 60.0
    joint_drive_gains:
      ".*": [17.8, 0.6]
    # The sim twin's gripper effort, finger colliders and PhysX contact settings,
    # copied from scenes/sim/isaac_leisaac_pick_orange.yaml (see it for the sources).
    joint_effort_limits:
      gripper: 1.0
    collision_approximation:
      "gripper|jaw": convexDecomposition
    physx_scene:
      friction_correlation_distance: 0.00625
      bounce_threshold: 0.01
    dome_light:
      intensity: 3000.0
      color: [0.75, 0.75, 0.75]
    stage_objects:
      - {name: orange_1, prim: Orange001/Orange001}
      - {name: orange_2, prim: Orange002/Orange002}
      - {name: orange_3, prim: Orange003/Orange003}
      - {name: plate, prim: Plate/Plate}
    # Simulated-only depth for the world map: LeIsaac's `front` view as metric depth.
    # fx = fy = 320 / tan(67.163 deg / 2) = 482.0, the `top` mount's field of view.
    sim_sensors:
      - name: top_depth
        modality: depth
        frame_id: top_depth_optical_frame
        rate_hz: 10.0
        range_max_m: 2.0
        intrinsics: {width: 640, height: 480, fx: 482.0, fy: 482.0, cx: 320.0, cy: 240.0}
        encoding: "32FC1"
        vendor: "sim"
        model: "isaac_distance_to_image_plane"
    camera_mounts:
      top: &leisaac_front  # LeIsaac `front`
        link: base
        xyz: [0.0, -0.5, 0.6]
        quat_wxyz: [0.1650476, -0.9862856, 0.0, 0.0]
        axes: ros
        hfov_deg: 67.163
      top_depth: *leisaac_front
      wrist:
        link: gripper
        xyz: [-0.001, 0.1, -0.04]
        quat_wxyz: [-0.404379, -0.912179, -0.0451242, 0.0486914]
        axes: ros
        hfov_deg: 53.544
    placement_success:
      regions:
        on_plate:
          min_xyz: [-0.10, -0.10, -0.07]
          max_xyz: [0.10, 0.10, 0.07]
          relative_to: plate
      grades:
        - {name: complete, score: 1.0, region: target}
      # One or two of the three oranges on the plate: partial credit (episode grade).
      some_placed: {name: partial, score: 0.5}
      settle_s: 0.5
      tasks:
        "Pick three oranges and put them into the plate": &three_oranges
          - {object: orange_1, target: on_plate}
          - {object: orange_2, target: on_plate}
          - {object: orange_3, target: on_plate}
        # The training string of LightwheelAI/leisaac-pick-orange.
        "Grab orange and place into plate": *three_oranges

# Grasp declaration for the manipulation-workspace contact rule (runtime block below):
# DERIVED, not hand-written, by `tools/derive_scene_inputs.py --instruction "Grab orange
# and place into plate"` on Isaac 6.1 (spark, 2026-10-16) from the sim's ground truth
# through the reasoner's grounding (`ground_grasp_target` / `ground_workspace`). The
# target is the prompt's first graded object, orange_1. The workspace is the hull of
# orange_1 (no static collider supports it: `strip_xform_colliders`) and the plate's
# `on_plate` region, padded 2 cm, plus 10 cm headroom. A scene may declare these two
# boxes. The producer measures the region and confirms the workspace on the voxel map
# (`workspace_region` is producer-only). The search box is
# labelled `sim:` (ground truth): it serves the HAL only and never seeds the #418 tracker. The tool's derived static geometry is not
# used. SIM-ONLY, pending Safety-WG review (ADR + hazard rows owed).
grasp_declaration:
  target_id: "obj:orange_1"
  contact_links: [moving_jaw]
  timeout_s: 120.0
  stamp_ns: 0
  search_box:
    frame_id: base
    pose: {xyz: [0.073808, -0.303396, 0.050843], quat_xyzw: [0.0, 0.0, 0.0, 1.0], frame_id: base}
    half_extents: [0.073359, 0.073979, 0.070916]
    evidence_ref: "sim:orange_1"
    stamp_ns: 0
  workspace_box:
    frame_id: base
    pose: {xyz: [-0.10657, -0.271567, 0.08], quat_xyzw: [0.0, 0.0, 0.0, 1.0], frame_id: base}
    half_extents: [0.228737, 0.12, 0.14]
    evidence_ref: "sim:orange_1+destination"
    stamp_ns: 0

# Committed posture: world collision on (octomap over top_depth + the kernel's voxel
# check), no SLAM / Nav2 (a fixed-base arm on a counter).
runtime:
  enable_slam: false
  enable_nav2: false
  enable_octomap: true
  enable_octomap_kernel_check: true
  # Raw octree clearing requires a unique valid tracked-object binding and guarded
  # support/neighbor/static keep-outs. Untracked and pinch fallback geometry never
  # grants clearing. Per-cell ownership remains incomplete; this stays SIM-ONLY,
  # pending Safety-WG review. `deploy run` refuses it.
  payload_sweep_clear_enabled: true
  # The #418 object tracker owns the attachment set and keys the kernel's grasp exemption
  # and payload ownership on tracked ids (the values of the successful Spark run R372,
  # 2026-10-23). It is what clears the held payload from the voxel map:
  # with tracking off a geometry-only attachment stays mapped and the arm may stop on what
  # it holds. A goal waits up to `grounding_wait_s` (source time) for its target query and
  # is refused if it does not ground. SIM-ONLY, pending Safety-WG review (ADR + hazard rows
  # owed). `deploy run` refuses `on`.
  object_tracking: "on"
  grounding_wait_s: 8.0
  grounding_required: true
  # The target query has no seed (the grasp declaration's search_box is sim ground truth),
  # so the tracker grounds it through this on-demand locator; without one `deploy sim`
  # refuses to configure. Needs the omdet dependency group (`just sync --group omdet`).
  object_detector_locators: [omdet-turbo-locator]
  # Manipulation-workspace contact (docs/reference/manipulation-workspace-contact.md),
  # SIM-ONLY and PENDING Safety-WG review: the ADR (§7) and the hazard-log rows (§8) are
  # owed. While the grasp declaration below is live and the grasp-target producer has
  # confirmed its `workspace_box` on the voxel map, world cells centred in that box do not
  # trip the hand links (`RobotDescription.hand_links()`: moving_jaw, jaw, gripper, wrist)
  # while the hand is slow. The bounds are the doc's deploy-sim calibration values (§8);
  # the lead is the schema cap. `deploy run` refuses this block.
  grasp_allowance_enabled: true
  workspace_contact_enabled: true
  workspace_contact_max_speed_mps: 0.5
  workspace_contact_max_lead_m: 0.10
  # The grasp-target producer, which measures the target region and confirms the
  # workspace: the scene's simulated depth camera (`top_depth`, the `top` mount), its RGB
  # from the same render. `camera` names the manifest sensor on that mount. /tf has no
  # frame for the logical `moving_jaw`; the jaw's own frame stands in for the TCP.
  vision_attachment:
    enabled: true
    camera: top
    rgb_topic: /openral/cameras/top_depth/image
    rgb_camera_info_topic: /openral/cameras/top_depth/camera_info
    depth_topic: /openral/cameras/top_depth/depth/image
    depth_camera_info_topic: /openral/cameras/top_depth/depth/camera_info
    grasp_target_enabled: true
    grasp_target_premeasure: true
    tf_frames: {moving_jaw: jaw}

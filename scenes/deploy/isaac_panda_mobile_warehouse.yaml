# panda_mobile in NVIDIA's Isaac Sim warehouse (three shelf racks, pallet bins).
#
# The generic "any Isaac stage, any manifest robot" deploy scene: everything
# that defines it is the three fields below —
#
#   robot_id         which robots/<id>/robot.yaml to import (from its URDF)
#   base_pose        where it spawns, in the environment's world frame
#                    (x, y, z + a yaw-only quaternion; the robot stands upright)
#   scene.assets_uri the environment USD: a local path, an http(s):// or
#                    omniverse:// URL, or isaac:<path> under the installed Isaac
#                    Sim's own asset root (version-matched to the sidecar)
#
# Swap any of them to put another robot in another stage. The environment
# replaces the bring-up ground plane, so the USD must carry its own floor
# collider (Isaac's environments do). Odometry starts at the spawn.
#
# Spawn: the aisle between Shelf_0 (x <= -8.6) and Shelf_1 (x >= -1.0), facing
# down it (+y). The racks span y = -4.5 .. 13.1 and are 6 m tall; the panda's
# lidar/SLAM/Nav2 bring-up maps them like any other obstacle.
#
# Pickable objects: the stage itself ships no rigid bodies, so three YCB props
# (Isaac's physics-ready `Axis_Aligned_Physics` set) sit on the empty pallet in
# front of Shelf_1 (x -0.75..0.26, y 4.48..5.70, deck top z 0.21) — 5 m down the
# aisle from the spawn: drive there, turn to +x, pick. They drop a few cm onto
# the pallet at reset and settle; `world.reset()` puts them back each episode.
#
# Licence: NVIDIA's Isaac Sim assets may be used inside Isaac Sim — they are
# referenced from NVIDIA's asset server at run time, never converted or vendored.
#
# Requirements: NVIDIA RTX GPU, Isaac Sim (a binary install such as
# /opt/isaac-sim, or the sidecar venv — OPENRAL_ISAAC_SIDECAR_PYTHON overrides),
# and network access to NVIDIA's asset server.
#
# Run::
#
#     openral deploy sim --config scenes/deploy/isaac_panda_mobile_warehouse.yaml \
#       --no-enable-octomap --hal viewer_enabled=false

robot_id: "panda_mobile"

base_pose:
  xyz: [-4.8, 0.0, 0.0]
  quat_xyzw: [0.0, 0.0, 0.7071068, 0.7071068]  # yaw +90 deg: facing down the aisle (+y)
  frame_id: world

scene:
  id: isaac_sim
  backend: isaacsim
  assets_uri: "isaac:Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd"
  backend_options:
    # First boot also streams the stage + its props from the asset server.
    boot_timeout_s: 1200
    objects:
      - name: cracker_box
        usd: "isaac:Isaac/Props/YCB/Axis_Aligned_Physics/003_cracker_box.usd"
        xyz: [-0.45, 4.80, 0.40]
      - name: sugar_box
        usd: "isaac:Isaac/Props/YCB/Axis_Aligned_Physics/004_sugar_box.usd"
        xyz: [-0.45, 5.10, 0.35]
      - name: mustard_bottle
        usd: "isaac:Isaac/Props/YCB/Axis_Aligned_Physics/006_mustard_bottle.usd"
        xyz: [-0.45, 5.40, 0.35]

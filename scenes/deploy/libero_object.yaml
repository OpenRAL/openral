# LIBERO object environment — deploy-sim digital twin (DeployScene; operator-goal driven).
#
# Boots the full OpenRAL stack (HAL + reasoner + safety kernel + reward monitor
# + object-locator) against the LIBERO *object* MuJoCo scene: a table with ten
# grocery items (alphabet soup, cream cheese, salad dressing, bbq sauce,
# ketchup, tomato sauce, butter, milk, chocolate pudding, orange juice) and a
# basket. Unlike libero_spatial (positionally fixed target), object places
# every item at once — the operator goal names which to move, so the reasoner
# must locate each before picking.
#
# Operator supplies one goal at runtime (`--initial-task` / `/openral/prompt`);
# reasoner decomposes it into an ordered queue via `decompose_mission`, locates
# each object via omdet-turbo-locator, executes smolvla-libero per subtask,
# reward-gates against robometer-4b, advances until drained. Every subtask
# selection/localisation/VLA execution/reward verdict is an OTel span on
# `reasoner.tick`/`rskill.tick`.
#
# Robot auto-resolves via `SCENES.fixed_robot("libero_object") == "franka_panda"`.
# Run: OPENRAL_DASHBOARD_FLIP_180=1 openral deploy sim --config scenes/deploy/libero_object.yaml
#      --enable-reward-monitor --object-detector-locator rskills/omdet-turbo-locator/rskill.yaml
# Setup: CC=/usr/bin/gcc just sync --all-packages --group libero
#
# OPENRAL_DASHBOARD_FLIP_180=1 rotates dashboard cameras 180deg for display
# only (VLA already flips via image_preprocessing.flip_180) since LIBERO
# renders bottom-up. Episode runs continuously — task success no longer
# resets the arena, so the decomposed mission persists across subtasks.

scene:
  id: libero_object
  backend: mujoco
  # 256 default. Higher (512+) sharpens frames for the locator but the LA-3B
  # locator sidecar + Robometer reward + VLA already saturate an 8 GB GPU at 256.
  observation_height: 256
  observation_width: 256

# Deploy goal is supplied by the operator at runtime, e.g.:
#   openral deploy sim --config scenes/deploy/libero_object.yaml \
#     --initial-task "pick up the milk, the ketchup, and the alphabet soup and put each in the basket"
# The reasoner decomposes that single goal into ordered subtasks via decompose_mission.

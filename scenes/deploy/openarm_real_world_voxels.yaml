# OpenArm REAL cell with the safety kernel's world-voxel check ON.
#
# !!! THIS SCENE DRIVES REAL MOTORS AND LETS A CAMERA STOP THEM. !!!
#
# Runbook: docs/tutorials/deploy/openarm-real-world-voxel-check.md — follow it
# step by step; this header is the short form, not a substitute.
#
# Preconditions, ALL of them, every run:
#   1. OPENRAL_ROBOT_UNIT names this cell, and that unit's overlay
#      (robots/openarm/units/<unit>.yaml) declares head_zed's calibrated mount
#      (static_transform_xyz_rpy), measured by you: OpenRAL does not calibrate
#      it, and `deploy run` refuses the manifest's nominal mount. A mis-framed
#      cloud is not a bad picture here: it puts obstacles where there are none
#      (false E-stops) and, worse, moves real obstacles away from where they
#      are (missed stops). The Thor and Orin cells have different ZED mounts, so
#      a pose calibrated on one is wrong on the other (runbook step 2).
#   2. A person at the cell for the whole run, hardware E-stop in hand, and a
#      second person on the stop for bringup: `deploy run` activates the
#      OpenArm controllers, whose on_activate steps all 16 motors to zero
#      UNRAMPED. Park the arms near zero first. Presence is per run.
#   3. Both motion gates exported by that person, for that run only:
#      OPENRAL_OPENARM_ALLOW_MOTION=1 and OPENRAL_OPENARM_ATTENDED=1.
#      No `robot_unit` here on purpose: this scene runs on either cell, so the
#      unit comes from OPENRAL_ROBOT_UNIT and `deploy run` refuses without it.
#   Launch ONLY through `tools/openarm_world_voxel_run.sh`, which refuses
#   unless 1 and 3 hold. `openral deploy run` itself checks neither.
#
# Known gaps on current master, each of which the runbook's attended step is
# expected to show rather than disprove:
#   * No depth self-filter exists for a real camera (the sim HAL's is
#     MuJoCo-only), so any arm link the ZED sees becomes occupancy around that
#     link and the kernel stops it (KIND_COLLISION, a `voxel_<n>` evidence
#     cell on the stopping link itself).
#   * Real hardware runs with attached-payload checking OFF while
#     `runtime.vision_attachment.enabled` is false (below; the committed
#     posture), and then nothing on the real graph publishes
#     /openral/attachment_state, so a grasped object is never cleared from the
#     map: it stops the gripper holding it.
#   Camera loss fails CLOSED: openral_octomap_bridge stops publishing once its
#   octree is older than max_octree_age_s (1.0 s = the kernel's voxel deadline),
#   so the kernel drops with DROP_VOXEL_UNAVAILABLE within ~2.0 s of the last
#   cloud (hazard-log Entry 033).
#
# Twin pass (motors never powered, same pose, same cloud): run the ZED driver
# by hand, then `openral deploy sim --config <this file> --hal
# viewer_enabled=false` — `drivers:` is ignored on the sim path.
#
# Verified offline only (resolve + launch composition + validate); never run
# on hardware as of this commit. The ZED leg was proven on qorin1, not Thor.

robot_id: "openarm"

scene:
  id: openarm_real_world_voxels

# No `sensors:` entry: head_zed is a robot sensor, so its frames live in
# robots/openarm/robot.yaml and its calibrated mount pose and real-hardware
# binding in the unit overlay (robots/openarm/units/<unit>.yaml) — a deploy
# scene never redefines a robot camera (openral_core.check_scene_sensor_overrides).
# The cloud itself reaches octomap by topic: zed_wrapper publishes it and
# `runtime.octomap_cloud_topic` points octomap at it.

# The ZED wrapper comes up with the graph (real path only), so the
# no-second-parent arguments are pinned here instead of remembered by hand:
# with publish_tf true the wrapper publishes odom -> zed_camera_link from
# visual odometry while the manifest parents zed_camera_link to the arm — two
# parents, order-dependent tf2 lookups, and octomap_server silently drops
# clouds. camera_name pins the `zed_` frame/topic prefix the manifest pose and
# octomap_cloud_topic below both assume. Source the ZED colcon overlay before
# launching, or the graph refuses to start.
drivers:
  - package: zed_wrapper
    launch_file: zed_camera.launch.py
    args:
      camera_model: zedm
      camera_name: zed
      publish_tf: "false"
      publish_map_tf: "false"
      # The cloud octomap gets: 30 Hz (the ZED-M's grab rate), the wrapper's
      # REDUCED grid (224x128 at HD1080, ~7 mm between returns at 1 m, fine for
      # 20 mm cells) and nothing past 2.5 m — the coverage ball ends at ~1.6 m
      # from the camera. Thor, 2026-10-02: the default 10 Hz COMPACT cloud with
      # 10 m depth plus unclipped 4 m rays held octomap_server at ~2 Hz with
      # multi-second gaps; with this and the launch's coverage-ball clip it runs
      # at ~19 Hz (15 mm cells) with a worst gap of 0.17 s. Under `deploy sim`
      # drivers are ignored: pass the same overrides to the hand-launched ZED
      # (runbook step 3).
      param_overrides: "depth.point_cloud_freq:=30.0;depth.point_cloud_res:=REDUCED;depth.max_depth:=2.5"

runtime:
  # Direct dispatch only (/openral/execute_rskill): no LLM in the loop, so the
  # attended operator decides every motion.
  enable_reasoner: false

  enable_octomap: true
  octomap_cloud_topic: /zed/zed_node/point_cloud/cloud_registered
  # world_voxel_deadline_s stays at the 1.0 s default. The grid reaches a RELIABLE subscriber
  # (the kernel's QoS) at 10.0 Hz, max gap 0.36 s (Orin cell, mock hardware, 2026-09-26, 240 s);
  # the 4.4-6 Hz once read here was a BEST_EFFORT probe dropping the fragmented 1.19 MB grid.
  # Measured, not provisional, AT REST (2026-09-25; Thor and Orin ZED-M, arms unpowered at
  # q = 0, each unit's arm-fitted mount, 40 stacked clouds): the robot's own returns end
  # 5-7.5 mm outside the kernel's hulls, so 2 cm clears them with ~12 mm to spare. That spare
  # is the motion budget: the filter pairs each cloud with the nearest 30 Hz joint state
  # (<= ~17 ms off), i.e. ~8.5 mm at 0.5 m/s at the gripper. Do not tighten below 1.5 cm
  # until the tail is measured with the arms MOVING (attended real bringup). Wider costs real
  # obstacles: the restock box sits 2-4 cm from the hanging grippers.
  robot_self_filter_padding_m: 0.02
  # The point of this scene. Reaches the kernel as world_voxel_enabled: true
  # with the real-hardware margin (deploy_e2e.launch.py::_world_voxel_margin_m
  # -> 0.02 m), 20 mm cells and a 1000 ms freshness deadline.
  enable_octomap_kernel_check: true
  # The ZED stamps on wall-clock. Under `deploy sim` (the twin pass) a bare twin would run the
  # graph on the simulated clock and octomap_server would drop every cloud as "from the
  # future". Needs PR #315's runtime.clock_origin; `deploy run` is host_wall regardless.
  clock_origin: host_wall

  enable_slam: false
  enable_nav2: false
  enable_object_detector: false
  enable_reward_monitor: false
  enable_critic: false
  spatial_memory_ingest: false
  approach_skill_id: null

  # The vision attachment leg (SAM 2.1 segmenter + the HAL's attachment-evidence
  # bridge), wired but OFF: the gripper-effort grasp thresholds are unmeasured on
  # the OpenArm and turning it on for real is pending Safety-WG review and a
  # hazard-log entry (docs/reference/real-pick-place-design.md §3 row 4, §4 item 3).
  # Enabled, `deploy run` also turns the kernel's attached-payload check on
  # (1000 ms deadline) — never the leg alone. Topics are the Thor ZED-M driver's;
  # the bridge and the segmenter project only through its CameraInfo, never the
  # manifest's nominal intrinsics (driver fx 1498 vs nominal 960, 2026-10-02).
  vision_attachment:
    enabled: false
    camera: head_zed
    rgb_topic: /zed/zed_node/rgb/color/rect/image
    rgb_camera_info_topic: /zed/zed_node/rgb/color/rect/camera_info
    depth_topic: /zed/zed_node/depth/depth_registered
    depth_camera_info_topic: /zed/zed_node/depth/camera_info
    # The attach links are not frames of the real cell's TF tree (the vendored
    # URDF describes a different assembly); renamed to the vendor bringup's
    # frames. Unverified on the cell (design doc §1.5).
    tf_frames:
      openarm_left_link7: openarm_left_ee_base_link
      openarm_right_link7: openarm_right_ee_base_link

# No grasp_declaration here on purpose: what to pick is task knowledge, not cell posture.
# With the reasoner on, it names the target and perception grounds the search box
# (docs/reference/real-pick-place-design.md §2.2). For an attended direct dispatch, copy
# this scene and add the block (runbook step 4 has the Thor example).

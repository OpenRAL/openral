# Declared place zones of the OpenArm restock station's shelf (``DeployScene.place_zones``,
# ``openral_core.PlaceZone``): paste the list under a restock deploy scene's top-level
# ``place_zones:`` key. A goal-scope place declaration then names the zone its prompt names
# ("restock box x3 into upper slot 2" -> ``zone:upper_slot_2``) and the object tracker
# publishes that box as the place region while a payload is held.
#
# Derived, not measured: each box is the scene's ``placement_success`` region of the same
# alias (Isaac stage frame), moved into ``openarm_base`` by the station's stage->base offset
# (+0.217, 0, -0.7417) m, with its lower face lowered 0.02 m so the slot floor's top voxel
# layer (15 mm cells) lies inside it, as the measured producers' regions hold their support.
# That 0.02 m is a calibration point (CLAUDE.md §1.2). A declared region on fixed furniture
# is an ADR-0097 exception: Safety-WG review, a hazard-log row and an ADR amendment are owed.
place_zones:
  - name: upper_slot_0
    aliases: [upper_0]
    region:
      frame_id: openarm_base
      pose: {xyz: [0.527, 0.4615, -0.188], quat_xyzw: [0.0, 0.0, 0.0, 1.0], frame_id: openarm_base}
      half_extents: [0.188, 0.0618, 0.074]
      evidence_ref: "declared:openarm_restock shelf upper_0"

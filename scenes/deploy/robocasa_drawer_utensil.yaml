# RoboCasa kitchen — deterministic utensil counter→drawer PnP.
#
# Generalization-matrix sibling of robocasa_baguette.yaml: same panda_mobile
# digital twin and full OpenRAL stack (SLAM + Nav2 + OctoMap kernel gate), but
# the place target is a drawer the robot must reach down into, and the payload is
# a thin flat utensil whose primitive decomposition is much finer than the
# baguette's. Used to check that the attached-object collision stack is not
# overfitted to the baguette scene.
#
# ── This scene's start state is LINK-model marginal, not base-placement broken ─
#
# Recorded here because it has twice been assumed to have the fridge scene's
# defect, by analogy. It does not — but the "NO initial-configuration defect"
# this block used to assert is too strong, and the reasoning under it was
# invalid. See the CORRECTION below. Measured on 2026-08-23 by resetting this file
# through the registered adapter and adjudicating the reset pose with
# `openral_hal.sim_sensor_bridge.estop_ground_truth_snapshot` against
# `robots/panda_mobile/robot.yaml`'s real collision model:
#
#   unpinned, seed 1 -> layout 29 / style 24
#   nearest solid kernel-checked pair: robot0_link1 43.3 mm from
#   stack_2_left_group_3_door_g2, 0 MuJoCo contacts, payload resting on the
#   counter, end effector 0.63 m from it.
#
# That 43.3 mm is the same number the evidence ledger already carries for the
# 2026-08-23 `utensil` stop — and that stop was a false positive of the
# ADJUDICATION, not a scene defect: the kernel read -17.3 mm because the
# comparison applied the 21.7 mm voxel term alone instead of the full 88.2 mm
# admissible gap. #144 fixed that by publishing `adjudication_budget`. See
# docs/contributing/validation-matrix.md §"the kernel measures OBB-to-voxel".
#
# ── CORRECTION (2026-08-25): 43.3 mm IS NOT A KERNEL CLEARANCE ────────────────
#
# This block used to conclude "43.3 mm clears the 25 mm occupancy grid, so the
# arm does NOT start inside the kernel's world model". That inference is
# invalid, and it is the same one #154 made for the fridge scene. The kernel
# compares an OBB against voxel CUBES, so the gap a link needs is
# `corner_slop(link) + 21.65 mm` — for `panda_link1`, 75.05 mm. 43.3 mm does not
# reach it. Whether the UNPINNED draw stops is therefore unmeasured against the
# right criterion, not established as clear.
#
# And at the shipped `layout_ids: [3]` pin, a live octomap round on 2026-08-25
# measured the kernel at **-1.94 mm** on `panda_link1`: this scene does take an
# initial-configuration stop on the real map, marginally. The start-state
# census, scoring a geometrically ideal grid, reported no stop here; the live
# map holds cells that grid does not (non-collidable decorative geometry the
# depth camera renders, plus the octree->grid bridge's dilation), which is why
# it is the harsher of the two. See docs/reference/world-map-fidelity.md.
#
# It is left pinned at 3 anyway, deliberately. The stop is entirely LINK-side:
# re-scored against the same live map with exact link geometry instead of the
# manifest OBB, the same state reads **+20.01 mm** and does not stop. The staged
# tighter-primitive work (#166) therefore removes it with no scene change, while
# a re-pin would churn the whole kitchen — pinning changes the draw ORDER — to
# work around a link-model artefact that is already being fixed upstream.
# Revisit if #166 stalls.
#
# So the pin below is for REPRODUCIBILITY. Do not describe this scene as having
# the fridge scene's defect: its stop is a property of the link envelope, not of
# where the base parks, and no layout change would address it.
#
# Run: openral deploy sim --config scenes/deploy/robocasa_drawer_utensil.yaml
# Setup: just sync --group robocasa  +  uv pip install -e _external/robocasa --no-deps

scene:
  id: robocasa/PickPlaceCounterToDrawer
  backend: mujoco
  observation_height: 512
  observation_width: 512
  backend_options:
    mode: prebuilt
    prebuilt_task: PickPlaceCounterToDrawer
    robots: ["PandaMobile"]
    controller: OSC_POSE
    obj_groups: utensil
    # DO NOT REMOVE — this pin makes the round reproducible from this file
    # alone (CLAUDE.md §1.8). The seed does not pin the kitchen: layout, style,
    # fixtures, which of the layout's 2-31 qualifying TOP_DRAWERs the task
    # resolves, the door-open amounts and the robot spawn deviation are all
    # drawn from one shared `env.rng`, so any upstream change to the draw order
    # silently reshuffles the scene at seed 1 and two rounds stop being
    # comparable even though both say `seed: 1`.
    #
    # Layout 3 measured (2026-08-23, reset pose, method in the header block):
    # nearest solid kernel-checked pair robot0_link1 77.5 mm from
    # stack_1_right_group_2_door_g1, 0 contacts, payload on the counter, end
    # effector 0.47 m from it. That is 3x the 25 mm occupancy grid and more
    # headroom than the unpinned draw's 43.3 mm.
    #
    # Note pinning is NOT a no-op even when it names the layout already drawn:
    # it changes the draw ORDER, so `layout_ids: [29]` yields a different
    # kitchen instance (style 29, 80.4 mm) than the unpinned draw of layout 29
    # (style 24, 43.3 mm). Layout 30 — correct for the fridge scene — is WRONG
    # here: it puts robot0_link1 at 0.000 m against stack_4_left_group_3_door_g1.
    # The two scenes park the base against different fixtures, so a layout that
    # is good for one says nothing about the other.
    layout_ids: [3]

seed: 1

# ADR-0097 place-phase declaration — DELIBERATELY ABSENT, pending one live run.
# See scenes/deploy/robocasa_baguette.yaml for the shape and the rationale of
# every field; this scene is the one case where the target cannot be named
# honestly from the authoring host, and guessing here is not the safe direction.
#
# `PickPlaceCounterToDrawer` resolves `register_fixture_ref("drawer",
# FixtureType.TOP_DRAWER)` — any RoboCasa `Drawer` whose z sits in [0.7, 0.9] —
# and drawers are not named in the layout files at all: they are levels of a
# `stack`, so the fixture name is generated as `<stack>_<group>_<level index>`
# (e.g. `stack_1_main_group_2`) and the body is `<fixture>_main`. Every layout
# declares MANY qualifying drawers (2-31 drawer levels each), so `rng.choice`
# picks one of many and the same generated name recurs across layouts pointing at
# a DIFFERENT drawer each time. Unlike the sink / fridge scenes — one candidate
# per layout, where a wrong guess simply does not resolve and is refused — a
# guess here would very likely name a real receptacle somewhere else in the
# kitchen and arm the place witness and its approach allowance at it
# (hazard HZ-0097-2). No declaration keeps the pre-ADR-0097 behaviour, which is
# the fail-closed direction.
#
# The 2026-08-22 live run on the Spark confirmed the decision to leave this
# scene undeclared, and invalidated the procedure #142 wrote for filling it in.
#
# `env.fixture_refs["drawer"].name` DOES NOT EXIST. In the live seed-1 env the
# `fixture_refs` values are TUPLES with no `.name` attribute, and the fixture
# name they carry is `None` for the drawer as it is for the sink, the counter
# and the fridge. That advice is not merely unreliable, it is unexecutable — and
# following it is literally how the sink and fridge scenes shipped wrong names
# in #142 (both refused fail-closed by the HAL, both corrected here).
#
# Nor is the obvious substitute — grep the MuJoCo body table for `drawer` —
# enough on this scene. At seed 1 the only bodies matching `drawer` in
# `PickPlaceCounterToDrawer` belong to the FRIDGE's freezer drawers. The counter
# drawer this task places into is a `stack` level named `stack_2_left_group_3_*`,
# which the substring `drawer` does not match at all. So a reader who greps
# `drawer` and declares the first hit would arm the witness and its approach
# allowance at a fridge freezer drawer on the other side of the kitchen —
# exactly HZ-0097-2, and worse than the sink / fridge failure mode, because a
# name that RESOLVES cannot fail closed.
#
# So this scene STAYS UNDECLARED. Filling it in honestly needs a live run to
# establish which `stack_<n>_<side>_group_<level>` body the task's
# `register_fixture_ref("drawer", ...)` actually resolved to on this seed — the
# fixture object's identity, not a name match — and that evidence does not
# exist yet. Until it does, no declaration is the fail-closed direction and the
# correct call.
#
# When that evidence exists, the shape to add (recipe and the timeout rationale
# are in scenes/deploy/robocasa_baguette.yaml) is:
#
#   place_declaration:
#     target_id: "sim:<that fixture>_main"
#     object_id: ""
#     timeout_s: 300.0
#     stamp_ns: 0

# RoboCasa kitchen — deterministic cup counter→sink PnP.
#
# Generalization-matrix sibling of robocasa_baguette.yaml: same panda_mobile
# digital twin and full OpenRAL stack (SLAM + Nav2 + OctoMap kernel gate), but a
# different fixture pair (sink instead of cabinet) and a different payload
# geometry (cup: tall, hollow, small footprint vs the baguette's long thin bar).
# Used to check that the attached-object collision stack is not overfitted to
# the baguette scene.
#
# Run: openral deploy sim --config scenes/deploy/robocasa_sink_cup.yaml
# Setup: just sync --group robocasa  +  uv pip install -e _external/robocasa --no-deps

scene:
  id: robocasa/PickPlaceCounterToSink
  backend: mujoco
  # 512² for the same reason as robocasa_baguette.yaml: at 128² the open-vocab
  # detector cannot ground the object. VLA policies downsample their own input.
  observation_height: 512
  observation_width: 512
  backend_options:
    mode: prebuilt
    prebuilt_task: PickPlaceCounterToSink
    robots: ["PandaMobile"]
    controller: OSC_POSE
    obj_groups: cup

# Pin the complete kitchen layout / robot start, not only the object group.
seed: 1

# ADR-0097 place-phase declaration — see scenes/deploy/robocasa_baguette.yaml for
# the full field-by-field rationale (goal scoping, clock domain, why no region).
#
# target_id — NOT YET VERIFIED AGAINST A LIVE RUN. `PickPlaceCounterToSink`
#   resolves its place target as `register_fixture_ref("sink",
#   FixtureType.SINK)`, and every one of RoboCasa's 60 kitchen layouts declares
#   exactly ONE sink, so the fixture choice is forced — only the layout's own
#   name for it varies, and which layout seed 1 samples is knowable only by
#   running the env (RoboCasa is not installable on the authoring host).
#   `sink_main_group_1` is the most frequent name in the layout corpus (12/60;
#   next `sink_island_group_1` and `sink_right_group_1`, 7 each), and the body is
#   `<fixture>_main` per robosuite's naming. A WRONG name here cannot silently
#   name a different sink — there is only one — so it fails the safe way: the HAL
#   logs `Place declaration target ... names no MuJoCo body; refused`, no witness
#   can arm, and the run behaves exactly as it does with no declaration at all.
#   To fix it after a live run, read the fixture off that log line (or off
#   `env.fixture_refs["sink"].name`) and replace the name below.
place_declaration:
  target_id: "sim:sink_main_group_1_main"
  object_id: ""
  timeout_s: 120.0
  stamp_ns: 0

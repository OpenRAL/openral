# SO-101 laptop bench rig — converted from the retired
# deployments/so101.yaml RobotEnvironment.
#
# No `sensors:` block: `top` and `wrist` are robot cameras, so their real-hardware
# `deploy_binding`s live in robots/so101_follower/robot.yaml (a deploy scene never
# touches a robot camera). Host-specific — retune the /dev/video* paths there per
# host with `openral detect --deployment`.
#
# HAL facts (serial port + lerobot calibration identity) live in the `hal:`
# binding below (the HAL analogue of a sensor `deploy_binding`), so this scene
# is self-contained: `openral deploy run --config scenes/deploy/so101_bench.yaml`.
# Calibration is COMMITTED next to this scene
# (scenes/deploy/calibration/so_follower.json) so the deploy owns it instead
# of the ambient HF cache; relative `calibration_dir` resolves against this
# file's directory. `--hal` still wins for one-off overrides (precedence:
# --hal > scene hal > robot.yaml).
scene:
  id: so101_bench
robot_id: so101_follower
# Host-specific HAL binding. port: this arm enumerates on
# /dev/ttyACM0 (robot.yaml's generic default is /dev/ttyUSB0). id +
# calibration_dir load the committed Feetech calibration
# (calibration/so_follower.json, relative to this file); without it every
# send_action/read_state raises "has no calibration registered".
hal:
  defaults:
    port: "/dev/ttyACM0"
    id: "so_follower"
    calibration_dir: "calibration"
    calibrate_on_connect: false
# Cameras: every camera here is a robot sensor, so its real-hardware binding lives in
# robots/so101_follower/robot.yaml (a deploy scene never touches a robot camera —
# openral_core.check_scene_sensor_overrides). A workcell camera would go under
# `sensors:` with its own name.

# Committed deploy posture (DeployRuntime) — every runtime leg pinned
# explicitly so nothing depends on hidden CLI defaults. Precedence:
# CLI flag > this block > auto. The SO-101 bench is a fixed-base arm with two
# RGB cameras: no lidar/depth → SLAM/Nav2/octomap off; the continuous
# open-vocab detector stays on for locate_in_view; the reward monitor is on
# by default (auto-pairs Robometer from the VLA's reward_rskill_name).
# Both perception legs are gstreamer-free ROS-topic consumers: the detector
# (ros_image_detector_node) and reward monitor (reward_monitor_node) each
# subscribe to /openral/cameras/<name>/image — here published by the
# opencv_thread bindings in robot.yaml — and need no GStreamer/NVMM. The detector
# auto-selects its CPU-ONNX tier when gst-inspect-1.0/nvinfer is absent.
runtime:
  enable_slam: false
  enable_nav2: false
  enable_octomap: false
  enable_octomap_kernel_check: true
  # Detector OFF by default on this bench: the two detector processes
  # (continuous + on-demand locator) held 2.2 GB of the 8 GB card, and with
  # Robometer (5.3 GB incl. CUDA context) resident the VLA's own 1.4 GB
  # weights load hit CUDA OOM (125 MiB free) — measured live 2026-08-03.
  # The 8 GB budget fits exactly TWO GPU tenants: the reward monitor and the
  # VLA. Flip back on (or via a CLI override) on a ≥12 GB host where
  # locate_in_view is worth its VRAM.
  enable_object_detector: false
  object_detector_onnx: null
  object_detector_manifest: null
  object_detector_query: null
  object_detector_locators: null
  enable_reward_monitor: true
  reward_monitor_manifest: null
  reward_monitor_task: null
  enable_critic: false
  spatial_memory_ingest: true
  # Deliberately null: the MoveIt approach path needs a move_group server in
  # the deploy graph, and the SO-101 has no MoveIt config in-repo (no SRDF /
  # moveit_config; deploy_e2e.launch spawns no move_group). Setting an
  # approach_skill_id here would make EVERY ExecuteRskill goal abort at the
  # pre-inference approach step ("fatal approach attempt failed"). The
  # starting-pose fallback is a bounded joint ramp published through the
  # normal candidate-action -> safety-kernel -> safe-action path. Wire a
  # MoveIt approach only after an SO-101 config + move_group land in the graph.
  approach_skill_id: null

# NOTE: an earlier `extra_allowed_collision_pairs: [[base, lower_arm]]` ACM
# override lived here to suppress a self-collision false-E-stop at the home pose
# (base<->lower_arm reported -0.078 m while the true clearance is +0.16 m). That
# was an expedient masking a geometry bug; it has been REMOVED. The real fix
# (issue #84) replaces the base's over-conservative capsule with a
# tight OBB in robots/so101_follower/robot.yaml, so base<->lower_arm (and
# base<->wrist) clear at reachable poses without loosening the ACM. Full base
# self-collision detection is restored.

# SO-101 follower arm in a 100×61.5×75 cm tabletop box — deploy playground.
#
# Env-only DeployScene (no task, no eval) — boots the full OpenRAL stack
# (HAL + reasoner + safety kernel) for the SO-101 follower arm. Robot is
# auto-resolved via ``SCENES.fixed_robot("so101_box") == "so101_follower"``;
# the same so100 lifecycle node serves both so100 and so101 manifests
# (issue #191 Phase 3b — manifest-driven, bare twin).
#
# Bare twin, explicitly: ``composition`` below makes ``deploy sim`` build the
# arm's own ``MujocoArmHAL`` twin inside the composed box arena (a registered
# scene id with no ``composition`` would scene-attach instead). Scene-attach is
# not usable here: the so101_box rollout packs JOINT_POSITION as 5 arm joints,
# so the SO-101's 6-wide (arm + gripper) actions are rejected. Before this
# block existed ``deploy sim`` built the bare arm with no box at all.
#
# All ``BoxSceneOptions`` defaults apply (box geometry, camera poses, tube
# and slotted-block dimensions). The reasoner picks the active rSkill at
# runtime from ``rskills/`` — no scene-level task is prescribed.
#
# Run::
#
#     openral deploy sim --config scenes/deploy/so101_box.yaml

scene:
  id: so101_box
  backend: mujoco
  observation_height: 480
  observation_width: 640
  cameras: ["oak_top", "wrist"]
robot_id: so101_follower
safety:
  workspace_box_min_xyz: [-0.3, -0.3, 0.02]
  workspace_box_max_xyz: [0.3, 0.3, 0.45]
# The box arena (walls, overhead ``oak_top`` camera, block + tube), composed
# around the robot's own MJCF with ``BoxSceneOptions`` defaults.
composition:
  composer: "openral_sim.backends.so101_box._assets:compose_so101_box_mjcf"
  params: {}

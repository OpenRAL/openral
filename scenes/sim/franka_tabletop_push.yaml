# Franka Panda tabletop-push scene — robot-agnostic test fixture.
#
# Minimal scene for the ``tabletop_push`` backend with franka_panda.
# Uses all-default backend_options so no robot-specific joint
# calibration is assumed (unlike tabletop_cube_push.yaml which carries
# SO-101 joint offsets/scales). Suitable for pure HAL lifecycle tests
# that only check JointState publication, not policy execution.
#
# Run:
#   openral sim run --config scenes/sim/franka_tabletop_push.yaml \
#                   --robot franka_panda

robot_id: franka_panda

scene:
  id: tabletop_push
  backend: mujoco
  observation_height: 256
  observation_width: 256
  cameras: ["top"]

task:
  id: tabletop_push/push_to_goal
  scene_id: tabletop_push
  instruction: "push the red cube onto the green goal marker"
  max_steps: 300
  success_key: is_success

seed: 42
n_episodes: 1
record_video: false

metadata:
  honest_scope: "franka_panda HAL lifecycle smoke fixture — not a tuned benchmark entry"

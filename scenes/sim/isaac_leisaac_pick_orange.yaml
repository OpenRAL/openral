# LeIsaac PickOrange (LightwheelAI/leisaac v0.1.0, Apache-2.0) on OpenRAL's own
# Isaac Sim 6.x backend: the SO-101 in LeIsaac's kitchen, three oranges and a
# plate on the counter, graded like LeIsaac's `task_done`.
#
# Reproduced from LeIsaac's task config (leisaac/tasks/pick_orange,
# leisaac/tasks/template/single_arm_env_cfg.py, leisaac/assets/robots/lerobot.py):
#
# * Stage: `kitchen_with_orange/scene.usd` from the v0.1.0 release zip, fetched
#   once into ~/.cache/openral/isaac-environments/ and checked against its sha256
#   (`environment_archive`; never committed). The oranges and the plate are rigid
#   bodies INSIDE that USD (`stage_objects`), graded where they lie.
# * Isaac 6.1 load fixes LeIsaac's 4.5-5.1 stage needs: 28 Xform prims carry a
#   PhysicsCollisionAPI 6.1 PhysX rejects (`strip_xform_colliders`), and the stage
#   ships no lights; LeIsaac adds this dome light (`dome_light`).
# * Robot: robots/so101_follower imported from its URDF (the same so101_new_calib
#   kinematics as LeIsaac's so101_follower.usd), fixed base, spawned at LeIsaac's
#   init_state pos (2.2, -0.61, 0.89), rot wxyz (0, 0, 0, 1) = a 180 deg yaw; all
#   joints at the URDF zero, as LeIsaac's joint_pos.
# * Cameras: LeIsaac's `front` (child of `base`) and `wrist` (child of `gripper`)
#   at their Isaac Lab ROS-convention offsets, 640x480; the field of view is the
#   PinholeCameraCfg's 2*atan(horizontal_aperture / (2 * focal_length)):
#   front 38.11 / 28.7 mm -> 67.163 deg, wrist 36.83 / 36.5 mm -> 53.544 deg. The
#   manifest's `top` sensor (observation.images.camera1) renders LeIsaac's front view.
# * Success: every orange's centre within the plate's centre +-0.10 m in x/y and
#   +-0.07 m in z (LeIsaac `task_done`), at rest for settle_s. LeIsaac also
#   requires the arm back at its rest pose; that term is NOT graded here.
#
# Not reproduced: LeIsaac's per-episode randomization (objects +-3 cm x/y, the
# front camera +-2.5 cm / +-2.5 deg); every episode starts from the authored layout.
#
# Requirements: NVIDIA RTX GPU, Isaac Sim 6.x (a binary install such as
# /opt/isaac-sim, or the sidecar venv), network access to github.com on first use.
#
# Run::
#
#     openral sim run --config scenes/sim/isaac_leisaac_pick_orange.yaml \
#       --rskill <an SO-101 rSkill>

robot_id: "so101_follower"

base_pose:
  xyz: [2.2, -0.61, 0.89]
  quat_xyzw: [0.0, 0.0, 1.0, 0.0]  # LeIsaac rot wxyz (0, 0, 0, 1): yaw 180 deg
  frame_id: world

scene:
  id: isaac_sim
  backend: isaacsim
  observation_height: 480
  observation_width: 640
  cameras: ["top", "wrist"]
  backend_options:
    # First boot also downloads + extracts the 73 MB stage.
    boot_timeout_s: 1200
    environment_archive:
      url: "https://github.com/LightwheelAI/leisaac/releases/download/v0.1.0/kitchen_with_orange.zip"
      sha256: "d314c54b63a17e91402bfaddf26e21ff614adf2430fa092b78897f15b8adea34"
      usd: "kitchen_with_orange/scene.usd"
    strip_xform_colliders: true
    dome_light:
      intensity: 3000.0
      color: [0.75, 0.75, 0.75]
    # The stage's own rigid bodies (USD /Root/<name>/<name>; the outer Xform holds looks).
    stage_objects:
      - {name: orange_1, prim: Orange001/Orange001}
      - {name: orange_2, prim: Orange002/Orange002}
      - {name: orange_3, prim: Orange003/Orange003}
      - {name: plate, prim: Plate/Plate}
    camera_mounts:
      top:  # LeIsaac `front`
        link: base
        xyz: [0.0, -0.5, 0.6]
        quat_wxyz: [0.1650476, -0.9862856, 0.0, 0.0]
        axes: ros
        hfov_deg: 67.163
      wrist:
        link: gripper
        xyz: [-0.001, 0.1, -0.04]
        quat_wxyz: [-0.404379, -0.912179, -0.0451242, 0.0486914]
        axes: ros
        hfov_deg: 53.544
    placement_success:
      regions:
        on_plate:
          min_xyz: [-0.10, -0.10, -0.07]
          max_xyz: [0.10, 0.10, 0.07]
          relative_to: plate
      grades:
        # Oranges roll: no upright requirement, one level (in the plate or not).
        - {name: complete, score: 1.0, region: target}
      settle_s: 0.5
      tasks:
        "Pick three oranges and put them into the plate":
          - {object: orange_1, target: on_plate}
          - {object: orange_2, target: on_plate}
          - {object: orange_3, target: on_plate}

task:
  id: isaac_sim/leisaac_pick_orange
  scene_id: isaac_sim
  instruction: "Pick three oranges and put them into the plate"
  max_steps: 750  # LeIsaac episode_length_s 25 s at the SO-101's 30 Hz

seed: 0
n_episodes: 1

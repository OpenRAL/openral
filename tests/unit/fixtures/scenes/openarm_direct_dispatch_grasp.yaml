# TEST FIXTURE: an OpenArm deploy scene carrying a grasp_declaration for an attended
# DIRECT dispatch (reasoner off) — the path a committed scene no longer uses, since what
# to pick is task knowledge the reasoner names and perception grounds (real
# pick-and-place design §2.2). Exercises DeployScene's grasp_declaration rules and the
# CLI's forwarding of the block to the runner. Not a cell posture; never deploy it.
robot_id: "openarm"

scene:
  id: openarm_direct_dispatch_grasp

runtime:
  enable_reasoner: false

grasp_declaration:
  target_id: "cell:restock_box"
  object_id: ""
  contact_links:
    - openarm_left_finger_pair
    - openarm_right_finger_pair
  timeout_s: 70.0
  stamp_ns: 0

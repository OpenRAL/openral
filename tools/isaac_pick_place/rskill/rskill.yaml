# The scripted Isaac pick/place validation driver (tools/isaac_pick_place/driver.py).
# Not a policy and not a publishable rSkill: run_trial.sh links this directory into
# rskills/ only for the duration of a run.
schema_version: "0.1"
name: "local/isaac-pick-place-scripted"
version: "0.0.1"
license: "apache-2.0"
role: "s1"
kind: "vla"
model_family: "isaac_pick_place_scripted"
embodiment_tags: ["openarm"]
actuators_required:
  - kind: "joint_position"
    control_mode_semantics:
      mode: "absolute"
runtime: "pytorch"
quantization:
  dtype: "fp32"
  backend: "pytorch"
weights_uri: "local://isaac_pick_place/driver"
state_contract:
  dim: 16
action_contract:
  dim: 16
  representation: "joint_positions"
  joint_units: "radians"
chunk_size: 1
n_action_steps: 1
latency_budget:
  per_chunk_ms: 1000.0
policy_extras:
  chunk_prefetch: false
description: >
  Scripted perception-driven pick/place driver for the Isaac deploy-sim validation run.
actions: ["pick", "place"]
objects: ["box"]
scenes: ["tabletop"]
